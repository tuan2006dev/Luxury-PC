<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title
        th:text="${news.metaTitle != null and !news.metaTitle.isEmpty() ? news.metaTitle : news.title + ' - LuxuryPC'}">
    </title>
    <!-- Thẻ Meta cho SEO -->
    <meta name="description" th:content="${news.metaDescription != null ? news.metaDescription : news.summary}">
    <meta name="keywords" th:content="${news.metaKeywords}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" th:href="@{/images/logo.svg}" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
</head>

<body>
    <div th:replace="~{layout/header :: header}"></div>

    <style>
        .news-page {
            padding: 40px 0;
            background: #f8fafc;
            font-family: 'Outfit', sans-serif;
        }

        .news-container {
            max-width: 1200px;
            margin: 0 auto;
            display: flex;
            gap: 30px;
            padding: 0 20px;
        }

        .news-main {
            flex: 1;
            background: #fff;
            border-radius: 12px;
            padding: 40px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .news-sidebar {
            width: 320px;
            flex-shrink: 0;
        }

        /* Chi tiết bài viết */
        .breadcrumb {
            font-size: 14px;
            color: #64748b;
            margin-bottom: 20px;
        }

        .breadcrumb a {
            color: #0ea5e9;
            text-decoration: none;
        }

        .breadcrumb a:hover {
            text-decoration: underline;
        }

        .breadcrumb span {
            margin: 0 8px;
        }

        .detail-title {
            font-size: 32px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 16px;
            line-height: 1.3;
        }

        .detail-meta {
            display: flex;
            gap: 20px;
            align-items: center;
            font-size: 14px;
            color: #64748b;
            margin-bottom: 30px;
            padding-bottom: 20px;
            border-bottom: 1px solid #f1f5f9;
        }

        .detail-meta span {
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .detail-summary {
            font-size: 16px;
            font-weight: 500;
            color: #475569;
            margin-bottom: 30px;
            padding: 20px;
            background: #f8fafc;
            border-left: 4px solid #0ea5e9;
            border-radius: 0 8px 8px 0;
            line-height: 1.6;
        }

        /* Nội dung bài viết từ TinyMCE */
        .detail-content {
            font-size: 16px;
            color: #334155;
            line-height: 1.8;
        }

        .detail-content h2,
        .detail-content h3 {
            color: #1e293b;
            margin-top: 30px;
            margin-bottom: 16px;
            font-weight: 600;
        }

        .detail-content h2 {
            font-size: 24px;
        }

        .detail-content h3 {
            font-size: 20px;
        }

        .detail-content p {
            margin-bottom: 16px;
        }

        .detail-content img {
            max-width: 100%;
            height: auto;
            border-radius: 8px;
            margin: 20px 0;
            display: block;
        }

        .detail-content ul,
        .detail-content ol {
            margin-bottom: 16px;
            padding-left: 24px;
        }

        .detail-content li {
            margin-bottom: 8px;
        }

        .detail-content a {
            color: #0ea5e9;
            text-decoration: none;
        }

        .detail-content a:hover {
            text-decoration: underline;
        }

        .detail-content blockquote {
            border-left: 4px solid #cbd5e1;
            margin: 0 0 16px 0;
            padding: 10px 20px;
            background: #f8fafc;
            font-style: italic;
            color: #475569;
        }

        /* Tác giả box */
        .author-box {
            margin-top: 40px;
            padding: 20px;
            border: 1px solid #e2e8f0;
            border-radius: 8px;
            display: flex;
            gap: 16px;
            align-items: center;
        }

        .author-avatar {
            width: 60px;
            height: 60px;
            border-radius: 50%;
            background: #e0f2fe;
            display: flex;
            align-items: center;
            justify-content: center;
            color: #0ea5e9;
            font-size: 24px;
            font-weight: bold;
        }

        .author-info h4 {
            margin: 0 0 4px 0;
            font-size: 16px;
            color: #1e293b;
        }

        .author-info p {
            margin: 0;
            font-size: 14px;
            color: #64748b;
        }

        /* Sidebar */
        .sidebar-widget {
            background: #fff;
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
        }

        .widget-title {
            font-size: 18px;
            font-weight: 700;
            color: #1e293b;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 2px solid #f1f5f9;
            position: relative;
        }

        .widget-title::after {
            content: '';
            position: absolute;
            left: 0;
            bottom: -2px;
            width: 40px;
            height: 2px;
            background: #0ea5e9;
        }

        .category-list {
            list-style: none;
            padding: 0;
            margin: 0;
        }

        .category-list li {
            margin-bottom: 8px;
        }

        .category-list a {
            display: block;
            padding: 8px 12px;
            color: #475569;
            text-decoration: none;
            border-radius: 6px;
            transition: all 0.2s;
        }

        .category-list a:hover {
            background: #f0f9ff;
            color: #0ea5e9;
            font-weight: 500;
        }

        .top-post {
            display: flex;
            gap: 12px;
            margin-bottom: 16px;
        }

        .top-post:last-child {
            margin-bottom: 0;
        }

        .top-post-img {
            width: 80px;
            height: 60px;
            object-fit: cover;
            border-radius: 6px;
        }

        .top-post-info {
            flex: 1;
        }

        .top-post-title {
            font-size: 14px;
            font-weight: 600;
            color: #1e293b;
            text-decoration: none;
            display: -webkit-box;
            -webkit-line-clamp: 2;
            line-clamp: 2;
            -webkit-box-orient: vertical;
            overflow: hidden;
            line-height: 1.3;
        }

        .top-post-title:hover {
            color: #0ea5e9;
        }

        .top-post-date {
            font-size: 12px;
            color: #94a3b8;
            margin-top: 4px;
            display: block;
        }

        @media (max-width: 991px) {
            .news-container {
                flex-direction: column;
            }

            .news-sidebar {
                width: 100%;
            }
        }
    </style>

    <div class="news-page">
        <div class="news-container">
            <!-- Nội dung bài viết -->
            <div class="news-main">
                <div class="breadcrumb">
                    <a href="/">Trang chủ</a> <span>/</span>
                    <a href="/news">Tin tức</a> <span>/</span>
                    <span th:text="${news.category != null ? news.category.name : 'Chưa phân loại'}">Category</span>
                </div>

                <h1 class="detail-title" th:text="${news.title}">Tiêu đề bài viết</h1>

                <div class="detail-meta">
                    <span><i class="fa-regular fa-user"></i> <span
                            th:text="${news.author != null ? news.author.fullName : 'Ẩn danh'}"></span></span>
                    <span><i class="fa-regular fa-calendar"></i> <span
                            th:text="${#dates.format(news.createdAt, 'dd/MM/yyyy HH:mm')}"></span></span>
                    <span><i class="fa-regular fa-eye"></i> <span th:text="${news.formattedViewCount}"></span> lượt
                        xem</span>
                    <span><i class="fa-regular fa-clock"></i> <span th:text="${news.readingTime}"></span> phút
                        đọc</span>
                </div>

                <div class="detail-summary" th:if="${news.summary != null and !news.summary.isEmpty()}"
                    th:text="${news.summary}">
                    Tóm tắt bài viết...
                </div>

                <div class="detail-content" th:utext="${news.content}">
                    <!-- Nội dung HTML từ TinyMCE sẽ hiển thị ở đây -->
                </div>

                <div class="author-box">
                    <div class="author-avatar">
                        <i class="fa-regular fa-user"></i>
                    </div>
                    <div class="author-info">
                        <h4>Được viết bởi: <span
                                th:text="${news.author != null ? news.author.fullName : 'LuxuryPC Team'}"></span></h4>
                        <p>Cảm ơn bạn đã đọc bài viết này.</p>
                    </div>
                </div>
            </div>

            <!-- Cột Sidebar -->
            <div class="news-sidebar">
                <!-- Widget Danh mục -->
                <div class="sidebar-widget">
                    <h3 class="widget-title">Chuyên mục</h3>
                    <ul class="category-list">
                        <li th:each="cat : ${categories}">
                            <a th:href="@{/news(category=${cat.id})}" th:text="${cat.name}">Category</a>
                        </li>
                    </ul>
                </div>

                <!-- Widget Xem nhiều -->
                <div class="sidebar-widget" th:if="${!#lists.isEmpty(topViewed)}">
                    <h3 class="widget-title">Bài viết nổi bật</h3>
                    <div class="top-post" th:each="tn : ${topViewed}">
                        <a th:href="@{/news/{slug}(slug=${tn.slug})}">
                            <img class="top-post-img"
                                th:src="${tn.thumbnail != null ? '/images/news/' + tn.thumbnail : '/images/placeholder.jpg'}"
                                alt="Thumb">
                        </a>
                        <div class="top-post-info">
                            <a class="top-post-title" th:href="@{/news/{slug}(slug=${tn.slug})}"
                                th:text="${tn.title}">Tiêu đề</a>
                            <span class="top-post-date"><i class="fa-regular fa-calendar"></i> <span
                                    th:text="${#dates.format(tn.createdAt, 'dd/MM/yyyy')}"></span></span>
                        </div>
                    </div>
                </div>

                <!-- Widget Bài viết liên quan -->
                <div class="sidebar-widget" th:if="${!#lists.isEmpty(relatedNews)}">
                    <h3 class="widget-title">Bài viết liên quan</h3>
                    <div class="top-post" th:each="rn : ${relatedNews}">
                        <a th:href="@{/news/{slug}(slug=${rn.slug})}">
                            <img class="top-post-img"
                                th:src="${rn.thumbnail != null ? '/images/news/' + rn.thumbnail : '/images/placeholder.jpg'}"
                                alt="Thumb">
                        </a>
                        <div class="top-post-info">
                            <a class="top-post-title" th:href="@{/news/{slug}(slug=${rn.slug})}"
                                th:text="${rn.title}">Tiêu đề</a>
                            <span class="top-post-date"><i class="fa-regular fa-calendar"></i> <span
                                    th:text="${#dates.format(rn.createdAt, 'dd/MM/yyyy')}"></span></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{layout/footer :: footer}"></div>

    <script th:src="@{/js/script.js}"></script>
</body>

</html>
