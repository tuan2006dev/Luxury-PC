<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title
        th:text="${news.metaTitle != null and !news.metaTitle.isEmpty() ? news.metaTitle : news.title + ' - LuxuryPC'}">
    </title>
    <!-- Thẻ Meta cho SEO -->
    <meta name="description" th:content="${news.metaDescription != null ? news.metaDescription : news.summary}">
    <meta name="keywords" th:content="${news.metaKeywords}">
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" th:href="@{/images/logo.svg}" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" th:href="@{/css/news/news-detail.css}" />
</head>

<body>
    <div th:replace="~{layout/header :: header}"></div>

    <div class="news-page">
        <div class="news-container">
            <!-- Nội dung bài viết -->
            <div class="news-main">
                <div class="breadcrumb">
                    <a href="/">Trang chủ</a> <span>/</span>
                    <a href="/news">Tin tức</a> <span>/</span>
                    <span th:text="${news.category != null ? news.category.name : 'Chưa phân loại'}">Category</span>
                </div>

                <h1 class="detail-title" th:text="${news.title}">Tiêu đề bài viết</h1>

                <div class="detail-meta">
                    <span><i class="fa-regular fa-user"></i> <span
                            th:text="${news.author != null ? news.author.fullName : 'Ẩn danh'}"></span></span>
                    <span><i class="fa-regular fa-calendar"></i> <span
                            th:text="${#dates.format(news.createdAt, 'dd/MM/yyyy HH:mm')}"></span></span>
                    <span><i class="fa-regular fa-eye"></i> <span th:text="${news.formattedViewCount}"></span> lượt
                        xem</span>
                    <span><i class="fa-regular fa-clock"></i> <span th:text="${news.readingTime}"></span> phút
                        đọc</span>
                </div>

                <div class="detail-summary" th:if="${news.summary != null and !news.summary.isEmpty()}"
                    th:text="${news.summary}">
                    Tóm tắt bài viết...
                </div>

                <div class="detail-content" th:utext="${news.content}">
                    <!-- Nội dung HTML từ TinyMCE sẽ hiển thị ở đây -->
                </div>

                <div class="author-box">
                    <div class="author-avatar">
                        <i class="fa-regular fa-user"></i>
                    </div>
                    <div class="author-info">
                        <h4>Được viết bởi: <span
                                th:text="${news.author != null ? news.author.fullName : 'LuxuryPC Team'}"></span></h4>
                        <p>Cảm ơn bạn đã đọc bài viết này.</p>
                    </div>
                </div>
            </div>

            <!-- Cột Sidebar -->
            <div class="news-sidebar">
                <!-- Widget Danh mục -->
                <div class="sidebar-widget">
                    <h3 class="widget-title">Chuyên mục</h3>
                    <ul class="category-list">
                        <li th:each="cat : ${categories}">
                            <a th:href="@{/news(category=${cat.id})}" th:text="${cat.name}">Category</a>
                        </li>
                    </ul>
                </div>

                <!-- Widget Xem nhiều -->
                <div class="sidebar-widget" th:if="${!#lists.isEmpty(topViewed)}">
                    <h3 class="widget-title">Bài viết nổi bật</h3>
                    <div class="top-post" th:each="tn : ${topViewed}">
                        <a th:href="@{/news/{slug}(slug=${tn.slug})}">
                            <img class="top-post-img"
                                th:src="${tn.thumbnail != null ? '/images/news/' + tn.thumbnail : '/images/placeholder.jpg'}"
                                alt="Thumb">
                        </a>
                        <div class="top-post-info">
                            <a class="top-post-title" th:href="@{/news/{slug}(slug=${tn.slug})}"
                                th:text="${tn.title}">Tiêu đề</a>
                            <span class="top-post-date"><i class="fa-regular fa-calendar"></i> <span
                                    th:text="${#dates.format(tn.createdAt, 'dd/MM/yyyy')}"></span></span>
                        </div>
                    </div>
                </div>

                <!-- Widget Bài viết liên quan -->
                <div class="sidebar-widget" th:if="${!#lists.isEmpty(relatedNews)}">
                    <h3 class="widget-title">Bài viết liên quan</h3>
                    <div class="top-post" th:each="rn : ${relatedNews}">
                        <a th:href="@{/news/{slug}(slug=${rn.slug})}">
                            <img class="top-post-img"
                                th:src="${rn.thumbnail != null ? '/images/news/' + rn.thumbnail : '/images/placeholder.jpg'}"
                                alt="Thumb">
                        </a>
                        <div class="top-post-info">
                            <a class="top-post-title" th:href="@{/news/{slug}(slug=${rn.slug})}"
                                th:text="${rn.title}">Tiêu đề</a>
                            <span class="top-post-date"><i class="fa-regular fa-calendar"></i> <span
                                    th:text="${#dates.format(rn.createdAt, 'dd/MM/yyyy')}"></span></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{layout/footer :: footer}"></div>

    <script th:src="@{/js/script.js}"></script>
</body>

</html>
