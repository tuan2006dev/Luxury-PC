<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="icon" type="image/png" th:href="@{/logo.png}" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title th:text="${news.title} + ' - Luxury PC'">Chi Tiết Tin Tức</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/news.css}">
</head>

<body>
    <div th:replace="~{layout/header :: header}"></div>

    <div class="article-container">
        <div class="breadcrumb">
            <a th:href="@{/}">Trang chủ</a> <i class="fa-solid fa-angle-right" style="font-size:12px;"></i>
            <a th:href="@{/news}">Tin tức</a> <i class="fa-solid fa-angle-right" style="font-size:12px;"></i>
            <span>Bài viết</span>
        </div>

        <h1 class="article-title" th:text="${news.title}">Tiêu đề bài viết</h1>

        <div class="article-meta">
            <span><i class="fa-regular fa-calendar"></i> Đăng lúc: <span
                    th:text="${#dates.format(news.createdAt, 'dd/MM/yyyy HH:mm')}"></span></span>
            <span><i class="fa-regular fa-user"></i> Tác giả: <span
                    th:text="${news.author != null ? news.author.fullName : 'Ẩn danh'}"></span></span>
        </div>

        <div th:if="${news.summary != null && !news.summary.isEmpty()}" class="article-summary"
            th:text="${news.summary}"></div>

        <img th:if="${news.thumbnail != null}" th:src="@{/uploads/news/{file}(file=${news.thumbnail})}"
            class="article-thumb" alt="Thumbnail">

        <div class="article-content" th:utext="${news.content}">
            Nội dung bài viết sẽ hiển thị ở đây
        </div>
    </div>

    <div th:replace="~{layout/footer :: footer}"></div>
</body>

</html>
