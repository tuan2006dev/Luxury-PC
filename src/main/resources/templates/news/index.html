<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" th:href="@{/logo.png}" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tin Tức Công Nghệ - Luxury PC</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/index.css}">
    <style>
        .news-container { max-width: 1200px; margin: 40px auto; padding: 0 20px; }
        .news-header { text-align: center; margin-bottom: 40px; }
        .news-header h1 { font-size: 36px; font-weight: 700; color: #1e293b; margin-bottom: 10px; }
        .news-header p { color: #64748b; font-size: 16px; }
        .news-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(300px, 1fr)); gap: 30px; }
        .news-card { background: #fff; border-radius: 12px; overflow: hidden; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.1); transition: transform 0.3s, box-shadow 0.3s; display: flex; flex-direction: column; }
        .news-card:hover { transform: translateY(-5px); box-shadow: 0 10px 15px -3px rgba(0,0,0,0.1); }
        .news-img { width: 100%; height: 200px; object-fit: cover; }
        .news-content { padding: 20px; flex: 1; display: flex; flex-direction: column; }
        .news-title { font-size: 18px; font-weight: 600; color: #0f172a; margin-bottom: 10px; line-height: 1.4; display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
        .news-title a { color: inherit; text-decoration: none; transition: color 0.2s; }
        .news-title a:hover { color: #0ea5e9; }
        .news-meta { display: flex; align-items: center; gap: 15px; font-size: 13px; color: #64748b; margin-bottom: 15px; }
        .news-summary { font-size: 14px; color: #475569; line-height: 1.6; margin-bottom: 20px; display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; flex: 1; }
        .read-more { font-size: 14px; font-weight: 600; color: #0ea5e9; text-decoration: none; display: inline-flex; align-items: center; gap: 5px; transition: color 0.2s; }
        .read-more:hover { color: #0284c7; }
        .empty-state { text-align: center; padding: 60px 20px; color: #64748b; background: #f8fafc; border-radius: 12px; }
    </style>
</head>
<body>
    <div th:replace="~{layout/header :: header}"></div>

    <div class="news-container">
        <div class="news-header">
            <h1>Tin Tức & Công Nghệ</h1>
            <p>Cập nhật những thông tin mới nhất về thị trường PC, linh kiện và mẹo vặt.</p>
        </div>

        <div th:if="${#lists.isEmpty(newsList)}" class="empty-state">
            <i class="fa-regular fa-newspaper" style="font-size: 48px; margin-bottom: 15px; color: #cbd5e1;"></i>
            <h3>Chưa có bài viết nào</h3>
            <p>Hãy quay lại sau để cập nhật những tin tức mới nhất.</p>
        </div>

        <div class="news-grid">
            <div class="news-card" th:each="n : ${newsList}">
                <a th:href="@{/news/{slug}(slug=${n.slug})}">
                    <img th:if="${n.thumbnail != null}" th:src="@{/uploads/news/{file}(file=${n.thumbnail})}" class="news-img" alt="Thumbnail">
                    <img th:unless="${n.thumbnail != null}" src="https://via.placeholder.com/600x400?text=News" class="news-img" alt="Default Thumbnail">
                </a>
                <div class="news-content">
                    <h3 class="news-title">
                        <a th:href="@{/news/{slug}(slug=${n.slug})}" th:text="${n.title}">Tiêu đề bài viết</a>
                    </h3>
                    <div class="news-meta">
                        <span><i class="fa-regular fa-calendar"></i> <span th:text="${#dates.format(n.createdAt, 'dd/MM/yyyy')}">01/01/2023</span></span>
                        <span><i class="fa-regular fa-user"></i> <span th:text="${n.author != null ? n.author.fullName : 'Ẩn danh'}">Tác giả</span></span>
                    </div>
                    <p class="news-summary" th:text="${n.summary}"></p>
                    <div>
                        <a th:href="@{/news/{slug}(slug=${n.slug})}" class="read-more">Đọc tiếp <i class="fa-solid fa-arrow-right"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout/footer :: footer}"></div>
</body>
</html>
