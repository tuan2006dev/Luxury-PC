<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <title>Tin Công Nghệ - LuxuryPC</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap"
        rel="stylesheet" />
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" th:href="@{/images/logo.svg}" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" th:href="@{/css/news/news-index.css}" />
</head>

<body>
    <div th:replace="~{layout/header :: header}"></div>

    <div class="news-page">
        <div class="news-container">
            <!-- Cột nội dung chính -->
            <div class="news-main">
                <h1 style="font-size:28px; font-weight:700; color:#1e293b; margin-bottom:24px;">Tin Tức Công Nghệ</h1>

                <div th:if="${newsPage.empty}"
                    style="background:#fff; padding:40px; text-align:center; border-radius:12px; color:#64748b;">
                    <i class="fa-regular fa-folder-open" style="font-size:48px; margin-bottom:16px; color:#cbd5e1;"></i>
                    <p>Không tìm thấy bài viết nào.</p>
                </div>

                <div class="news-grid" th:unless="${newsPage.empty}">
                    <div class="news-card" th:each="n : ${newsPage.content}">
                        <a th:href="@{/news/{slug}(slug=${n.slug})}">
                            <img class="news-thumb"
                                th:src="${not #strings.isEmpty(n.thumbnail) ? (n.thumbnail.startsWith('http') ? n.thumbnail : '/images/news/' + n.thumbnail) : '/images/placeholder.jpg'}"
                                onerror="this.onerror=null;this.src='/images/placeholder.jpg';" alt="Thumbnail">
                        </a>
                        <div class="news-content-box">
                            <span class="news-category"
                                th:text="${n.categoryName != null ? n.categoryName : 'Chưa phân loại'}">Category</span>
                            <a class="news-title" th:href="@{/news/{slug}(slug=${n.slug})}" th:text="${n.title}">Tiêu
                                đề</a>
                            <p class="news-summary" th:text="${n.summary}"></p>
                            <div class="news-meta">
                                <span><i class="fa-regular fa-calendar"></i> <span
                                        th:text="${#dates.format(n.createdAt, 'dd/MM/yyyy')}"></span></span>
                                <span><i class="fa-regular fa-eye"></i> <span
                                        th:text="${n.formattedViewCount}"></span></span>
                            </div>
                        </div>
                    </div>
                </div>

                <!-- Phân trang -->
                <!-- <div class="pagination" th:if="${newsPage.totalPages > 1}">
                    <a th:if="${newsPage.hasPrevious()}"
                        th:href="@{/news(page=${newsPage.number - 1}, keyword=${keyword}, category=${currentCategoryId})}">&laquo;</a>
                    <th:block th:each="i : ${#numbers.sequence(0, newsPage.totalPages - 1)}">
                        <a th:href="@{/news(page=${i}, keyword=${keyword}, category=${currentCategoryId})}"
                            th:text="${i + 1}" th:class="${newsPage.number == i ? 'active' : ''}">1</a>
                    </th:block>
                    <a th:if="${newsPage.hasNext()}"
                        th:href="@{/news(page=${newsPage.number + 1}, keyword=${keyword}, category=${currentCategoryId})}">&raquo;</a>
                </div> -->
            </div>

            <!-- Cột Sidebar -->
            <div class="news-sidebar">
                <!-- Widget Tìm kiếm -->
                <div class="sidebar-widget">
                    <h3 class="widget-title">Tìm kiếm</h3>
                    <form class="news-search-form" action="/news" method="get">
                        <input type="text" name="keyword" class="news-search-input" th:value="${keyword}"
                            placeholder="Tìm bài viết...">
                        <button type="submit" class="news-search-btn"><i class="fa fa-search"></i></button>
                    </form>
                </div>

                <!-- Widget Danh mục -->
                <div class="sidebar-widget">
                    <h3 class="widget-title">Chuyên mục</h3>
                    <ul class="category-list">
                        <li>
                            <a th:href="@{/news}" th:class="${currentCategoryId == null ? 'active' : ''}">Tất cả tin
                                tức</a>
                        </li>
                        <li th:each="cat : ${categories}">
                            <a th:href="@{/news(category=${cat.id})}"
                                th:class="${currentCategoryId == cat.id ? 'active' : ''}"
                                th:text="${cat.name}">Category</a>
                        </li>
                    </ul>
                </div>

                <!-- Widget Xem nhiều -->
                <div class="sidebar-widget">
                    <h3 class="widget-title">Xem nhiều nhất</h3>
                    <div class="top-post" th:each="tn : ${topViewed}">
                        <a th:href="@{/news/{slug}(slug=${tn.slug})}">
                            <img class="top-post-img"
                                th:src="${not #strings.isEmpty(tn.thumbnail) ? (tn.thumbnail.startsWith('http') ? tn.thumbnail : '/images/news/' + tn.thumbnail) : '/images/placeholder.jpg'}"
                                onerror="this.onerror=null;this.src='/images/placeholder.jpg';" alt="Thumb">
                        </a>
                        <div class="top-post-info">
                            <a class="top-post-title" th:href="@{/news/{slug}(slug=${tn.slug})}"
                                th:text="${tn.title}">Tiêu đề</a>
                            <span class="top-post-date"><i class="fa-regular fa-calendar"></i> <span
                                    th:text="${#dates.format(tn.createdAt, 'dd/MM/yyyy')}"></span></span>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </div>
    <div th:replace="~{layout/footer :: footer}"></div>

    <script th:src="@{/js/script.js}"></script>
</body>

</html>
