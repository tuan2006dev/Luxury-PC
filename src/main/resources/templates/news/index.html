<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="icon" type="image/png" th:href="@{/logo.png}" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tin Tức Công Nghệ - Luxury PC</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/news.css}">
</head>

<body>
    <div th:replace="~{layout/header :: header}"></div>

    <div class="news-container">
        <div class="news-header">
            <h1>Tin Tức & Công Nghệ</h1>
            <p>Cập nhật những thông tin mới nhất về thị trường PC, linh kiện và mẹo vặt.</p>
        </div>

        <div th:if="${#lists.isEmpty(newsList)}" class="empty-state">
            <i class="fa-regular fa-newspaper" style="font-size: 48px; margin-bottom: 15px; color: #cbd5e1;"></i>
            <h3>Chưa có bài viết nào</h3>
            <p>Hãy quay lại sau để cập nhật những tin tức mới nhất.</p>
        </div>

        <div class="news-grid">
            <div class="news-card" th:each="n : ${newsList}">
                <a th:href="@{/news/{slug}(slug=${n.slug})}">
                    <img th:if="${n.thumbnail != null}" th:src="@{/uploads/news/{file}(file=${n.thumbnail})}"
                        class="news-img" alt="Thumbnail">
                    <img th:unless="${n.thumbnail != null}" src="https://via.placeholder.com/600x400?text=News"
                        class="news-img" alt="Default Thumbnail">
                </a>
                <div class="news-content">
                    <h3 class="news-title">
                        <a th:href="@{/news/{slug}(slug=${n.slug})}" th:text="${n.title}">Tiêu đề bài viết</a>
                    </h3>
                    <div class="news-meta">
                        <span><i class="fa-regular fa-calendar"></i> <span
                                th:text="${#dates.format(n.createdAt, 'dd/MM/yyyy')}">01/01/2023</span></span>
                        <span><i class="fa-regular fa-user"></i> <span
                                th:text="${n.author != null ? n.author.fullName : 'Ẩn danh'}">Tác giả</span></span>
                    </div>
                    <p class="news-summary" th:text="${n.summary}"></p>
                    <div>
                        <a th:href="@{/news/{slug}(slug=${n.slug})}" class="read-more">Đọc tiếp <i
                                class="fa-solid fa-arrow-right"></i></a>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <div th:replace="~{layout/footer :: footer}"></div>
</body>

</html>
