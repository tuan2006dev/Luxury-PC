<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luxury PC | Tất Cả Sản Phẩm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="icon" type="image/png" th:href="@{/logo.png}" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" th:href="@{/css/all-products.css}" />
</head>

<body>
    <div th:replace="~{layout/header :: header}"></div>

    <main class="container">
        <header class="page-header">
            <span class="section-label">Luxury Collection</span>
            <h1 class="page-title">Tất Cả <em>Linh Kiện</em></h1>
        </header>

        <!-- SEARCH & FILTER BAR -->
        <section class="filters-section">
            <form th:action="@{/products}" method="GET" class="filter-form">
                <div class="filter-group">
                    <label>Danh Mục</label>
                    <select name="cid" class="filter-select">
                        <option value="">Tất Cả Danh Mục</option>
                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                            th:selected="${c.id == selectedCid}"></option>
                    </select>
                </div>

                <div class="filter-group">
                    <label>Khoảng Giá</label>
                    <div class="price-inputs">
                        <input type="number" name="min" th:value="${minPrice}" placeholder="Từ..."
                            class="filter-input" />
                        <span class="price-sep">-</span>
                        <input type="number" name="max" th:value="${maxPrice}" placeholder="Đến..."
                            class="filter-input" />
                    </div>
                </div>

                <div class="filter-group kw">
                    <label>Tìm Kiếm</label>
                    <input type="text" name="kw" th:value="${keywords}" placeholder="Tên sản phẩm, thông số..."
                        class="filter-input" />
                </div>

                <button type="submit" class="btn-filter"><span>Áp Dụng</span></button>
                <a th:href="@{/products}" class="btn-reset">Xóa Lọc</a>
            </form>
        </section>

        <section class="products-grid">
            <!-- Thymeleaf iteration -->
            <article th:each="p : ${allProducts}" class="product-card"
                th:classappend="${p.price > 20000000 ? 'large' : ''}" th:id="'prod-' + ${p.id}"
                th:data-price="${p.price}" th:data-cat="${p.category.name.toLowerCase()}"
                th:onclick="|location.href='@{/product/{id}(id=${p.id})}'|" style="cursor: pointer;">
                <div class="product-img-wrap">
                    <img th:src="@{${p.image != null ? (p.image.startsWith('http') ? p.image : '/images/products/' + p.image) : '/images/placeholder.png'}}" th:alt="${p.name}"
                        class="product-img" />
                    <div th:if="${p.price > 30000000}" class="product-badge">Premium</div>
                </div>
                <div class="product-info">
                    <span class="product-cat" th:text="${p.category != null ? p.category.name : 'Linh Kiện'}">CPU</span>
                    <h3 class="product-name" th:text="${p.name}">Product Name</h3>
                    <p class="product-spec" th:text="${p.description}">High performance component for ultimate gaming.
                    </p>
                    <div class="product-price-row">
                        <span class="product-price"
                            th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + '₫'">Giá</span>
                        <form th:action="@{/cart/add}" method="post" style="display:inline;">
                          <input type="hidden" name="id" th:value="${p.id}" />
                          <input type="hidden" name="name" th:value="${p.name}" />
                          <input type="hidden" name="price" th:value="${p.price}" />
                          <button type="submit" class="btn-add-cart" onclick="event.stopPropagation();"><span>Mua Ngay</span></button>
                        </form>
                    </div>
                </div>
            </article>

            <!-- Case where no products are found -->
            <div th:if="${#lists.isEmpty(allProducts)}" class="cart-empty-state">
                <div class="empty-icon">♢</div>
                <p>Hiện chưa có sản phẩm nào trong bộ sưu tập này.</p>
            </div>
        </section>
    </main>

    <div th:replace="~{layout/footer :: footer}"></div>
    <script th:src="@{/js/script.js}"></script>
</body>

</html>
