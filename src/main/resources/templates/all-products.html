<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luxury PC | Tất Cả Sản Phẩm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
        rel="stylesheet" />
    <link rel="icon" type="image/png" th:href="@{/logo.png}" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" th:href="@{/css/all-products.css}" />
</head>

<body>
    <div th:replace="~{layout/header :: header}"></div>

    <main class="container">
        <header class="page-header">
            <span class="section-label" data-translate="products-header-label">Luxury Collection</span>
            <h1 class="page-title" data-translate="products-header-title">Tất Cả Linh Kiện</h1>
        </header>

        <!-- SEARCH & FILTER BAR -->
        <section class="filters-section">
            <form th:action="@{/products}" method="GET" class="filter-form">
                <div class="filter-group">
                    <label data-translate="products-filter-category">Danh Mục</label>
                    <select name="cid" class="filter-select">
                        <option value="" data-translate="products-filter-all-cats">Tất Cả Danh Mục</option>
                        <option th:each="c : ${categories}" th:value="${c.id}" th:text="${c.name}"
                            th:selected="${c.id == selectedCid}"></option>
                    </select>
                </div>

                <div class="filter-group">
                    <label data-translate="products-filter-price">Khoảng Giá</label>
                    <div class="price-inputs">
                        <input type="hidden" name="min" id="minPriceHidden" th:value="${minPrice != null ? (minPrice < 0 ? 0 : minPrice.longValue()) : null}" />
                        <input type="text" id="minPriceDisplay" th:value="${minPrice != null ? (minPrice < 0 ? 0 : #numbers.formatDecimal(minPrice, 0, 'POINT', 0, 'COMMA')) : null}" placeholder="Từ..." data-translate-placeholder="products-filter-price-from"
                            class="filter-input" oninput="formatPriceInput(this, 'minPriceHidden')" />
                        <span class="price-sep">-</span>
                        <input type="hidden" name="max" id="maxPriceHidden" th:value="${maxPrice != null ? (maxPrice < 0 ? 0 : maxPrice.longValue()) : null}" />
                        <input type="text" id="maxPriceDisplay" th:value="${maxPrice != null ? (maxPrice < 0 ? 0 : #numbers.formatDecimal(maxPrice, 0, 'POINT', 0, 'COMMA')) : null}" placeholder="Đến..." data-translate-placeholder="products-filter-price-to"
                            class="filter-input" oninput="formatPriceInput(this, 'maxPriceHidden')" />
                    </div>
                    <script>
                        function formatPriceInput(displayEl, hiddenId) {
                            let rawValue = displayEl.value.replace(/\D/g, '');
                            document.getElementById(hiddenId).value = rawValue;
                            if (rawValue !== '') {
                                displayEl.value = Number(rawValue).toLocaleString('vi-VN').replace(/,/g, '.');
                            } else {
                                displayEl.value = '';
                            }
                        }
                    </script>
                </div>

                <div class="filter-group kw">
                    <label data-translate="products-filter-search">Tìm Kiếm</label>
                    <input type="text" name="kw" th:value="${keywords}" placeholder="Tên sản phẩm, thông số..." data-translate-placeholder="products-filter-search-placeholder"
                        class="filter-input" />
                </div>

                <button type="submit" class="btn-filter"><span data-translate="products-btn-filter">Áp Dụng</span></button>
                <a th:href="@{/products}" class="btn-reset" data-translate="products-btn-reset">Xóa Lọc</a>
            </form>
        </section>

        <section class="products-grid">
            <!-- Thymeleaf iteration -->
            <article th:each="p : ${allProducts}" class="product-card"
                th:classappend="${p.price > 20000000 ? 'large' : ''}" th:id="'prod-' + ${p.id}"
                th:data-price="${p.price}" th:data-cat="${p.category.name.toLowerCase()}"
                th:onclick="|location.href='@{/product/{id}(id=${p.id})}'|" style="cursor: pointer;">
                <div class="product-img-wrap">
                    <img th:src="@{${p.image != null ? (p.image.startsWith('http') ? p.image : '/images/products/' + p.image) : '/images/placeholder.png'}}" th:alt="${p.name}"
                        class="product-img" />
                    <div th:if="${p.price > 30000000}" class="product-badge" data-translate="product-badge-premium">Premium</div>
                </div>
                <div class="product-info">
                    <span class="product-cat" th:text="${p.category != null ? p.category.name : 'Linh Kiện'}">CPU</span>
                    <h3 class="product-name" th:text="${p.name}">Product Name</h3>
                    <p class="product-spec" th:text="${p.description}">High performance component for ultimate gaming.
                    </p>
                    <div class="product-price-row">
                        <span class="product-price"
                            th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + '₫'">Giá</span>
                        <form th:action="@{/cart/add}" method="post" style="display:inline-flex; gap: 8px;">
                            <input type="hidden" name="id" th:value="${p.id}" />
                            <input type="hidden" name="name" th:value="${p.name}" />
                            <input type="hidden" name="price" th:value="${p.price != null ? p.price.longValue() : 0}" />
                            <button type="submit" class="btn-add-cart-icon" onclick="event.stopPropagation();" title="Thêm vào giỏ" th:disabled="${p.stock != null and p.stock <= 0}">
                                <svg xmlns="http://www.w3.org/2000/svg" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" viewBox="0 0 24 24"><circle cx="9" cy="21" r="1"></circle><circle cx="20" cy="21" r="1"></circle><path d="M1 1h4l2.68 13.39a2 2 0 0 0 2 1.61h9.72a2 2 0 0 0 2-1.61L23 6H6"></path></svg>
                            </button>
                            <button type="submit" th:formaction="@{/cart/buy-now}" class="btn-buy-now" onclick="event.stopPropagation(); this.form.classList.add('is-buy-now'); this.form.action='/cart/buy-now';" th:disabled="${p.stock != null and p.stock <= 0}"><span th:if="${p.stock == null or p.stock > 0}" data-translate="product-btn-buy-now">Mua Ngay</span><span th:if="${p.stock != null and p.stock <= 0}" data-translate="product-badge-outofstock">Hết Hàng</span></button>
                          </form>
                    </div>
                </div>
            </article>

            <!-- Case where no products are found -->
            <div th:if="${#lists.isEmpty(allProducts)}" class="cart-empty-state" style="grid-column: 1 / -1; display: flex; flex-direction: column; align-items: center; justify-content: center;">
                <div class="empty-icon">♢</div>
                <p data-translate="products-empty-state">Hiện chưa có sản phẩm nào trong bộ sưu tập này.</p>
            </div>
        </section>
    </main>

    <div th:replace="~{layout/footer :: footer}"></div>
    <script th:src="@{/js/script.js}"></script>
</body>

</html>
