<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" th:href="@{/logo.png}" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="payment-vietqr-title">Thanh toán VietQR</title>
    <link rel="stylesheet" th:href="@{/css/payment-vietqr.css}" />
    <link rel="stylesheet" th:href="@{/css/light-theme.css}" />
</head>
<body>
<main class="payment-box">
    <h1 data-translate="pay-vietqr-header">Thanh toán qua VietQR</h1>
    <p class="subtitle" data-translate="pay-subtitle">Quét mã bằng ứng dụng ngân hàng và giữ nguyên nội dung chuyển khoản.</p>

    <div class="qr-wrap">
        <img th:src="${qrUrl}" alt="Mã QR thanh toán VietQR">
    </div>

    <div class="amount"
         th:text="${#numbers.formatDecimal(amount, 0, 'COMMA', 0, 'POINT')} + ' VNĐ'">150.000 VNĐ</div>

    <div class="info">
        <div class="info-row"><span class="label" data-translate="pay-label-order-code">Mã đơn</span><span class="value" th:text="${orderCode}">DH123</span></div>
        <div class="info-row"><span class="label" data-translate="pay-label-bank">Ngân hàng</span><span class="value" th:text="${bankDisplayName}">MB Bank</span></div>
        <div class="info-row"><span class="label" data-translate="pay-label-account-no">Số tài khoản</span><span class="value" th:text="${accountNo}">9999999999</span></div>
        <div class="info-row"><span class="label" data-translate="pay-label-account-name">Chủ tài khoản</span><span class="value" th:text="${accountName}">LUXURYPC</span></div>
        <div class="info-row"><span class="label" data-translate="pay-label-transfer-content">Nội dung chuyển khoản</span><span class="value" th:text="${transferContent}">THANH TOAN DH123</span></div>
        <div class="info-row"><span class="label" data-translate="pay-label-status">Trạng thái</span><span class="value" style="color:#c9a84c;" th:text="${paymentStatus}" th:data-translate="${paymentStatus}">Chờ xác nhận thanh toán</span></div>
    </div>

    <div class="actions">
        <a class="btn" th:href="@{/cart}" data-translate="pay-btn-cart">Về giỏ hàng</a>
        <a class="btn btn-primary" th:href="@{/}" data-translate="pay-btn-home">Về trang chủ</a>
    </div>
</main>

<script th:src="@{/js/payment-vietqr.js}"></script>

<!-- THEME TOGGLE -->
<button class="theme-toggle-btn floating-theme-btn" id="theme-toggle" aria-label="Chuyển đổi giao diện Sáng/Tối">
    <i class="fa-regular fa-moon"></i>
</button>
<script th:src="@{/js/theme.js}"></script>

</body>
</html>
