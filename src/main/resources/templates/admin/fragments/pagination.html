<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<body>
    <div th:fragment="pagination(baseUrl)" class="admin-pagination-wrapper"
        th:if="${totalItems != null and totalItems > 0}">
        <div class="pagination-info">
            <span>Hiển thị</span>
            <strong th:text="${startItem}">1</strong>
            <span>-</span>
            <strong th:text="${endItem}">10</strong>
            <span>trong tổng số</span>
            <strong th:text="${totalItems}">50</strong>
            <span>bản ghi</span>
            <span class="page-count-badge"
                th:text="'(Trang ' + ${currentPage} + ' / ' + ${totalPages} + ')'">(Trang 1 / 5)</span>
        </div>

        <div class="pagination-btns" th:if="${totalPages > 1}">
            <!-- Trang đầu -->
            <a th:href="@{${baseUrl}(page=1, keyword=${keyword}, status=${selectedStatus ?: (filterStatus ?: status)}, star=${selectedStar ?: star}, statusFilter=${statusFilter}, categoryId=${categoryId})}"
                class="page-btn nav-btn" th:classappend="${currentPage == 1} ? 'disabled' : ''" title="Trang đầu">
                <i class="fa-solid fa-angles-left"></i>
            </a>

            <!-- Trang trước -->
            <a th:href="@{${baseUrl}(page=${currentPage - 1}, keyword=${keyword}, status=${selectedStatus ?: (filterStatus ?: status)}, star=${selectedStar ?: star}, statusFilter=${statusFilter}, categoryId=${categoryId})}"
                class="page-btn nav-btn" th:classappend="${currentPage == 1} ? 'disabled' : ''" title="Trang trước">
                <i class="fa-solid fa-angle-left"></i>
            </a>

            <!-- Các số trang -->
            <th:block th:each="i : ${#numbers.sequence(1, totalPages)}">
                <a th:if="${i >= currentPage - 2 and i <= currentPage + 2}"
                    th:href="@{${baseUrl}(page=${i}, keyword=${keyword}, status=${selectedStatus ?: (filterStatus ?: status)}, star=${selectedStar ?: star}, statusFilter=${statusFilter}, categoryId=${categoryId})}"
                    th:text="${i}" class="page-btn num-btn" th:classappend="${currentPage == i} ? 'active' : ''">
                    1
                </a>
            </th:block>

            <!-- Trang sau -->
            <a th:href="@{${baseUrl}(page=${currentPage + 1}, keyword=${keyword}, status=${selectedStatus ?: (filterStatus ?: status)}, star=${selectedStar ?: star}, statusFilter=${statusFilter}, categoryId=${categoryId})}"
                class="page-btn nav-btn" th:classappend="${currentPage == totalPages} ? 'disabled' : ''"
                title="Trang kế tiếp">
                <i class="fa-solid fa-angle-right"></i>
            </a>

            <!-- Trang cuối -->
            <a th:href="@{${baseUrl}(page=${totalPages}, keyword=${keyword}, status=${selectedStatus ?: (filterStatus ?: status)}, star=${selectedStar ?: star}, statusFilter=${statusFilter}, categoryId=${categoryId})}"
                class="page-btn nav-btn" th:classappend="${currentPage == totalPages} ? 'disabled' : ''"
                title="Trang cuối">
                <i class="fa-solid fa-angles-right"></i>
            </a>
        </div>
    </div>
</body>

</html>
