<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="icon" type="image/png" th:href="@{/images/logo.svg}" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Sản Phẩm — Luxury PC</title>
    <link data-pjax-track="true"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link data-pjax-track="true" rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link data-pjax-track="true" rel="stylesheet" th:href="@{/css/admin/products.css}" />
    <link data-pjax-track="true" rel="stylesheet" th:href="@{/css/admin/admin.css}">
</head>

<body>

    <div th:replace="~{admin/layout/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="header">
            <div class="title">
                <h1><span>Quản Lý Sản Phẩm</span> (<span th:text="${products != null ? products.size() : 0}">0</span>)
                </h1>
            </div>
            <div th:replace="~{admin/layout/header :: adminProfile}"></div>
        </div>

        <div th:if="${message}" class="alert alert-success"
            style="margin-bottom: 1.5rem; padding: 1rem; background: rgba(34, 197, 94, 0.1); border: 1px solid #22c55e; border-radius: 6px; color: #22c55e;">
            <i class="fa-solid fa-circle-check"></i> <span th:text="${message}"></span>
        </div>
        <!-- Removed alert-danger block to use inline client-side validation -->


        <!-- Action Bar: Nút Thêm mới + Tìm kiếm góc phải -->
        <div
            style="display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
            <div>
                <button class="btn btn-gold" id="toggleFormBtn" onclick="toggleForm()"><i class="fa-solid fa-plus"></i>
                    <span class="btn-text">Thêm Sản Phẩm Mới</span></button>
            </div>
            <div style="margin-left: auto;">
                <div
                    th:replace="~{admin/fragments/search-bar :: searchBar(actionUrl='/admin/products', keyword=${keyword})}">
                </div>
            </div>
        </div>

        <!-- Form Thêm / Sửa -->
        <div class="card add-form-container" id="productForm" th:classappend="${product.id != null ? 'active' : ''}">
            <div class="card-header">
                <h2 th:text="${product.id == null ? 'Thêm Sản Phẩm Mới' : 'Cập Nhật Sản Phẩm'}">Thông Tin Sản Phẩm</h2>
                <button class="icon-btn icon-btn-del" onclick="toggleForm()" title="Thoát"><i
                        class="fa-solid fa-xmark"></i></button>
            </div>
            <form novalidate class="needs-validation" id="productFormElement" autocomplete="off"
                th:action="@{/admin/products/save}" method="post" th:object="${product}" enctype="multipart/form-data">

                <input autocomplete="off" type="hidden" th:field="*{id}">
                <div class="form-grid">
                    <div class="input-group full">
                        <label><span>Tên Sản Phẩm</span> *</label>
                        <input autocomplete="off" type="text" th:field="*{name}" required
                            placeholder="VD: Card Màn Hình ASUS ROG Strix GeForce RTX 4090">
                    </div>
                    <div class="input-group">
                        <label><span>Giá Bán (VNĐ)</span> *</label>
                        <input autocomplete="off" type="number" th:field="*{price}" required min="0"
                            placeholder="VD: 54990000">
                    </div>
                    <div class="input-group">
                        <label><span>Danh Mục</span> *</label>
                        <select th:field="*{category.id}" required>
                            <option value="">-- Chọn danh mục --
                            </option>
                            <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">VGA
                            </option>
                        </select>
                    </div>
                    <div class="input-group full">
                        <label>Mô Tả Nhanh</label>
                        <textarea th:field="*{description}" rows="3" placeholder="Mô tả kỹ thuật ..."></textarea>
                    </div>
                    <div class="input-group">
                        <label>Tải Ảnh Lên</label>
                        <div class="file-upload-wrapper">
                            <label class="file-upload-label">
                                <i class="fa-solid fa-cloud-arrow-up"></i>
                                <span class="file-name">Chọn ảnh tải
                                    lên...</span>
                                <input autocomplete="off" type="file" name="imageFile" accept="image/*"
                                    class="file-input-hidden" style="display: none !important;" onchange="
                                let name = 'Chọn ảnh tải lên...';
                                if (this.files && this.files.length > 0) {
                                    name = this.files[0].name;
                                    if (name.length > 25) {
                                        const dotIdx = name.lastIndexOf('.');
                                        const ext = dotIdx !== -1 ? name.substring(dotIdx) : '';
                                        const base = dotIdx !== -1 ? name.substring(0, dotIdx) : name;
                                        name = base.substring(0, 18) + '...' + ext;
                                    }
                                }
                                const label = this.closest('.file-upload-label');
                                const textSpan = label.querySelector('.file-name');
                                if (textSpan) textSpan.innerText = name;
                                if (this.files && this.files.length > 0) label.classList.add('has-file');
                                else label.classList.remove('has-file');
                            ">
                            </label>
                        </div>
                    </div>
                    <div class="input-group">
                        <label>Hoặc nhập Link Ảnh (URL)</label>
                        <input autocomplete="off" type="text" id="imageUrl" th:field="*{image}"
                            placeholder="VD: https://example.com/hinh-anh.jpg">
                    </div>
                    <!-- <div class="input-group">
                        <label>Số lượng kho</label>
                        <input autocomplete="off" type="number" th:field="*{stock}" min="0">
                    </div> -->
                    <div class="input-group full" th:if="${product.image != null}">
                        <label>Ảnh hiện tại:</label>
                        <div style="display:flex; align-items:center; gap:10px;">
                            <img th:src="${product.image != null ? (product.image.startsWith('http') || product.image.startsWith('/') ? product.image : '/images/products/' + product.image) : 'https://placehold.co/100x100/111/c9a84c?text=No+Image'}"
                                th:alt="${product.name}"
                                onerror="this.onerror=null; this.src='https://placehold.co/100x100/111/c9a84c?text=No+Image';"
                                style="width:100px; height:100px; object-fit:contain; border:1px solid var(--gold); border-radius:4px; padding:2px; background:#fff;">
                            <span th:text="${product.image}" style="font-size:0.8rem; color:var(--muted);"></span>
                        </div>
                    </div>
                </div>
                <div style="margin-top: 2rem; display: flex; gap: 10px;">
                    <button type="submit" class="btn btn-gold">Lưu Sản
                        Phẩm</button>
                    <button type="button" class="btn btn-outline" onclick="location.href='/admin/products'">Hủy / Làm
                        mới</button>
                </div>
            </form>
        </div>

        <!-- Bảng dữ liệu -->
        <div class="card">
            <div class="table-wrapper" style="width: 100%; max-height: 60vh; overflow: auto;">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th style="position: sticky; top: 0; z-index: 10; background: #f8fafc;">Sản Phẩm</th>
                            <th style="position: sticky; top: 0; z-index: 10; background: #f8fafc;">Danh Mục</th>
                            <th style="position: sticky; top: 0; z-index: 10; background: #f8fafc;">Giá Bán</th>
                            <th style="position: sticky; top: 0; z-index: 10; background: #f8fafc;">Kho</th>
                            <th style="position: sticky; top: 0; z-index: 10; background: #f8fafc; width: 100px;">Thao
                                Tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="p, stat : ${products}">
                            <td>
                                <div class="product-img">
                                    <img th:if="${p.image != null}"
                                        th:src="${p.image.startsWith('http') || p.image.startsWith('/') ? p.image : '/images/products/' + p.image}"
                                        th:alt="${p.name}"
                                        onerror="this.onerror=null; this.src='https://placehold.co/50x50/111/c9a84c?text=Error';"
                                        style="width:100%; height:100%; object-fit:contain; border-radius:inherit; border:none; padding:2px;">
                                    <span th:if="${p.image == null}"
                                        style="font-size:0.6rem; text-align:center;">No<br>Image</span>
                                </div>
                                <div class="product-info">
                                    <div class="product-name" th:text="${p.name}">Intel Core i9-14900K</div>
                                    <div class="product-cat" th:text="'STT: #' + ${stat.count}">STT: #1</div>
                                </div>
                            </td>
                            <td th:text="${p.category != null ? p.category.name : 'Chưa phân loại'}">CPU</td>
                            <td th:text="${#numbers.formatDecimal(p.price, 0, 'COMMA', 0, 'POINT')} + '₫'"
                                style="color: var(--gold); font-weight: 600;">18.990.000₫</td>
                            <td th:text="${(p.stock != null ? p.stock : 0) + ' / 200'}">0 / 200</td>
                            <td>
                                <div class="action-btns">
                                    <button type="button" class="icon-btn icon-btn-edit" title="Sửa"
                                        th:data-id="${p.id}" th:data-name="${p.name}"
                                        th:data-price="${p.price != null ? #numbers.formatDecimal(p.price, 0, 'NONE', 0, 'POINT') : 0}"
                                        th:data-cat="${p.category != null ? p.category.id : ''}"
                                        th:data-desc="${p.description}" th:data-stock="${p.stock}"
                                        th:data-image="${p.image}" onclick="editProduct(this)">
                                        <i class="fa-solid fa-pen"></i>
                                    </button>
                                    <a th:href="@{/admin/products/delete/{id}(id=${p.id})}"
                                        class="icon-btn icon-btn-del" title="Xóa"
                                        onclick="return window.confirmNavigate(event, 'Bạn có chắc chắn muốn xóa sản phẩm này?', this.href);"><i
                                            class="fa-solid fa-trash"></i></a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <script th:src="@{/js/admin/products.js}"></script>
    </div>
    <div th:replace="~{admin/layout/common-scripts :: scripts}"></div>
</body>

</html>
