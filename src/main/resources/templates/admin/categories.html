<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="icon" type="image/png" th:href="@{/images/logo.svg}" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Danh Mục — Luxury PC</title>
    <link data-pjax-track="true" href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link data-pjax-track="true" rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link data-pjax-track="true" rel="stylesheet" th:href="@{/css/admin/categories.css}" />
    <link data-pjax-track="true" rel="stylesheet" th:href="@{/css/admin/admin.css}">
</head>

<body>

    <div th:replace="~{admin/layout/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="header">
            <div class="title">
                <h1><span>Quản Lý Danh Mục</span> (<span
                        th:text="${categories != null ? categories.size() : 0}">0</span>)</h1>
            </div>
            <div th:replace="~{admin/layout/header :: adminProfile}"></div>
        </div>

        <div th:if="${message}" class="alert alert-success"
            style="margin-bottom: 1.5rem; padding: 1rem; background: rgba(34, 197, 94, 0.1); border: 1px solid #22c55e; border-radius: 6px; color: #22c55e;">
            <i class="fa-solid fa-circle-check"></i> <span th:text="${message}"></span>
        </div>
        <div th:if="${error}" class="alert alert-danger"
            style="margin-bottom: 1.5rem; padding: 1rem; background: rgba(239, 68, 68, 0.1); border: 1px solid #ef4444; border-radius: 6px; color: #ef4444;">
            <i class="fa-solid fa-triangle-exclamation"></i> <span th:text="${error}"></span>
        </div>

        <div
            style="display: flex; justify-content: space-between; align-items: center; gap: 1rem; margin-bottom: 1.5rem; flex-wrap: wrap;">
            <div>
                <button class="btn btn-gold" id="toggleFormBtn" onclick="toggleForm()"><i class="fa-solid fa-plus"></i>
                    <span class="btn-text">Thêm Danh Mục Mới</span></button>
            </div>
            <div style="margin-left: auto;">
                <div
                    th:replace="~{admin/fragments/search-bar :: searchBar(actionUrl='/admin/categories', keyword=${keyword})}">
                </div>
            </div>
        </div>

        <div class="card add-form-container" id="categoryForm" th:classappend="${category.id != null ? 'active' : ''}">
            <div class="card-header">
                <h2 th:text="${category.id == null ? 'Thêm Danh Mục' : 'Sửa Danh Mục'}">Thông Tin Danh Mục</h2>
                <button class="icon-btn icon-btn-del" onclick="toggleForm()" title="Thoát"><i
                        class="fa-solid fa-xmark"></i></button>
            </div>
            <form novalidate class="needs-validation" autocomplete="off" th:action="@{/admin/categories/save}" method="post"
                enctype="multipart/form-data" th:object="${category}">

                <input autocomplete="off" type="hidden" th:field="*{id}">
                <div class="input-group">
                    <label>Tên Danh Mục *</label>
                    <input autocomplete="off" type="text" th:field="*{name}" required placeholder="VD: Card Màn Hình">
                </div>
                <div class="input-group">
                    <label>Tải Ảnh Lên</label>
                    <div class="file-upload-wrapper">
                        <label class="file-upload-label">
                            <i class="fa-solid fa-cloud-arrow-up"></i>
                            <span class="file-name">Chọn ảnh tải lên...</span>
                            <input autocomplete="off" type="file" name="imageFile" accept="image/*"
                                class="file-input-hidden" style="display: none !important;" onchange="
                            let name = 'Chọn ảnh tải lên...';
                            if (this.files && this.files.length > 0) {
                                name = this.files[0].name;
                                if (name.length > 25) {
                                    const dotIdx = name.lastIndexOf('.');
                                    const ext = dotIdx !== -1 ? name.substring(dotIdx) : '';
                                    const base = dotIdx !== -1 ? name.substring(0, dotIdx) : name;
                                    name = base.substring(0, 18) + '...' + ext;
                                }
                            }
                            const label = this.closest('.file-upload-label');
                            const textSpan = label.querySelector('.file-name');
                            if (textSpan) textSpan.innerText = name;
                            if (this.files && this.files.length > 0) label.classList.add('has-file');
                            else label.classList.remove('has-file');
                        ">
                        </label>
                    </div>
                </div>
                <div class="input-group">
                    <label>Hoặc nhập Link Ảnh (URL)</label>
                    <input autocomplete="off" type="text" id="imageUrl" th:field="*{image}"
                        placeholder="VD: https://example.com/hinh-anh.jpg">
                </div>
                <div class="input-group full" th:if="${category.id != null}">
                    <label>Ảnh hiện tại:</label>
                    <div style="display:flex; align-items:center; gap:10px;">
                        <img id="categoryImagePreview" th:src="${category.categoryImage}"
                            th:alt="${category.name}"
                            onerror="this.onerror=null; this.src='https://placehold.co/100x100/111/c9a84c?text=No+Image';"
                            style="width:60px; height:60px; object-fit:contain; border:1px solid var(--gold); border-radius:4px; padding:2px; background:#fff;">
                        <span th:text="${category.image != null ? category.image : 'Tự động theo tên danh mục'}" style="font-size:0.8rem; color:var(--muted);"></span>
                    </div>
                </div>
                <div style="display: flex; gap: 10px; margin-top: 1rem;">
                    <button type="submit" class="btn btn-gold">Lưu Danh Mục</button>
                    <button type="button" class="btn btn-outline" onclick="location.href='/admin/categories'">Hủy / Làm mới</button>
                </div>
            </form>
        </div>

        <div class="card">
            <div class="table-wrapper" style="width: 100%; max-height: 60vh; overflow: auto;">
                <table class="admin-table">
                    <thead>
                        <tr>
                            <th style="position: sticky; top: 0; z-index: 10; background: #f8fafc; width: 60px;">STT</th>
                            <th style="position: sticky; top: 0; z-index: 10; background: #f8fafc; width: 80px;">Hình Ảnh</th>
                            <th style="position: sticky; top: 0; z-index: 10; background: #f8fafc;">Tên Danh Mục</th>
                            <th style="position: sticky; top: 0; z-index: 10; background: #f8fafc; width: 100px;">Thao Tác</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="c, stat : ${categories}">
                            <td th:text="${stat.count}">1</td>
                            <td>
                                <div style="width: 44px; height: 44px; background: #fff; border: 1px solid #e2e8f0; border-radius: 6px; padding: 2px; display: flex; align-items: center; justify-content: center;">
                                    <img th:src="${c.categoryImage}"
                                        th:alt="${c.name}"
                                        onerror="this.onerror=null; this.src='https://placehold.co/44x44/111/c9a84c?text=Cat';"
                                        style="max-width: 100%; max-height: 100%; object-fit: contain;">
                                </div>
                            </td>
                            <td th:text="${c.name}" style="font-weight: 600;">CPU</td>
                            <td>
                                <div class="action-btns">
                                    <button type="button" class="icon-btn icon-btn-edit" title="Sửa"
                                        th:data-id="${c.id}" th:data-name="${c.name}" th:data-image="${c.image != null ? c.image : ''}" onclick="editCategory(this)">
                                        <i class="fa-solid fa-pen"></i>
                                    </button>
                                    <a th:href="@{/admin/categories/delete/{id}(id=${c.id})}"
                                        class="icon-btn icon-btn-del" title="Xóa"
                                        onclick="return window.confirmNavigate(event, 'Bạn có chắc chắn muốn xóa danh mục này?', this.href);"><i
                                            class="fa-solid fa-trash"></i></a>
                                </div>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
        <script th:src="@{/js/admin/categories.js}"></script>
    </div>
    <div th:replace="~{admin/layout/common-scripts :: scripts}"></div>
</body>

</html>
