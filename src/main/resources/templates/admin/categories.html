<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title data-translate="admin-categories-page-title">Quản Lý Danh Mục — Luxury PC</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root{ --black:#0a0a0a; --deep:#111; --dark:#1a1a1a; --mid:#2a2a2a; --gold:#c9a84c; --gold-l:#e8c97a; --cream:#f5f0e8; --white:#fff; --muted:#888; --red:#ef4444; --green:#22c55e; --blue:#3b82f6; --sans:'Montserrat',sans-serif; }
        *{ margin:0; padding:0; box-sizing:border-box; }
        body{ background:var(--black); color:var(--cream); font-family:var(--sans); display:flex; min-height: 100vh;}
        
        .sidebar { width: 280px; background: var(--deep); border-right: 1px solid rgba(201,168,76,0.1); padding: 2rem; position: fixed; height: 100vh; z-index: 100;}
        .logo { font-size: 1.5rem; color: var(--gold); letter-spacing: 0.2em; margin-bottom: 3rem; display: block; text-decoration: none; font-weight: 700; text-align: center;}
        .nav-link { display: flex; align-items: center; color: var(--muted); padding: 1rem; text-decoration: none; transition: 0.3s; border-radius: 4px; margin-bottom: 0.5rem; font-size: 0.9rem; }
        .nav-link i { width: 25px; font-size: 1.1rem; }
        .nav-link:hover, .nav-link.active { background: rgba(201,168,76,0.05); color: var(--gold); }

        .main-content{ margin-left:280px; flex:1; padding:3rem; }
        
        .header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; border-bottom: 1px solid rgba(255,255,255,0.05); padding-bottom: 1.5rem;}
        .title h1 { font-size: 1.8rem; font-weight: 400; color: #fff;}
        .user-info { display: flex; align-items: center; gap: 10px; background: var(--dark); padding: 8px 20px; border-radius: 20px; border: 1px solid rgba(201,168,76,0.2);}
        
        .card{ background:var(--dark); padding:2rem; border:1px solid rgba(201,168,76,0.1); border-radius:8px; margin-bottom:2rem; }
        .card-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; }
        
        .btn { padding: 0.6rem 1.2rem; border-radius: 4px; border: none; font-weight: 600; cursor: pointer; transition: 0.2s; text-decoration: none; display: inline-block;}
        .btn-gold { background: var(--gold); color: var(--black); }
        .btn-gold:hover { background: var(--gold-l); }
        .btn-outline { background: transparent; border: 1px solid var(--gold); color: var(--gold);}
        .btn-danger { background: rgba(239, 68, 68, 0.1); color: var(--red); border: 1px solid var(--red);}
        .btn-danger:hover { background: var(--red); color: #fff;}

        table{ width:100%; border-collapse:collapse; }
        th{ text-align:left; font-size:0.75rem; color:var(--muted); padding:1rem; background:rgba(0,0,0,0.2); text-transform: uppercase;}
        td{ padding:1rem; border-bottom:1px solid rgba(255,255,255,0.05); font-size:0.85rem; vertical-align: middle;}
        
        .action-btns { display: flex; gap: 8px;}
        .icon-btn { width: 30px; height: 30px; border-radius: 4px; display: flex; align-items: center; justify-content: center; border: 1px solid; cursor: pointer; background: transparent;}
        .icon-btn-edit { color: var(--blue); border-color: var(--blue); }
        .icon-btn-edit:hover { background: var(--blue); color: #fff;}
        .icon-btn-del { color: var(--red); border-color: var(--red); }
        .icon-btn-del:hover { background: var(--red); color: #fff;}

        .input-group{ display:flex; flex-direction:column; font-size:0.85rem; margin-bottom:1.5rem;}
        .input-group label{ margin-bottom:0.5rem; color:var(--muted); }
        .input-group input{ background:var(--mid); border:1px solid rgba(201,168,76,0.2); color:var(--white); padding:0.8rem; border-radius:4px; outline:none; font-family: var(--sans);}
        .input-group input:focus{ border-color:var(--gold); }
        
        .add-form-container { display: none; }
        .add-form-container.active { display: block; animation: slideDown 0.3s ease;}
        @keyframes slideDown { from { opacity: 0; transform: translateY(-10px);} to { opacity: 1; transform: translateY(0);}}
    </style>
</head>
<body>

<div th:replace="~{admin/layout/sidebar :: sidebar}"></div>

<div class="main-content">
    <div class="header">
        <div class="title">
            <h1><span data-translate="admin-categories-title">Quản Lý Danh Mục</span> (<span th:text="${categories != null ? categories.size() : 0}">0</span>)</h1>
        </div>
        <div class="user-info">
            <i class="fa-solid fa-user-shield" style="color: var(--gold);"></i>
            <span th:text="${#authentication.name}">Admin</span>
        </div>
    </div>

    <div style="margin-bottom: 1.5rem;">
        <button class="btn btn-gold" onclick="toggleForm()"><i class="fa-solid fa-plus"></i> <span data-translate="admin-categories-btn-add">Thêm Danh Mục Mới</span></button>
    </div>

    <div class="card add-form-container" id="categoryForm" th:classappend="${category.id != null ? 'active' : ''}">
        <div class="card-header">
            <h2 th:data-translate="${category.id == null ? 'admin-categories-form-add' : 'admin-categories-form-edit'}" th:text="${category.id == null ? 'Thêm Danh Mục' : 'Sửa Danh Mục'}">Thông Tin Danh Mục</h2>
            <button class="icon-btn icon-btn-del" onclick="toggleForm()" title="Thoát"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <form th:action="@{/admin/categories/save}" method="post" th:object="${category}">

            <input type="hidden" th:field="*{id}">
            <div class="input-group">
                <label data-translate="admin-categories-label-name">Tên Danh Mục *</label>
                <input type="text" th:field="*{name}" required data-translate-placeholder="admin-categories-placeholder-name" placeholder="VD: Card Màn Hình">
            </div>
            <div style="display: flex; gap: 10px;">
                <button type="submit" class="btn btn-gold" data-translate="admin-categories-btn-save">Lưu Danh Mục</button>
                <button type="button" class="btn btn-outline" onclick="location.href='/admin/categories'" data-translate="admin-categories-btn-cancel">Hủy / Làm mới</button>
            </div>
        </form>
    </div>

    <div class="card">
        <table>
            <thead>
            <tr>
                <th data-translate="admin-categories-th-id">ID</th>
                <th data-translate="admin-categories-th-name">Tên Danh Mục</th>
                <th style="width: 100px;" data-translate="admin-categories-th-actions">Thao Tác</th>
            </tr>
            </thead>
            <tbody>
            <tr th:each="c : ${categories}">
                <td th:text="${c.id}">1</td>
                <td th:text="${c.name}" style="font-weight: 600; color: #fff;">CPU</td>
                <td>
                    <div class="action-btns">
                        <a th:href="@{|/admin/categories/edit/${c.id}|}" class="icon-btn icon-btn-edit" title="Sửa"><i class="fa-solid fa-pen"></i></a>
                        <form th:action="@{|/admin/categories/delete/${c.id}|}" method="post" style="display:inline;">
                
                            <button type="submit" class="icon-btn icon-btn-del" title="Xóa" onclick="return confirm(window.t('admin-categories-confirm-delete', 'Xóa danh mục này có thể ảnh hưởng đến sản phẩm liên quan. Tiếp tục?'))" style="border:none;background:none;cursor:pointer;"><i class="fa-solid fa-trash"></i></button>
                        </form>
                    </div>
                </td>
            </tr>
            </tbody>
        </table>
    </div>
</div>

<script th:src="@{/js/admin/categories.js}"></script>
</body>
</html>
