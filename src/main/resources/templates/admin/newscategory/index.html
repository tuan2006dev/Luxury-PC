<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="icon" type="image/png" th:href="@{/images/logo.svg}" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh mục tin tức - Admin</title>
    <link data-pjax-track="true"
        href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link data-pjax-track="true" rel="stylesheet"
        href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link data-pjax-track="true" rel="stylesheet" th:href="@{/css/admin/newscategory/index.css}">
    <link data-pjax-track="true" rel="stylesheet" th:href="@{/css/admin/admin.css}">
</head>

<body>
    <div th:replace="~{admin/layout/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="page-header">
            <h2>Quản Lý Danh Mục Tin Tức</h2>
            <div th:replace="~{admin/layout/header :: adminProfile}"></div>
        </div>
        <div style="display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 1rem;">
            <div
                th:replace="~{admin/fragments/search-bar :: searchBar(actionUrl='/admin/news-categories', keyword=${keyword})}">
            </div>
            <a th:href="@{/admin/news-categories/create}" class="btn btn-primary"><i class="fa fa-plus"></i> Thêm danh
                mục</a>
        </div>

        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="card">
            <div class="table-wrapper" style="width: 100%;">
                <table style="width: 100%;">
                    <thead>
                        <tr>
                            <th>STT</th>
                            <th>Tên danh mục</th>
                            <th>Đường dẫn (Slug)</th>
                            <th>Số bài viết</th>
                            <th>Trạng thái</th>
                            <th>Hành động</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="cat, stat : ${categories}">
                            <td th:text="${(startItem != null ? startItem : 1) + stat.index}">1</td>
                            <td th:text="${cat.name}">Tên</td>
                            <td th:text="${cat.slug}">slug</td>
                            <td th:text="${cat.newsList != null ? cat.newsList.size() : 0}">0</td>
                            <td>
                                <span class="badge badge-success" th:if="${cat.status == 'ACTIVE'}">Hoạt động</span>
                                <span class="badge badge-gray" th:unless="${cat.status == 'ACTIVE'}">Ẩn</span>
                            </td>
                            <td>
                                <div class="action-btns">
                                    <a th:href="@{/admin/news-categories/edit/{id}(id=${cat.id})}" class="btn btn-warning"><i
                                            class="fa fa-edit"></i></a>
                                    <form th:action="@{/admin/news-categories/delete/{id}(id=${cat.id})}" method="post"
                                        onsubmit="return window.confirmSubmit(event, 'Xóa danh mục này?');"
                                        style="margin:0;">
                                        <button type="submit" class="btn btn-danger"><i class="fa fa-trash"></i></button>
                                    </form>
                                </div>
                            </td>
                        </tr>
                        <tr th:if="${categories.empty}">
                            <td colspan="6" style="text-align:center;">Chưa có danh mục nào</td>
                        </tr>
                    </tbody>
                </table>
            </div>

            <!-- Pagination -->
            <div th:replace="~{admin/fragments/pagination :: pagination(baseUrl='/admin/news-categories')}"></div>
        </div>
    </div>
    <div th:replace="~{admin/layout/common-scripts :: scripts}"></div>
</body>

</html>
