<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="icon" type="image/png" th:href="@{/images/logo.svg}" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Danh mục tin tức - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/newscategory/index.css}">
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
</head>

<body>
    <div th:replace="~{admin/layout/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="page-header">
            <h2>Quản Lý Danh Mục Tin Tức</h2>
            <div th:replace="~{admin/layout/header :: adminProfile}"></div>
        </div>
        <a th:href="@{/admin/news-categories/create}" class="btn btn-primary"><i class="fa fa-plus"></i> Thêm danh
            mục</a>
        <div th:if="${success}" class="alert alert-success" th:text="${success}"></div>
        <div th:if="${error}" class="alert alert-danger" th:text="${error}"></div>

        <div class="table-wrapper" style="width: 100%; max-height: 75vh; overflow: auto;">
            <table style="width: 100%;">
                <thead>
                    <tr>
                        <th style="position: sticky; top: 0; z-index: 10; background: #f8fafc;">ID</th>
                        <th style="position: sticky; top: 0; z-index: 10; background: #f8fafc;">Tên danh mục</th>
                        <th style="position: sticky; top: 0; z-index: 10; background: #f8fafc;">Đường dẫn (Slug)</th>
                        <th style="position: sticky; top: 0; z-index: 10; background: #f8fafc;">Số bài viết</th>
                        <th style="position: sticky; top: 0; z-index: 10; background: #f8fafc;">Trạng thái</th>
                        <th style="position: sticky; top: 0; z-index: 10; background: #f8fafc;">Hành động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="cat : ${categories}">
                        <td th:text="${cat.id}">1</td>
                        <td th:text="${cat.name}">Tên</td>
                        <td th:text="${cat.slug}">slug</td>
                        <td th:text="${cat.newsList != null ? cat.newsList.size() : 0}">0</td>
                        <td>
                            <span class="badge badge-success" th:if="${cat.status == 'ACTIVE'}">Hoạt động</span>
                            <span class="badge badge-gray" th:unless="${cat.status == 'ACTIVE'}">Ẩn</span>
                        </td>
                        <td>
                            <div class="action-btns">
                                <a th:href="@{/admin/news-categories/edit/{id}(id=${cat.id})}"
                                    class="btn btn-warning"><i class="fa fa-edit"></i></a>
                                <form th:action="@{/admin/news-categories/delete/{id}(id=${cat.id})}" method="post"
                                    onsubmit="return window.confirmSubmit(event, 'Xóa danh mục này?');"
                                    style="margin:0;">
                                    <button type="submit" class="btn btn-danger"><i class="fa fa-trash"></i></button>
                                </form>
                            </div>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(categories)}">
                        <td colspan="6" style="text-align:center;">Chưa có danh mục nào</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
    <div th:replace="~{admin/layout/common-scripts :: scripts}"></div>
</body>

</html>
