<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="icon" type="image/png" th:href="@{/images/logo.svg}" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm/Sửa Danh Mục - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/newscategory/form.css}">
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
</head>

<body>
    <div th:replace="~{admin/layout/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="page-header">
            <h2 th:text="${category.id == null ? 'Thêm Danh Mục' : 'Sửa Danh Mục'}"></h2>
        </div>

        <div class="form-container">
            <form th:action="@{/admin/news-categories/save}" th:object="${category}" method="post">
                <input type="hidden" th:field="*{id}" />

                <div class="form-group">
                    <label>Tên danh mục *</label>
                    <input type="text" class="form-control" th:field="*{name}" required
                        placeholder="VD: Tin Công Nghệ" />
                </div>

                <div class="form-group">
                    <label>Đường dẫn (Slug)</label>
                    <input type="text" class="form-control" th:field="*{slug}"
                        placeholder="Để trống sẽ tự tạo từ tên" />
                </div>

                <div class="form-group">
                    <label>Mô tả ngắn</label>
                    <textarea class="form-control" th:field="*{description}" placeholder="Mô tả danh mục..."></textarea>
                </div>

                <div class="form-group">
                    <label>Trạng thái</label>
                    <select class="form-control" th:field="*{status}">
                        <option value="ACTIVE">Hoạt động (Hiển thị)</option>
                        <option value="INACTIVE">Ẩn</option>
                    </select>
                </div>

                <div style="margin-top: 30px;">
                    <button type="submit" class="btn-submit"><i class="fa fa-save"></i> Lưu danh mục</button>
                    <a th:href="@{/admin/news-categories}" class="btn-cancel">Hủy</a>
                </div>
            </form>
        </div>
    </div>
</body>

</html>
