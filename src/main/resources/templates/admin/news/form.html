<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="icon" type="image/png" th:href="@{/images/logo.svg}" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thêm/Sửa Bài Viết - Admin</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
    <link rel="stylesheet" th:href="@{/css/admin/news/form.css}">

    <!-- TinyMCE CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/tinymce/6.8.3/tinymce.min.js" referrerpolicy="origin"></script>
    <script>
        tinymce.init({
            selector: '#content',
            plugins: 'preview importcss searchreplace autolink autosave save directionality code visualblocks visualchars fullscreen image link media template codesample table charmap pagebreak nonbreaking anchor insertdatetime advlist lists wordcount help charmap quickbars emoticons',
            toolbar: 'undo redo | bold italic underline strikethrough | fontfamily fontsize blocks | alignleft aligncenter alignright alignjustify | outdent indent |  numlist bullist | forecolor backcolor removeformat | pagebreak | charmap emoticons | fullscreen  preview save print | insertfile image media template link anchor codesample | ltr rtl',
            toolbar_sticky: true,
            image_advtab: true,
            height: 600,
            image_caption: true,
            quickbars_selection_toolbar: 'bold italic | quicklink h2 h3 blockquote quickimage quicktable',
            noneditable_class: 'mceNonEditable',
            toolbar_mode: 'sliding',
            contextmenu: 'link image table',

            // Image upload handler
            images_upload_url: '/admin/news/upload-image',
            automatic_uploads: true,
            file_picker_types: 'image',
            images_upload_handler: function (blobInfo, progress) {
                return new Promise((resolve, reject) => {
                    var xhr, formData;
                    xhr = new XMLHttpRequest();
                    xhr.withCredentials = false;
                    xhr.open('POST', '/admin/news/upload-image');

                    xhr.upload.onprogress = function (e) {
                        progress(e.loaded / e.total * 100);
                    };

                    xhr.onload = function () {
                        var json;
                        if (xhr.status < 200 || xhr.status >= 300) {
                            reject('HTTP Error: ' + xhr.status);
                            return;
                        }
                        json = JSON.parse(xhr.responseText);
                        if (!json || typeof json.location != 'string') {
                            reject('Invalid JSON: ' + xhr.responseText);
                            return;
                        }
                        resolve(json.location);
                    };

                    xhr.onerror = function () {
                        reject('Image upload failed due to a XHR Transport error. Code: ' + xhr.status);
                    };

                    formData = new FormData();
                    formData.append('file', blobInfo.blob(), blobInfo.filename());
                    xhr.send(formData);
                });
            }
        });
    </script>
</head>

<body>
    <div th:replace="~{admin/layout/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="page-header">
            <h2 th:text="${news.id == null ? 'Thêm Bài Viết Mới' : 'Chỉnh Sửa Bài Viết'}"></h2>
        </div>

        <form th:action="@{/admin/news/save}" th:object="${news}" method="post" enctype="multipart/form-data">
            <input type="hidden" th:field="*{id}" />

            <div th:if="${#fields.hasErrors('*')}"
                style="background:#fee2e2; color:#991b1b; padding:12px 16px; border-radius:6px; margin-bottom:20px; border:1px solid #fecaca; font-size:14px;">
                <strong><i class="fa fa-exclamation-triangle"></i> Có lỗi xảy ra khi lưu bài viết:</strong>
                <ul style="margin:5px 0 0 20px; padding:0;">
                    <li th:each="err : ${#fields.errors('*')}" th:text="${err}"></li>
                </ul>
            </div>

            <div class="row">
                <!-- Cột trái: Nội dung chính -->
                <div class="col-8">
                    <div class="form-container">
                        <div class="form-group">
                            <label>Tiêu đề bài viết *</label>
                            <input type="text" class="form-control" th:field="*{title}" required
                                placeholder="Nhập tiêu đề bài viết..." />
                        </div>

                        <div class="form-group">
                            <label>Mô tả tóm tắt (Summary)</label>
                            <textarea class="form-control" th:field="*{summary}" rows="3"
                                placeholder="Tóm tắt ngắn gọn nội dung bài viết..."></textarea>
                        </div>

                        <div class="form-group">
                            <label>Nội dung chi tiết *</label>
                            <textarea id="content" th:field="*{content}"></textarea>
                        </div>
                    </div>

                    <div class="form-container" style="margin-top: 24px;">
                        <h3 class="card-title">Tối ưu SEO</h3>

                        <div class="form-group">
                            <label>Đường dẫn tĩnh (Slug)</label>
                            <input type="text" class="form-control" th:field="*{slug}"
                                placeholder="Để trống sẽ tự tạo từ tiêu đề" />
                            <small style="color: #64748b;">Ví dụ: danh-gia-rtx-4060</small>
                        </div>

                        <div class="form-group">
                            <label>Meta Title</label>
                            <input type="text" class="form-control" th:field="*{metaTitle}"
                                placeholder="Tiêu đề SEO (nếu khác tiêu đề bài)" />
                        </div>

                        <div class="form-group">
                            <label>Meta Description</label>
                            <textarea class="form-control" th:field="*{metaDescription}" rows="2"
                                placeholder="Mô tả cho Google Search..."></textarea>
                        </div>

                        <div class="form-group">
                            <label>Meta Keywords</label>
                            <input type="text" class="form-control" th:field="*{metaKeywords}"
                                placeholder="rtx 4060, card đồ họa, đánh giá..." />
                        </div>
                    </div>
                </div>

                <!-- Cột phải: Thuộc tính & Xuất bản -->
                <div class="col-4">
                    <div class="card">
                        <h3 class="card-title">Xuất bản</h3>

                        <div class="form-group">
                            <label>Trạng thái</label>
                            <select class="form-control" th:field="*{status}">
                                <option value="PUBLISHED">Xuất bản ngay</option>
                                <option value="DRAFT">Lưu bản nháp</option>
                                <option value="ARCHIVED">Lưu trữ (Ẩn)</option>
                            </select>
                        </div>

                        <div class="form-group">
                            <label>Danh mục</label>
                            <select class="form-control" th:field="*{category.id}">
                                <option value="">-- Chọn danh mục --</option>
                                <option th:each="cat : ${categories}" th:value="${cat.id}" th:text="${cat.name}">
                                </option>
                            </select>
                        </div>

                        <button type="submit" class="btn-submit"><i class="fa fa-save"></i> LƯU BÀI VIẾT</button>
                        <a th:href="@{/admin/news}" class="btn-cancel">Hủy bỏ</a>
                    </div>

                    <div class="card">
                        <h3 class="card-title">Ảnh đại diện (Thumbnail)</h3>
                        <div class="form-group">
                            <input type="file" name="thumbnailFile" id="thumbnailFile" class="form-control"
                                accept="image/*" onchange="previewImage(this);" />
                            <small style="color: #64748b; display:block; margin-top:5px;">Chọn ảnh mới để thay thế ảnh
                                cũ (nếu có)</small>

                            <!-- Ảnh preview hoặc ảnh cũ -->
                            <img id="preview"
                                th:src="${news.thumbnail != null} ? @{${news.thumbnail.startsWith('http') || news.thumbnail.startsWith('/') ? news.thumbnail : '/images/news/' + news.thumbnail}} : '#'"
                                class="img-preview" th:style="${news.thumbnail != null} ? 'display:block;' : ''" />
                        </div>
                    </div>
                </div>
            </div>
        </form>
    </div>

    <script>
        function previewImage(input) {
            if (input.files && input.files[0]) {
                var reader = new FileReader();
                reader.onload = function (e) {
                    var preview = document.getElementById('preview');
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                };
                reader.readAsDataURL(input.files[0]);
            }
        }
    </script>
</body>

</html>
