<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="icon" type="image/png" th:href="@{/images/logo.svg}" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Kho Hàng — Luxury PC</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/inventory.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
</head>

<body>
    <div th:replace="~{admin/layout/sidebar :: sidebar}"></div>

    <div class="main-content">
        <div class="header"
            style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 1.5rem; border-bottom: 1px solid #e2e8f0; padding-bottom: 1rem;">
            <div class="title">
                <h1 style="font-size: 1.6rem; margin: 0; color: #0f172a;"><i class="fa-solid fa-boxes-stacked"
                        style="color:var(--gold);margin-right:10px;"></i><span>Quản Lý Kho Hàng</span></h1>
                <p style="color: var(--muted); font-size: 0.85rem; margin: 4px 0 0 0;">Theo dõi và điều chỉnh số lượng
                    tồn kho sản phẩm trong hệ thống</p>
            </div>
            <div th:replace="~{admin/layout/header :: adminProfile}"></div>
        </div>

        <!-- Search Bar -->
        <div style="margin-bottom: 1.5rem;">
            <div
                th:replace="~{admin/fragments/search-bar :: searchBar(actionUrl='/admin/inventory', keyword=${keyword})}">
            </div>
        </div>

        <div th:replace="~{admin/fragments/toast :: toast}"></div>

        <div class="table-card">
            <div class="table-h">
                <h2>Quản Lý Kho Hàng</h2>
                <span><span th:text="${inventory.size()}">0</span> <span>sản phẩm</span></span>
            </div>
            <div class="table-wrapper">
                <table class="admin-table inventory-table" style="min-width: 900px;">
                    <thead>
                        <tr>
                            <th style="white-space: nowrap;">Sản Phẩm</th>
                            <th style="white-space: nowrap;">Danh Mục</th>
                            <th style="white-space: nowrap;">Tồn Kho</th>
                            <th style="white-space: nowrap;">Cập Nhật Cuối</th>
                            <th style="white-space: nowrap; text-align: center;">Điều Chỉnh Kho</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${inventory}">
                            <td style="white-space: nowrap; max-width: 280px; overflow: hidden; text-overflow: ellipsis;"
                                th:title="${item.product != null ? item.product.name : ''}">
                                <div th:text="${item.product != null ? item.product.name : '—'}"
                                    style="overflow: hidden; text-overflow: ellipsis; white-space: nowrap; font-weight: 500;">
                                    Product Name</div>
                            </td>
                            <td style="white-space: nowrap;"
                                th:text="${item.product != null and item.product.category != null ? item.product.category.name : '—'}">
                                Category</td>
                            <td style="white-space: nowrap;">
                                <div style="display: flex; align-items: center; white-space: nowrap;">
                                    <span th:text="${item.quantity}" style="min-width: 20px; font-weight: 600;">0</span>
                                    <span th:if="${item.quantity < 10}" class="badge badge-low"
                                        style="margin-left:8px;">Sắp hết</span>
                                </div>
                            </td>
                            <td style="white-space: nowrap;"
                                th:text="${#dates.format(item.lastUpdate, 'dd/MM/yyyy HH:mm')}">27/03/2026</td>
                            <td style="white-space: nowrap;">
                                <form class="form-group" autocomplete="off" novalidate
                                    th:action="@{/admin/inventory/adjust}" method="post"
                                    onsubmit="return validateInventoryForm(this)"
                                    style="display:flex; align-items:center; gap: 10px; flex-wrap: nowrap;">
                                    <input autocomplete="off" type="hidden" name="productId" style="width:200px;"
                                        th:value="${item.product != null ? item.product.id : ''}">
                                    <div style="position: relative;">
                                        <input autocomplete="off" type="number" name="quantity" class="stock-input"
                                            style="width:160px;" placeholder="Số lượng" required min="1" max="200">
                                    </div>
                                    <select name="type" class="type-select" style="margin: 0; width:160px;">
                                        <option value="IMPORT">Nhập Kho</option>
                                        <option value="EXPORT">Xuất Kho</option>
                                    </select>
                                    <div style="position: relative;">
                                        <input autocomplete="off" type="text" name="note" class="stock-input"
                                            style="width:160px;" placeholder="Ghi chú">
                                    </div>
                                    <button type="submit" class="adj-btn">Xác Nhận</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
    <script>
        function showFieldError(inputEl, msg) {
            if (!inputEl) return;
            const container = inputEl.parentElement;
            if (!container) return;

            let errorEl = container.querySelector('.field-error-msg');
            if (!errorEl) {
                errorEl = document.createElement('small');
                errorEl.className = 'field-error-msg';
                errorEl.style.cssText = "position: absolute; top: 100%; left: 0; margin-top: 2px; color: #ef4444; font-size: 11px; font-weight: 500; display: block; line-height: 1.2; white-space: nowrap; z-index: 10;";
                if (getComputedStyle(container).position === 'static') {
                    container.style.position = 'relative';
                }
                container.appendChild(errorEl);
            }
            errorEl.innerText = msg;
            errorEl.style.display = 'block';

            inputEl.classList.remove('input-error');
            void inputEl.offsetWidth; // re-trigger animation
            inputEl.classList.add('input-error');
        }

        function clearFieldError(inputEl) {
            if (!inputEl) return;
            inputEl.classList.remove('input-error');
            const container = inputEl.parentElement;
            if (container) {
                const errorEl = container.querySelector('.field-error-msg');
                if (errorEl) {
                    errorEl.style.display = 'none';
                    errorEl.innerText = '';
                }
            }
        }

        function validateInventoryForm(form) {
            const quantityInput = form.querySelector('input[name="quantity"]');
            let isValid = true;
            let firstInvalidEl = null;

            clearFieldError(quantityInput);

            if (!quantityInput || !quantityInput.value || quantityInput.value.trim() === '') {
                showFieldError(quantityInput, 'Vui lòng nhập số lượng!');
                if (!firstInvalidEl) firstInvalidEl = quantityInput;
                isValid = false;
            } else {
                const quantity = parseInt(quantityInput.value.trim(), 10);
                if (isNaN(quantity) || quantity <= 0) {
                    showFieldError(quantityInput, 'Số lượng phải lớn hơn 0!');
                    if (!firstInvalidEl) firstInvalidEl = quantityInput;
                    isValid = false;
                } else if (quantity > 200) {
                    showFieldError(quantityInput, 'Tối đa 200 sản phẩm!');
                    if (!firstInvalidEl) firstInvalidEl = quantityInput;
                    isValid = false;
                }
            }
            if (!isValid && firstInvalidEl) {
                firstInvalidEl.focus();
            }

            return isValid;
        }

        document.addEventListener('DOMContentLoaded', function () {
            const inputs = document.querySelectorAll('.inventory-table input[name="quantity"], .inventory-table input[name="note"]');
            inputs.forEach(input => {
                input.addEventListener('input', function () {
                    if (this.value && this.value.trim() !== '') {
                        clearFieldError(this);
                    }
                });
            });
        });
    </script>
    <div th:replace="~{admin/layout/common-scripts :: scripts}"></div>
</body>

</html>
