<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="icon" type="image/png" th:href="@{/images/logo.svg}" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Kho Hàng — Luxury PC</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/inventory.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
</head>

<body>
    <div th:replace="~{admin/layout/sidebar :: sidebar}"></div>

    <div class="main-content">
        <!-- Search Bar -->
        <div th:replace="~{admin/fragments/search-bar :: searchBar(actionUrl='/admin/inventory', keyword=${keyword})}"></div>

        <div class="table-card">
            <div class="table-h">
                <h2>Quản Lý Kho Hàng</h2>
                <span><span th:text="${inventory.size()}">0</span> <span>sản phẩm</span></span>
            </div>
            <div style="width: 100%; overflow-x: auto;">
                <table class="admin-table inventory-table">
                    <thead>
                        <tr>
                            <th>Sản Phẩm</th>
                            <th>Danh Mục</th>
                            <th>Tồn Kho</th>
                            <th>Cập Nhật Cuối</th>
                            <th>Điều Chỉnh Kho</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${inventory}">
                            <td>
                                <div th:text="${item.product.name}">Product Name</div>
                            </td>
                            <td th:text="${item.product.category.name}">Category</td>
                            <td>
                                <div style="display: flex; align-items: center; white-space: nowrap;">
                                    <span th:text="${item.quantity}" style="min-width: 20px;">0</span>
                                    <span th:if="${item.quantity < 10}" class="badge badge-low" style="margin-left:8px;">Sắp hết</span>
                                </div>
                            </td>
                            <td th:text="${#dates.format(item.lastUpdate, 'dd/MM/yyyy HH:mm')}">27/03/2026</td>
                            <td>
                                <form autocomplete="off" th:action="@{/admin/inventory/adjust}" method="post"
                                    style="display:flex; align-items:center;">
                                    <input autocomplete="off" type="hidden" name="productId"
                                        th:value="${item.product.id}">
                                    <input autocomplete="off" type="number" name="quantity" class="stock-input"
                                        placeholder="Số lượng" required min="1">
                                    <select name="type" class="type-select">
                                        <option value="IMPORT">Nhập Kho
                                        </option>
                                        <option value="EXPORT">Xuất Kho
                                        </option>
                                    </select>
                                    <input autocomplete="off" type="text" name="note" class="stock-input"
                                        style="width:120px; margin-right:0.5rem" placeholder="Ghi chú">
                                    <button type="submit" class="adj-btn">Xác Nhận</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- Phân trang -->
            <div class="pagination-container" th:if="${inventoryPage.totalPages > 1}" style="display: flex; justify-content: center; align-items: center; padding: 20px 0; gap: 10px;">
                <a th:if="${!inventoryPage.first}" th:href="@{/admin/inventory(keyword=${keyword}, sort=${sort}, page=${inventoryPage.number - 1})}" style="padding: 8px 12px; border: 1px solid var(--border); border-radius: 4px; text-decoration: none; color: var(--text-main);"><i class="fa-solid fa-angle-left"></i></a>
                
                <span style="font-size: 14px; font-weight: 500;">Trang</span>
                <select onchange="window.location.href=this.value" style="padding: 6px 10px; border: 1px solid var(--border); border-radius: 4px; background: var(--bg-card); color: var(--text-main); font-family: inherit; font-size: 14px; cursor: pointer; outline: none;">
                    <option th:each="pageNum : ${#numbers.sequence(0, inventoryPage.totalPages - 1)}" 
                            th:value="@{/admin/inventory(keyword=${keyword}, sort=${sort}, page=${pageNum})}" 
                            th:text="${pageNum + 1}" 
                            th:selected="${pageNum == inventoryPage.number}"></option>
                </select>
                <span style="font-size: 14px; font-weight: 500; color: #64748b;">/ [[${inventoryPage.totalPages}]]</span>

                <a th:if="${!inventoryPage.last}" th:href="@{/admin/inventory(keyword=${keyword}, sort=${sort}, page=${inventoryPage.number + 1})}" style="padding: 8px 12px; border: 1px solid var(--border); border-radius: 4px; text-decoration: none; color: var(--text-main);"><i class="fa-solid fa-angle-right"></i></a>
            </div>
        </div>
    </div>
    <div th:replace="~{admin/layout/common-scripts :: scripts}"></div>
</body>

</html>
