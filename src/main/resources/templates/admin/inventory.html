<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <link rel="icon" type="image/png" th:href="@{/images/logo.svg}" />
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Kho Hàng — Luxury PC</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/inventory.css}" />
    <link rel="stylesheet" th:href="@{/css/admin/admin.css}">
</head>

<body>
    <div th:replace="~{admin/layout/sidebar :: sidebar}"></div>

    <div class="main-content">
        <!-- Search Bar -->
        <div th:replace="~{admin/fragments/search-bar :: searchBar(actionUrl='/admin/inventory', keyword=${keyword})}"></div>

        <div class="table-card">
            <div class="table-h">
                <h2>Quản Lý Kho Hàng</h2>
                <span><span th:text="${inventory.size()}">0</span> <span>sản phẩm</span></span>
            </div>
            <div style="width: 100%; overflow-x: auto;">
                <table class="admin-table inventory-table">
                    <thead>
                        <tr>
                            <th>Sản Phẩm</th>
                            <th>Danh Mục</th>
                            <th>Tồn Kho</th>
                            <th>Cập Nhật Cuối</th>
                            <th>Điều Chỉnh Kho</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="item : ${inventory}">
                            <td>
                                <div th:text="${item.product.name}">Product Name</div>
                            </td>
                            <td th:text="${item.product.category.name}">Category</td>
                            <td>
                                <div style="display: flex; align-items: center; white-space: nowrap;">
                                    <span th:text="${item.quantity}" style="min-width: 20px;">0</span>
                                    <span th:if="${item.quantity < 10}" class="badge badge-low" style="margin-left:8px;">Sắp hết</span>
                                </div>
                            </td>
                            <td th:text="${#dates.format(item.lastUpdate, 'dd/MM/yyyy HH:mm')}">27/03/2026</td>
                            <td>
                                <form autocomplete="off" th:action="@{/admin/inventory/adjust}" method="post"
                                    style="display:flex; align-items:center;">
                                    <input autocomplete="off" type="hidden" name="productId"
                                        th:value="${item.product.id}">
                                    <input autocomplete="off" type="number" name="quantity" class="stock-input"
                                        placeholder="Số lượng" required min="1">
                                    <select name="type" class="type-select">
                                        <option value="IMPORT">Nhập Kho
                                        </option>
                                        <option value="EXPORT">Xuất Kho
                                        </option>
                                    </select>
                                    <input autocomplete="off" type="text" name="note" class="stock-input"
                                        style="width:120px; margin-right:0.5rem" placeholder="Ghi chú">
                                    <button type="submit" class="adj-btn">Xác Nhận</button>
                                </form>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
            
            <!-- Phân trang -->
            <div th:replace="~{admin/layout/pagination :: pagination(pageObj=${inventoryPage})}"></div>
        </div>
    </div>
    <div th:replace="~{admin/layout/common-scripts :: scripts}"></div>
</body>

</html>
