<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Kho Hàng — Luxury PC</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/inventory.css}" />
</head>
<body>
    <div class="sidebar">
        <a href="/" class="logo">LUXURY<span style="font-weight:300;">PC</span></a>
        <nav>
            <a href="/admin/dashboard" class="nav-link"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
            <a href="/admin/orders" class="nav-link"><i class="fa-solid fa-box"></i> Đơn Hàng</a>
            <a href="/admin/inventory" class="nav-link active"><i class="fa-solid fa-warehouse"></i> Kho Hàng</a>
            <a href="/admin/categories" class="nav-link"><i class="fa-solid fa-layer-group"></i> Danh Mục</a>
            <a href="/admin/products" class="nav-link"><i class="fa-solid fa-microchip"></i> Sản Phẩm</a>
            <a href="/admin/vouchers" class="nav-link"><i class="fa-solid fa-ticket"></i> Voucher</a>
            <a href="/admin/flash-sales" class="nav-link"><i class="fa-solid fa-bolt"></i> Flash Sale</a>
            <a href="/admin/account" class="nav-link"><i class="fa-solid fa-users"></i> Người Dùng</a>
        </nav>
    </div>
    <div class="main-content">
        <div class="table-card">
            <div class="table-h">
                <h2>Quản Lý Kho Hàng</h2>
                <span th:text="${inventory.size()} + ' sản phẩm'">0 sản phẩm</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>Sản Phẩm</th>
                        <th>Danh Mục</th>
                        <th>Tồn Kho</th>
                        <th>Cập Nhật Cuối</th>
                        <th>Điều Chỉnh Kho</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="item : ${inventory}">
                        <td>
                            <div th:text="${item.product.name}">Product Name</div>
                        </td>
                        <td th:text="${item.product.category.name}">Category</td>
                        <td>
                            <span th:text="${item.quantity}">0</span>
                            <span th:if="${item.quantity < 10}" class="badge badge-low" style="margin-left:5px;">Sắp hết</span>
                        </td>
                        <td th:text="${#dates.format(item.lastUpdate, 'dd/MM/yyyy HH:mm')}">27/03/2026</td>
                        <td>
                            <form action="/admin/inventory/adjust" method="post" style="display:flex; align-items:center;">
                                <input type="hidden" name="productId" th:value="${item.product.id}">
                                <input type="number" name="quantity" class="stock-input" placeholder="Số lượng" required min="1">
                                <select name="type" class="type-select">
                                    <option value="IMPORT">Nhập Kho</option>
                                    <option value="EXPORT">Xuất Kho</option>
                                </select>
                                <input type="text" name="note" class="stock-input" style="width:120px; margin-right:0.5rem" placeholder="Ghi chú">
                                <button type="submit" class="adj-btn">Xác Nhận</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
