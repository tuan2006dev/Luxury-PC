<div class="sidebar" th:fragment="sidebar">

    <link rel="stylesheet" th:href="@{/css/admin/layout/sidebar.css(v=4.0)}" />

    <!-- Sidebar Header with Logo and Collapse/Expand Toggle Button -->
    <div class="sidebar-header">
        <a href="/" class="logo">LUXURY<span style="font-weight:300;">PC</span></a>
        <button type="button" class="sidebar-toggle-btn" id="sidebarToggleBtn" onclick="toggleSidebarCollapse()" title="Thu gọn / Mở rộng menu">
            <i class="fa-solid fa-bars"></i>
        </button>
    </div>

    <!-- Scrollable Navigation Area -->
    <nav class="sidebar-nav">
        <a href="/admin/dashboard" class="nav-link" id="nav-dashboard">
            <i class="fa-solid fa-chart-line"></i> <span>Dashboard</span>
        </a>

        <div class="menu-group">
            <div class="menu-title" onclick="toggleSidebarMenu('productMenu', this)">
                <div style="display:flex; align-items:center;">
                    <i class="fa-solid fa-box main-icon"></i> <span>Quản Lý Sản Phẩm</span>
                </div>
                <i class="fa-solid fa-chevron-down chevron"></i>
            </div>
            <div class="sub-menu" id="productMenu">
                <a href="/admin/products" id="nav-products">Sản phẩm</a>
                <a href="/admin/categories" id="nav-categories">Danh mục</a>
                <a href="/admin/combos" id="nav-combos">Quản lý Combo</a>
                <a href="/admin/flash-sales" id="nav-flash-sales">Flash Sale</a>
            </div>
        </div>

        <div class="menu-group">
            <div class="menu-title" onclick="toggleSidebarMenu('inventoryMenu', this)">
                <div style="display:flex; align-items:center;">
                    <i class="fa-solid fa-warehouse main-icon"></i> <span>Quản Lý Kho</span>
                </div>
                <i class="fa-solid fa-chevron-down chevron"></i>
            </div>
            <div class="sub-menu" id="inventoryMenu">
                <a href="/admin/inventory" id="nav-inventory">Kho hàng</a>
                <a href="/admin/orders" id="nav-orders">Đơn hàng</a>
            </div>
        </div>

        <div class="menu-group">
            <div class="menu-title" onclick="toggleSidebarMenu('userMenu', this)">
                <div style="display:flex; align-items:center;">
                    <i class="fa-solid fa-users main-icon"></i> <span>Người Dùng & Hỗ Trợ</span>
                </div>
                <i class="fa-solid fa-chevron-down chevron"></i>
            </div>
            <div class="sub-menu" id="userMenu">
                <a href="/admin/employees" id="nav-employees"
                    sec:authorize="hasRole('ADMIN')">Quản lý Nhân viên</a>
                <a href="/admin/account" id="nav-account"
                    sec:authorize="hasRole('ADMIN')">Quản lý Khách hàng</a>
                <a href="/admin/vouchers" id="nav-vouchers">Voucher</a>
                <a href="/admin/tickets" id="nav-tickets">Hỗ Trợ (Tickets)</a>
            </div>
        </div>

        <div class="menu-group">
            <div class="menu-title" onclick="toggleSidebarMenu('contentMenu', this)">
                <div style="display:flex; align-items:center;">
                    <i class="fa-solid fa-newspaper main-icon"></i> <span>Nội Dung</span>
                </div>
                <i class="fa-solid fa-chevron-down chevron"></i>
            </div>
            <div class="sub-menu" id="contentMenu">
                <a href="/admin/news" id="nav-news">Tin tức</a>
                <a href="/admin/news-categories" id="nav-news-categories">Danh mục tin tức</a>
            </div>
        </div>
    </nav>

    <!-- Sidebar Pinned Footer: Logout Button -->
    <div class="sidebar-footer">
        <form method="post" th:action="@{/logout}">
            <button type="submit" class="nav-link logout-btn" title="Đăng Xuất">
                <i class="fa-solid fa-arrow-right-from-bracket"></i> <span>Đăng Xuất</span>
            </button>
        </form>
    </div>

    <script th:src="@{/js/admin/layout/sidebar.js(v=5.0)}"></script>

    <!-- Custom Confirm Popup (Global) -->
    <script th:src="@{/js/confirm-popup.js}"></script>

    <!-- SweetAlert2 for Delete Confirmation Popups -->
    <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>

    <!-- Flatpickr for Date Time Inputs -->
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/flatpickr.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/flatpickr/dist/plugins/confirmDate/confirmDate.css">
    <script src="https://cdn.jsdelivr.net/npm/flatpickr"></script>
    <script src="https://cdn.jsdelivr.net/npm/flatpickr/dist/plugins/confirmDate/confirmDate.js"></script>

    <script th:src="@{/js/cursor.js}"></script>
    <style>
        body {
            display: block !important;
            height: auto !important;
            overflow: auto !important;
        }

        .main-content {
            overflow-y: visible !important;
            height: auto !important;
        }

        .add-form-container:not(.active) {
            display: none !important;
        }
    </style>
</div>
