<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<body>
    <!-- 
      Fragment phân trang dùng chung cho Admin.
      Cách gọi: <div th:replace="~{admin/layout/pagination :: pagination(pageObj=${yourPageObject})}"></div>
    -->
    <div th:fragment="pagination(pageObj)" class="pagination-container" th:if="${pageObj.totalPages > 1}" 
         style="display: flex; justify-content: center; align-items: center; padding: 24px 0; gap: 12px; user-select: none;">
        
        <!-- Nút Trở Lại (Previous) -->
        <button type="button" 
                th:disabled="${pageObj.first}" 
                th:classappend="${pageObj.first ? 'disabled' : ''}"
                th:attr="onclick=${!pageObj.first ? 'goToPage(' + (pageObj.number) + ', ' + pageObj.totalPages + ')' : ''}"
                style="width: 36px; height: 36px; padding: 0; border: 1px solid var(--admin-border); border-radius: 8px; background: var(--admin-card-bg); color: var(--admin-text-main); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.05);"
                onmouseover="if(!this.classList.contains('disabled')){this.style.background='var(--admin-primary)'; this.style.color='#fff'; this.style.borderColor='var(--admin-primary)';}"
                onmouseout="if(!this.classList.contains('disabled')){this.style.background='var(--admin-card-bg)'; this.style.color='var(--admin-text-main)'; this.style.borderColor='var(--admin-border)';}">
            <i class="fa-solid fa-angle-left"></i>
        </button>
        
        <!-- Ô Nhập Trang -->
        <div style="display: flex; align-items: center; gap: 8px; background: var(--admin-card-bg); border: 1px solid var(--admin-border); padding: 4px 16px; border-radius: 8px; box-shadow: 0 1px 2px rgba(0,0,0,0.05);">
            <span style="font-size: 13px; font-weight: 500; color: var(--admin-text-muted);">Trang</span>
            <input type="number" min="1" th:max="${pageObj.totalPages}" th:value="${pageObj.number + 1}" 
                   style="width: 45px; text-align: center; border: none; border-bottom: 2px solid var(--admin-primary); background: transparent; color: var(--admin-text-main); font-family: inherit; font-size: 15px; font-weight: 600; outline: none; padding: 2px 0;"
                   th:onkeydown="'if(event.key === \'Enter\') { goToPage(this.value, ' + ${pageObj.totalPages} + '); }'" 
                   th:onchange="'goToPage(this.value, ' + ${pageObj.totalPages} + ')'" />
            <span style="font-size: 13px; font-weight: 500; color: var(--admin-text-muted);">/ [[${pageObj.totalPages}]]</span>
        </div>

        <!-- Nút Tiếp Theo (Next) -->
        <button type="button" 
                th:disabled="${pageObj.last}" 
                th:classappend="${pageObj.last ? 'disabled' : ''}"
                th:attr="onclick=${!pageObj.last ? 'goToPage(' + (pageObj.number + 2) + ', ' + pageObj.totalPages + ')' : ''}"
                style="width: 36px; height: 36px; padding: 0; border: 1px solid var(--admin-border); border-radius: 8px; background: var(--admin-card-bg); color: var(--admin-text-main); cursor: pointer; display: flex; align-items: center; justify-content: center; transition: all 0.2s; box-shadow: 0 1px 2px rgba(0,0,0,0.05);"
                onmouseover="if(!this.classList.contains('disabled')){this.style.background='var(--admin-primary)'; this.style.color='#fff'; this.style.borderColor='var(--admin-primary)';}"
                onmouseout="if(!this.classList.contains('disabled')){this.style.background='var(--admin-card-bg)'; this.style.color='var(--admin-text-main)'; this.style.borderColor='var(--admin-border)';}">
            <i class="fa-solid fa-angle-right"></i>
        </button>

        <style>
            .pagination-container button.disabled {
                opacity: 0.4;
                cursor: not-allowed !important;
                background: #f1f5f9 !important;
                color: #94a3b8 !important;
                box-shadow: none !important;
            }
            .pagination-container input[type=number]::-webkit-inner-spin-button, 
            .pagination-container input[type=number]::-webkit-outer-spin-button { 
                -webkit-appearance: none; 
                margin: 0; 
            }
            .pagination-container input[type=number] {
                -moz-appearance: textfield;
            }
            .pagination-container input[type=number]:focus {
                border-bottom-color: #005bb5 !important;
            }
        </style>
        
        <script>
            // Hàm chuyển trang bảo toàn các tham số tìm kiếm, lọc, sắp xếp hiện tại
            if (typeof window.goToPage !== 'function') {
                window.goToPage = function(pageVal, totalPages) {
                    let p = parseInt(pageVal);
                    if (!isNaN(p) && p >= 1 && p <= totalPages) {
                        let url = new URL(window.location.href);
                        url.searchParams.set('page', p - 1);
                        window.location.href = url.toString();
                    }
                };
            }
        </script>
    </div>
</body>
</html>
