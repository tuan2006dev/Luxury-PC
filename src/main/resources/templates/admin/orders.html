<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Đơn Hàng — Luxury PC</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/orders.css}" />
</head>
<body>
    <div th:replace="~{admin/layout/sidebar :: sidebar}"></div>

<div class="main-content">
        <div class="table-card">
            <div class="table-h">
                <h2 data-translate="admin-orders-title">Quản Lý Đơn Hàng</h2>
                <span><span th:text="${orders.size()}">0</span> <span data-translate="admin-orders-text-orders">đơn hàng</span></span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th data-translate="admin-orders-th-code">Mã Đơn</th>
                        <th data-translate="admin-orders-th-customer">Khách Hàng</th>
                        <th data-translate="admin-orders-th-date">Ngày Đặt</th>
                        <th data-translate="admin-orders-th-total">Tổng Tiền</th>
                        <th data-translate="admin-orders-th-payment">Thanh Toán</th>
                        <th data-translate="admin-orders-th-voucher">Voucher</th>
                        <th data-translate="admin-orders-th-status">Trạng Thái</th>
                        <th data-translate="admin-orders-th-note">Ghi Chú</th>
                        <th data-translate="admin-orders-th-actions">Hành Động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="o : ${orders}">
                        <td th:text="${o.orderCode != null ? o.orderCode : 'DH' + o.id}">DH101</td>
                        <td>
                            <div th:text="${o.fullName}">Guest</div>
                            <div style="font-size:0.75rem; color:var(--muted)" th:text="${o.email}">guest@mail.com</div>
                        </td>
                        <td th:text="${#dates.format(o.createdAt, 'dd/MM/yyyy HH:mm')}">27/03/2026</td>
                        <td th:text="${#numbers.formatDecimal(o.totalPrice, 0, 'COMMA', 0, 'POINT')} + '₫'" style="color:var(--gold)">45.000.000₫</td>
                        <td th:text="${o.paymentMethodDisplay}">VietQR</td>
                        <td>
                            <div th:text="${o.voucherCode != null ? o.voucherCode : '-'}">QA500K</div>
                            <div th:if="${o.discountAmount != null and o.discountAmount > 0}"
                                 style="font-size:0.75rem; color:var(--gold)"
                                 th:text="'-' + ${#numbers.formatDecimal(o.discountAmount, 0, 'COMMA', 0, 'POINT')} + '₫'">-500.000₫</div>
                        </td>
                        <td>
                            <span th:class="'badge badge-' + ${o.status.toLowerCase()}"
                                  th:data-translate="'admin-orders-status-' + ${o.status.toLowerCase()}"
                                  th:text="${o.statusDisplay}">Chờ xử lý</span>
                        </td>
                        <td class="admin-note">
                            <div th:if="${o.refundReason != null}" style="margin-bottom:.6rem;">
                                <span class="note-label" data-translate="admin-orders-note-customer">Lý do khách</span>
                                <span th:text="${o.refundReason}">Lý do hoàn trả</span>
                            </div>
                            <div th:if="${o.adminNote != null}">
                                <span class="note-label" data-translate="admin-orders-note-admin">Ghi chú admin</span>
                                <span th:text="${o.adminNote}">Ghi chú</span>
                            </div>
                            <span th:if="${o.refundReason == null and o.adminNote == null}">-</span>
                        </td>
                        <td>
                            <details class="action-menu">
                                <summary data-translate="admin-orders-summary-actions">Thao tác</summary>
                                <div class="action-panel">
                                    <span th:if="${o.status == 'DA_HOAN_TIEN' or o.status == 'THU_HOI'}" class="admin-note" data-translate="admin-orders-closed">Đơn đã kết thúc xử lý.</span>
                                    <form th:if="${o.paymentMethod == 'VIETQR' and o.status == 'CHO_XAC_NHAN_THANH_TOAN'}" action="/admin/orders/confirm-payment" method="post" class="action-form">

                                        <input type="hidden" name="orderId" th:value="${o.id}">
                                        <button type="submit" class="update-btn" data-translate="admin-orders-btn-confirm-payment">Xác Nhận Thanh Toán</button>
                                    </form>
                                    <form th:if="${o.status == 'YEU_CAU_HOAN_TIEN'}" action="/admin/orders/approve-refund" method="post" class="action-form">

                                        <input type="hidden" name="orderId" th:value="${o.id}">
                                        <input type="text" name="note" placeholder="Ghi chú duyệt yêu cầu" data-translate-placeholder="admin-orders-placeholder-approve-refund-note">
                                        <button type="submit" class="update-btn" data-translate="admin-orders-btn-approve-refund">Duyệt Yêu Cầu Hoàn Tiền</button>
                                    </form>
                                    <form th:if="${o.status == 'YEU_CAU_HOAN_TIEN'}" action="/admin/orders/reject-refund" method="post" class="action-form">

                                        <input type="hidden" name="orderId" th:value="${o.id}">
                                        <input type="text" name="note" required placeholder="Lý do từ chối" data-translate-placeholder="admin-orders-placeholder-reject-refund-reason">
                                        <button type="submit" class="update-btn" data-translate="admin-orders-btn-reject-refund">Từ Chối Yêu Cầu</button>
                                    </form>
                                    <form th:if="${o.paymentMethod == 'VIETQR' and (o.status == 'DA_THANH_TOAN' or o.status == 'PAID')}" action="/admin/orders/request-refund" method="post" class="action-form">

                                        <input type="hidden" name="orderId" th:value="${o.id}">
                                        <input type="text" name="note" placeholder="Lý do admin tạo hoàn tiền" data-translate-placeholder="admin-orders-placeholder-create-refund-reason">
                                        <button type="submit" class="update-btn" data-translate="admin-orders-btn-create-refund">Tạo Yêu Cầu Hoàn Tiền</button>
                                    </form>
                                    <form th:if="${o.status == 'CHO_HOAN_TIEN'}" action="/admin/orders/confirm-refund" method="post" class="action-form">

                                        <input type="hidden" name="orderId" th:value="${o.id}">
                                        <input type="text" name="note" placeholder="Ghi chú xác nhận hoàn tiền" data-translate-placeholder="admin-orders-placeholder-confirm-refund-note">
                                        <button type="submit" class="update-btn" data-translate="admin-orders-btn-confirm-refunded">Xác Nhận Đã Hoàn Tiền</button>
                                    </form>
                                    <form th:if="${o.status == 'DA_THANH_TOAN' or o.status == 'PAID' or o.status == 'SHIPPING' or o.status == 'COMPLETED' or o.status == 'HOAN_THANH' or o.status == 'YEU_CAU_HOAN_TIEN' or o.status == 'CHO_HOAN_TIEN'}" action="/admin/orders/recall" method="post" class="action-form">

                                        <input type="hidden" name="orderId" th:value="${o.id}">
                                        <input type="text" name="note" placeholder="Lý do thu hồi" data-translate-placeholder="admin-orders-placeholder-recall-reason">
                                        <button type="submit" class="update-btn" data-translate="admin-orders-btn-recall">Thu Hồi Đơn</button>
                                    </form>
                                    <form th:unless="${o.status == 'CHO_XAC_NHAN_THANH_TOAN' or o.status == 'YEU_CAU_HOAN_TIEN' or o.status == 'CHO_HOAN_TIEN' or o.status == 'DA_HOAN_TIEN' or o.status == 'THU_HOI'}" action="/admin/orders/update-status" method="post" class="action-form">

                                        <input type="hidden" name="orderId" th:value="${o.id}">
                                        <select name="status">
                                            <option value="PENDING" th:selected="${o.status == 'PENDING'}" data-translate="admin-orders-status-pending">Chờ xử lý</option>
                                            <option value="PAID" th:selected="${o.status == 'PAID'}" data-translate="admin-orders-status-paid">Đã thanh toán</option>
                                            <option value="SHIPPING" th:selected="${o.status == 'SHIPPING'}" data-translate="admin-orders-status-shipping">Đang giao</option>
                                            <option value="COMPLETED" th:selected="${o.status == 'COMPLETED'}" data-translate="admin-orders-status-completed">Hoàn thành</option>
                                            <option value="DA_HUY" th:selected="${o.status == 'DA_HUY'}" data-translate="admin-orders-status-da_huy">Đã hủy</option>
                                        </select>
                                        <button type="submit" class="update-btn" data-translate="admin-orders-btn-update-status">Cập Nhật Trạng Thái</button>
                                    </form>
                                </div>
                            </details>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
