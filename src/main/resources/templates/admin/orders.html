<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Đơn Hàng — Luxury PC</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        :root {
            --black: #0a0a0a;
            --deep: #111;
            --dark: #1a1a1a;
            --gold: #c9a84c;
            --gold-l: #e8c97a;
            --cream: #f5f0e8;
            --white: #fff;
            --muted: #888;
            --red: #ef4444;
            --green: #22c55e;
            --blue: #3b82f6;
            --sans: 'Montserrat', sans-serif;
        }
        * { margin:0; padding:0; box-sizing:border-box; }
        body { background: var(--black); color: var(--cream); font-family: var(--sans); display: flex; }
        .sidebar { width: 280px; background: var(--deep); border-right: 1px solid rgba(201,168,76,0.1); padding: 2rem; position: fixed; height: 100vh; }
        .logo { font-size: 1.5rem; color: var(--gold); letter-spacing: 0.2em; margin-bottom: 3rem; display: block; text-decoration: none; }
        .nav-link { display: block; color: var(--muted); padding: 1rem; text-decoration: none; border-radius: 4px; margin-bottom: 0.5rem; font-size: 0.9rem; }
        .nav-link:hover, .nav-link.active { background: rgba(201,168,76,0.05); color: var(--gold); }
        .main-content { margin-left: 280px; flex: 1; padding: 3rem; }
        .table-card { background: var(--dark); padding: 2rem; border: 1px solid rgba(201,168,76,0.1); border-radius: 8px; }
        .table-h { display: flex; justify-content: space-between; align-items: center; margin-bottom: 2rem; }
        table { width: 100%; border-collapse: collapse; }
        th { text-align: left; color: var(--muted); font-size: 0.75rem; text-transform: uppercase; padding: 1.2rem; background: rgba(0,0,0,0.2); }
        td { padding: 1.2rem; font-size: 0.85rem; border-bottom: 1px solid rgba(255,255,255,0.05); }
        .badge { padding: 0.3rem 0.6rem; border-radius: 4px; font-size: 0.7rem; font-weight: 600; }
        .badge-pending { background: rgba(201,168,76,0.1); color: var(--gold); }
        .badge-completed { background: rgba(34,197,94,0.1); color: var(--green); }
        .badge-shipping { background: rgba(59,130,246,0.1); color: var(--blue); }
        .badge-cancelled { background: rgba(239, 68, 68, 0.1); color: var(--red); }
        select { background: var(--mid); color: var(--white); border: 1px solid rgba(201,168,76,0.2); padding: 0.4rem; border-radius: 4px; outline: none; }
        button.update-btn { background: var(--gold); color: var(--black); border: none; padding: 0.4rem 0.8rem; border-radius: 4px; cursor: pointer; font-size: 0.75rem; font-weight: 600; margin-left: 0.5rem; }
    </style>
</head>
<body>
    <div class="sidebar">
        <a href="/" class="logo">LUXURY</a>
        <nav>
            <a href="/admin/dashboard" class="nav-link">Dashboard</a>
            <a href="/admin/orders" class="nav-link active">Đơn Hàng</a>
            <a href="/admin/inventory" class="nav-link">Kho Hàng</a>
            <a href="/admin/products" class="nav-link">Sản Phẩm</a>
        </nav>
    </div>
    <div class="main-content">
        <div class="table-card">
            <div class="table-h">
                <h2>Quản Lý Đơn Hàng</h2>
                <span th:text="${orders.size()} + ' đơn hàng'">0 đơn hàng</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Khách Hàng</th>
                        <th>Ngày Đặt</th>
                        <th>Tổng Tiền</th>
                        <th>Trạng Thái</th>
                        <th>Hành Động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="o : ${orders}">
                        <td th:text="'#' + ${o.id}">#101</td>
                        <td>
                            <div th:text="${o.fullName}">Guest</div>
                            <div style="font-size:0.75rem; color:var(--muted)" th:text="${o.email}">guest@mail.com</div>
                        </td>
                        <td th:text="${#dates.format(o.createdAt, 'dd/MM/yyyy HH:mm')}">27/03/2026</td>
                        <td th:text="${#numbers.formatDecimal(o.totalPrice, 0, 'COMMA', 0, 'POINT')} + '₫'" style="color:var(--gold)">45.000.000₫</td>
                        <td>
                            <span th:class="'badge badge-' + ${o.status.toLowerCase()}" th:text="${o.status}">PENDING</span>
                        </td>
                        <td>
                            <form action="/admin/orders/update-status" method="post" style="display:flex; align-items:center;">
                                <input type="hidden" name="orderId" th:value="${o.id}">
                                <select name="status">
                                    <option value="PENDING" th:selected="${o.status == 'PENDING'}">Chờ xử lý</option>
                                    <option value="PAID" th:selected="${o.status == 'PAID'}">Đã thanh toán</option>
                                    <option value="SHIPPING" th:selected="${o.status == 'SHIPPING'}">Đang giao</option>
                                    <option value="COMPLETED" th:selected="${o.status == 'COMPLETED'}">Hoàn thành</option>
                                    <option value="CANCELLED" th:selected="${o.status == 'CANCELLED'}">Đã hủy</option>
                                </select>
                                <button type="submit" class="update-btn">Cập Nhật</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
