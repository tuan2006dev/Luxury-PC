<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" th:href="@{/logo.png}" />
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Luxury PC | Sản Phẩm</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet" />
    <link rel="stylesheet" th:href="@{/css/style.css}" />
    <link rel="stylesheet" th:href="@{/css/products.css}" />
</head>
<body>
    <div class="cursor" id="cursor"></div>
    <div class="cursor-follower" id="cursor-follower"></div>

    <!-- NAVIGATION -->
    <nav class="navbar scrolled" id="navbar">
        <div class="nav-left">
            <a th:href="@{/}" class="nav-link" data-translate="product-breadcrumb-home">Trang Chủ</a>
            <a href="/build-pc/index.html" class="nav-link" data-translate="nav-build">Build PC</a>
        </div>
        <div class="nav-logo">
            <a th:href="@{/}" style="text-decoration:none; color:inherit; display:flex; align-items:center; gap: 10px;">
                <span class="logo-Luxury" style="font-family:'Inter', sans-serif; font-size:2rem; font-weight:400; letter-spacing:0.35em; color:var(--gold);">LUXURY</span>
                <div class="logo-divider" style="width:1px; height:28px; background:var(--gold); opacity:0.6;"></div>
                <span class="logo-pc" style="font-family:'Inter', sans-serif; font-size:0.7rem; font-weight:500; letter-spacing:0.5em; color:#888; text-transform:uppercase;">PC</span>
            </a>
        </div>
        <div class="nav-right">
            <a th:href="@{/auth/login}" class="nav-link" data-translate="nav-login">Đăng Nhập</a>
            <button class="nav-search-btn" id="nav-search-btn">⌕</button>
            <button class="nav-cart" id="nav-cart">
                <span class="cart-icon">⊡</span>
                <span class="cart-count">0</span>
            </button>
        </div>
    </nav>

    <!-- SEARCH OVERLAY -->
    <div class="search-overlay" id="search-overlay">
        <div class="search-overlay-inner">
            <div class="search-close-row">
                <span class="search-brand">LUXURY · PC</span>
                <button class="search-close" id="search-close">✕</button>
            </div>
            <div class="search-input-wrap">
                <span class="search-icon-big">⌕</span>
                <input type="text" id="search-input" class="search-input" data-translate-placeholder="products-filter-search-placeholder" placeholder="Tìm kiếm linh kiện..." autocomplete="off" />
                <button class="search-clear" id="search-clear">✕</button>
            </div>
            <div class="search-results" id="search-results">
                <p class="search-hint" data-translate="search-hint">Nhập từ khóa để tìm kiếm.</p>
            </div>
        </div>
    </div>

    <!-- PRODUCTS -->
    <section class="products" id="products">
        <div class="section-header">
            <span class="section-label" data-translate="cat-section-label">Danh Mục</span>
            <h2 class="section-title" data-translate="products-header-title">Tất Cả Linh Kiện</h2>
        </div>

        <div class="products-grid" id="products-grid">
            <article class="product-card" th:each="product : ${allProducts}">
                <div class="product-img-wrap" style="padding:2rem; text-align:center;">
                    <img th:src="@{${product.image != null ? product.image : '/images/default.png'}}" alt="Product" style="max-height:180px; object-fit:contain;" />
                </div>
                <div class="product-info">
                    <span class="product-cat" th:text="${product.category != null ? product.category.name : 'Khác'}">Danh mục</span>
                    <h3 class="product-name" th:text="${product.name}">Tên sản phẩm</h3>
                    <p class="product-spec" th:text="${product.description != null ? product.description : 'Sản phẩm cao cấp'}">Description</p>
                    <div class="product-price-row">
                        <span class="product-price" th:text="${#numbers.formatDecimal(product.price, 0, 'COMMA', 0, 'POINT')} + '₫'">Giá</span>
                        <button class="btn-add-cart"><span data-translate="btn-add-cart-text">Thêm Vào Giỏ</span></button>
                    </div>
                </div>
            </article>
        </div>
    </section>

    <!-- FOOTER -->
    <div th:replace="~{layout/footer :: footer}"></div>
    <script th:src="@{/js/script.js}"></script>
</body>
</html>
