<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <link rel="icon" type="image/png" th:href="@{/logo.png}" />
    <meta charset="UTF-8" />
</head>

<body>
    <div th:fragment="header">
        <script th:src="@{/js/theme.js}"></script>

        <header class="header" id="navbar">
            <div class="container header-top">
                <div class="menu-overlay" id="mobile-menu-overlay"></div>
                <button class="hamburger-btn" id="mobile-menu-btn" style="display: none;"><i class="fa-solid fa-bars"></i></button>
                
                <!-- Left Nav -->
                <nav class="main-nav" id="mobile-nav" style="flex: 1; justify-content: flex-start;">
                    <button class="menu-close-btn" style="display: none;" id="mobile-menu-close"><i class="fa-solid fa-xmark"></i></button>
                    <a th:href="@{/products}" id="nav-linh-kien">Sản Phẩm</a>
                    <a th:href="@{/build-pc-basic}" id="nav-build-pc">Build PC</a>
                    <a th:href="@{/promotions}" id="nav-khuyen-mai">Khuyến Mãi</a>
                </nav>
                
                <!-- Logo -->
                <a th:href="@{/}" class="logo" style="flex: 0 0 auto; text-align: center;">LUXURY | <strong>PC</strong></a>
                
                <!-- Right Nav -->
                <nav class="main-nav" style="flex: 1; justify-content: flex-end;">
                    <a href="/products" id="nav-tin-tuc">Tin Tức</a>
                    <a th:href="@{/support}" id="nav-lien-he">Hỗ Trợ</a>
                    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Admin</a>
                    <a sec:authorize="isAnonymous()" th:href="@{/auth/login}">Đăng Nhập</a>
                    <a sec:authorize="isAuthenticated()" th:href="@{/profile}" class="nav-user-profile" style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none;">
                        <img th:if="${currentUser != null && currentUser.avatar != null && !currentUser.avatar.isEmpty()}" th:src="${currentUser.avatar}" alt="Avatar" style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover;">
                        <div th:unless="${currentUser != null && currentUser.avatar != null && !currentUser.avatar.isEmpty()}" style="width: 28px; height: 28px; border-radius: 50%; background: #c9a84c; color: #000; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px;" th:text="${(currentUser != null && currentUser.fullName != null && !currentUser.fullName.isEmpty()) ? currentUser.fullName.substring(0,1).toUpperCase() : #authentication.name.substring(0,1).toUpperCase()}">U</div>
                        <span th:text="${(currentUser != null && currentUser.fullName != null && !currentUser.fullName.isEmpty()) ? currentUser.fullName : #authentication.name}">Hồ Sơ</span>
                    </a>
                    
                    <button class="nav-search-btn" id="nav-search-btn" aria-label="Tìm kiếm" style="background:none; border:none; cursor:pointer; font-size:18px; color:var(--text-primary);">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>
                    
                    <a th:href="@{/cart}" class="nav-cart" id="nav-cart" aria-label="Giỏ hàng" style="background:none; border:none; cursor:pointer; font-size:18px; color:var(--text-primary); text-decoration:none;">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <span class="cart-count" id="cart-count" th:text="${cartCount}">0</span>
                    </a>
                </nav>
            </div>
        </header>

        <!-- SEARCH OVERLAY -->
        <div class="search-overlay" id="search-overlay">
            <div class="search-overlay-inner">
                <div class="search-close-row">
                    <span class="search-brand">LUXURY | PC</span>
                    <button class="search-close" id="search-close" aria-label="Đóng tìm kiếm"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="search-input-wrap">
                    <i class="fa-solid fa-magnifying-glass search-icon-big"></i>
                    <input type="text" id="search-input" class="search-input"
                        placeholder="Tìm kiếm linh kiện, thương hiệu..." autocomplete="off"
                        aria-label="Tìm kiếm sản phẩm" />
                    <button class="search-clear" id="search-clear" aria-label="Xóa"><i class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="search-tags">
                    <span class="search-tag-label">Tìm nhanh:</span>
                    <button class="search-tag" data-query="CPU Intel">CPU Intel</button>
                    <button class="search-tag" data-query="RTX 4090">RTX 4090</button>
                    <button class="search-tag" data-query="DDR5">DDR5 RAM</button>
                    <button class="search-tag" data-query="SSD NVMe">SSD NVMe</button>
                    <button class="search-tag" data-query="Màn Hình">Màn Hình</button>
                </div>
                <div class="search-results" id="search-results">
                    <p class="search-hint">Nhập từ khóa để tìm kiếm sản phẩm tại Luxury PC.</p>
                </div>
            </div>
        </div>
    </div>
</body>
</html>
