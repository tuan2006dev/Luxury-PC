<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
    <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}" />
    <meta charset="UTF-8" />
</head>

<body>
    <div th:fragment="header">
        <link rel="icon" type="image/svg+xml" th:href="@{/images/logo.svg}" />
        <link rel="stylesheet" th:href="@{/css/style.css}">
        <link rel="stylesheet" th:href="@{/css/modal-system.css}">
        <script th:src="@{/js/theme.js}"></script>

        <header class="header" id="navbar">
            <div class="container header-top">
                <div class="menu-overlay" id="mobile-menu-overlay"></div>
                <button class="hamburger-btn" id="mobile-menu-btn" style="display: none;"><i
                        class="fa-solid fa-bars"></i></button>

                <!-- Left Nav -->
                <nav class="main-nav" id="mobile-nav" style="flex: 1; justify-content: flex-start;">
                    <button class="menu-close-btn" style="display: none;" id="mobile-menu-close"><i
                            class="fa-solid fa-xmark"></i></button>
                    <a th:href="@{/products}" id="nav-linh-kien">Sản Phẩm</a>
                    <a th:href="@{/build-pc}" id="nav-build-pc">Build PC</a>
                    <a th:href="@{/promotions}" id="nav-khuyen-mai">Khuyến Mãi</a>
                </nav>

                <!-- Logo -->
                <a th:href="@{/}" class="logo"
                    style="flex: 0 0 auto; text-align: center; margin: 0 15px; display: inline-flex; align-items: center; gap: 10px; text-decoration: none;">
                    <img th:src="@{/images/logo.svg}" alt="Luxury PC Logo"
                        style="height: 46px; width: auto; display: block;" />
                    <span
                        style="font-size: 20px; font-weight: 400; letter-spacing: 1px; color: var(--text-primary);">LUXURY
                        | <strong style="font-weight: 800; color: var(--accent-blue);">PC</strong></span>
                </a>

                <!-- Right Nav -->
                <nav class="main-nav" style="flex: 1; justify-content: flex-end;">
                    <a th:href="@{/news}" id="nav-tin-tuc">Tin Tức</a>
                    <a th:href="@{/support}" id="nav-lien-he">Hỗ Trợ</a>
                    <a sec:authorize="hasRole('ADMIN')" th:href="@{/admin}">Admin</a>
                    <a sec:authorize="hasRole('STAFF')" th:href="@{/admin}">Staff</a>
                    <a sec:authorize="isAnonymous()" th:href="@{/auth/login}">Đăng Nhập</a>
                    <a sec:authorize="isAuthenticated()" th:href="@{/profile}" class="nav-user-profile"
                        style="display: inline-flex; align-items: center; gap: 8px; text-decoration: none;">
                        <img th:if="${currentUser != null && currentUser.avatar != null && !currentUser.avatar.isEmpty()}"
                            th:src="${currentUser.avatar}" alt="Avatar"
                            style="width: 28px; height: 28px; border-radius: 50%; object-fit: cover;">
                        <div th:unless="${currentUser != null && currentUser.avatar != null && !currentUser.avatar.isEmpty()}"
                            style="width: 28px; height: 28px; border-radius: 50%; background: #c9a84c; color: #000; display: flex; align-items: center; justify-content: center; font-weight: bold; font-size: 14px;"
                            th:text="${(currentUser != null && currentUser.fullName != null && !currentUser.fullName.isEmpty()) ? currentUser.fullName.substring(0,1).toUpperCase() : #authentication.name.substring(0,1).toUpperCase()}">
                            U</div>
                        <span
                            style="max-width: 120px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; display: inline-block; vertical-align: middle;"
                            th:text="${(currentUser != null && currentUser.fullName != null && !currentUser.fullName.isEmpty()) ? currentUser.fullName : #authentication.name}">Hồ
                            Sơ</span>
                    </a>

                    <button class="nav-search-btn" id="nav-search-btn" aria-label="Tìm kiếm"
                        style="background:none; border:none; cursor:pointer; font-size:18px; color:var(--text-primary);">
                        <i class="fa-solid fa-magnifying-glass"></i>
                    </button>

                    <a th:href="@{/cart}" class="nav-cart" id="nav-cart" aria-label="Giỏ hàng"
                        style="background:none; border:none; cursor:pointer; font-size:18px; color:var(--text-primary); text-decoration:none;">
                        <i class="fa-solid fa-cart-shopping"></i>
                        <span class="cart-count" id="cart-count" th:text="${cartCount}">0</span>
                    </a>
                </nav>
            </div>
        </header>

        <!-- SEARCH OVERLAY -->
        <div class="search-overlay" id="search-overlay">
            <div class="search-overlay-inner">
                <div class="search-close-row">
                    <span class="search-brand">LUXURY | PC</span>
                    <button class="search-close" id="search-close" aria-label="Đóng tìm kiếm"><i
                            class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="search-input-wrap">
                    <i class="fa-solid fa-magnifying-glass search-icon-big"></i>
                    <input type="text" id="search-input" class="search-input"
                        placeholder="Tìm kiếm linh kiện, thương hiệu..." autocomplete="off"
                        aria-label="Tìm kiếm sản phẩm" />
                    <button class="search-clear" id="search-clear" aria-label="Xóa"><i
                            class="fa-solid fa-xmark"></i></button>
                </div>
                <div class="search-tags">
                    <span class="search-tag-label">Tìm nhanh:</span>
                    <button class="search-tag" data-query="CPU Intel">CPU Intel</button>
                    <button class="search-tag" data-query="RTX 4090">RTX 4090</button>
                    <button class="search-tag" data-query="DDR5">DDR5 RAM</button>
                    <button class="search-tag" data-query="SSD NVMe">SSD NVMe</button>
                    <button class="search-tag" data-query="Màn Hình">Màn Hình</button>
                </div>
                <div class="search-results" id="search-results">
                    <p class="search-hint">Nhập từ khóa để tìm kiếm sản phẩm tại Luxury PC.</p>
                </div>
            </div>
            <!-- SEARCH JS LOGIC -->
            <script>
                document.addEventListener('DOMContentLoaded', () => {
                    const searchBtn = document.getElementById('nav-search-btn');
                    const searchOverlay = document.getElementById('search-overlay');
                    const searchClose = document.getElementById('search-close');
                    const searchInput = document.getElementById('search-input');
                    const searchClear = document.getElementById('search-clear');
                    const searchTags = document.querySelectorAll('.search-tag');

                    if (searchBtn && searchOverlay) {
                        searchBtn.addEventListener('click', (e) => {
                            e.preventDefault();
                            searchOverlay.classList.add('active');
                            setTimeout(() => searchInput.focus(), 100);
                        });
                    }

                    if (searchClose && searchOverlay) {
                        searchClose.addEventListener('click', () => {
                            searchOverlay.classList.remove('active');
                        });
                    }

                    if (searchClear && searchInput) {
                        searchClear.addEventListener('click', () => {
                            searchInput.value = '';
                            searchInput.focus();
                        });
                    }

                    const performSearch = (query) => {
                        if (query && query.trim() !== '') {
                            window.location.href = '/products?kw=' + encodeURIComponent(query.trim());
                        }
                    };

                    const searchResultsContainer = document.getElementById('search-results');
                    let debounceTimer;

                    if (searchInput) {
                        searchInput.addEventListener('input', (e) => {
                            const val = e.target.value.trim();
                            clearTimeout(debounceTimer);

                            if (!val) {
                                searchResultsContainer.innerHTML = '<p class="search-hint">Nhập từ khóa để tìm kiếm sản phẩm tại Luxury PC.</p>';
                                return;
                            }

                            searchResultsContainer.innerHTML = '<div style="padding: 15px; text-align: center; color: #666;"><i class="fa-solid fa-spinner fa-spin"></i> Đang tìm kiếm...</div>';

                            debounceTimer = setTimeout(() => {
                                fetch('/api/products/search?q=' + encodeURIComponent(val))
                                    .then(res => res.json())
                                    .then(data => {
                                        if (data && data.length > 0) {
                                            let html = '<div class="search-suggestions" style="display:flex; flex-direction:column; gap:0;">';
                                            data.forEach(item => {
                                                html += `
                                                <a href="${item.productUrl}" style="display:flex; align-items:center; gap:12px; padding:12px; border-bottom:1px solid #eee; text-decoration:none; transition:0.2s;" onmouseover="this.style.backgroundColor='#f9f9f9'" onmouseout="this.style.backgroundColor='transparent'">
                                                    <img src="${item.image}" alt="${item.name}" style="width:50px; height:50px; object-fit:contain; border-radius:4px;">
                                                    <div style="flex:1;">
                                                        <div style="font-size:14px; font-weight:600; color:#000; margin-bottom:4px; display:-webkit-box; -webkit-line-clamp:2; -webkit-box-orient:vertical; overflow:hidden;">${item.name}</div>
                                                        <div style="font-size:14px; font-weight:700; color:#e53935;">${item.price}</div>
                                                    </div>
                                                </a>
                                            `;
                                            });
                                            html += `
                                            <a href="/products?kw=${encodeURIComponent(val)}" style="display:block; text-align:center; padding:12px; font-size:13px; font-weight:600; color:#007bff; text-decoration:none;">Xem tất cả kết quả cho "${val}" <i class="fa-solid fa-arrow-right"></i></a>
                                        </div>`;
                                            searchResultsContainer.innerHTML = html;
                                        } else {
                                            searchResultsContainer.innerHTML = '<p class="search-hint" style="color:#e53935;">Không tìm thấy sản phẩm nào phù hợp.</p>';
                                        }
                                    })
                                    .catch(err => {
                                        searchResultsContainer.innerHTML = '<p class="search-hint">Lỗi kết nối. Vui lòng thử lại.</p>';
                                    });
                            }, 400);
                        });

                        searchInput.addEventListener('keypress', (e) => {
                            if (e.key === 'Enter') {
                                performSearch(e.target.value);
                            }
                        });
                    }

                    if (searchTags) {
                        searchTags.forEach(tag => {
                            tag.addEventListener('click', (e) => {
                                e.preventDefault();
                                const query = tag.getAttribute('data-query') || tag.innerText.trim();
                                if (searchInput) {
                                    searchInput.value = query;
                                    searchInput.dispatchEvent(new Event('input'));
                                }
                                performSearch(query);
                            });
                        });
                    }
                });
            </script>
        </div>
</body>

</html>
