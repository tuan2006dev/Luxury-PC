<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
  <meta charset="UTF-8">
  <title>Giỏ Hàng - LuxuryPC</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <style>
    :root {
        --gold: #C5A25D;
        --gold-light: #d8ba7b;
        --black: #0b0b0b;
        --deep: #111111;
        --dark-grey: #1a1a1a;
        --border-color: rgba(201,168,76,0.15);
        --text-muted: #888;
    }

    body {
        background-color: var(--black);
        color: #ffffff;
        font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        min-height: 100vh;
        cursor: none;
    }

    /* Custom Cursor */
    .cursor{position:fixed;width:8px;height:8px;background:var(--gold);border-radius:50%;pointer-events:none;z-index:10000;transform:translate(-50%,-50%);transition:transform .12s ease;}
    .cursor-follower{position:fixed;width:36px;height:36px;border:1px solid var(--gold);border-radius:50%;pointer-events:none;z-index:9999;transform:translate(-50%,-50%);opacity:.45;transition:width .25s,height .25s,opacity .25s;}

    /* Header Logo Section */
    .header-logo {
        padding: 30px 0;
        text-align: center;
        border-bottom: 1px solid var(--border-color);
        margin-bottom: 40px;
    }

    .logo-text { font-size: 2.2rem; font-weight: bold; letter-spacing: 5px; color: #ffffff; text-decoration: none; }
    .logo-text span { color: var(--gold); font-weight: 300; margin: 0 10px; }
    .logo-pc { font-weight: 300; letter-spacing: 8px; }

    .page-title {
        color: var(--gold);
        font-weight: 600;
        text-transform: uppercase;
        letter-spacing: 2px;
        margin-bottom: 30px;
        font-size: 1.8rem;
    }

    /* 2 Column Layout */
    .cart-container {
        display: flex;
        flex-wrap: wrap;
        gap: 30px;
        align-items: flex-start;
    }
    .cart-items-wrap {
        flex: 1 1 60%;
        min-width: 320px;
    }
    .cart-summary-wrap {
        flex: 1 1 30%;
        min-width: 300px;
        position: sticky;
        top: 20px;
    }

    /* Item Card */
    .cart-item {
        display: flex;
        align-items: center;
        background: var(--dark-grey);
        border: 1px solid var(--border-color);
        padding: 20px;
        margin-bottom: 15px;
        border-radius: 8px;
        transition: transform 0.3s ease, border-color 0.3s ease;
        position: relative;
    }
    .cart-item:hover {
        border-color: rgba(201,168,76,0.4);
        transform: translateY(-2px);
    }
    .item-img {
        width: 100px;
        height: 100px;
        background: var(--deep);
        border: 1px solid var(--border-color);
        border-radius: 5px;
        display: flex;
        align-items: center;
        justify-content: center;
        font-size: 2rem;
        color: var(--gold);
        margin-right: 20px;
        flex-shrink: 0;
        overflow: hidden;
    }
    .item-img img { width: 100%; height: 100%; object-fit: cover; }
    .item-details { flex: 1; }
    .item-name {
        font-size: 1.1rem;
        font-weight: 600;
        margin-bottom: 8px;
        color: #fff;
    }
    .item-price {
        font-size: 1rem;
        color: var(--text-muted);
        margin-bottom: 15px;
    }
    .item-total-price {
        font-size: 1.2rem;
        color: var(--gold);
        font-weight: bold;
        white-space: nowrap;
        text-align: right;
    }

    /* Quantity Controls */
    .qty-controls {
        display: inline-flex;
        align-items: center;
        background: var(--deep);
        border: 1px solid var(--border-color);
        border-radius: 20px;
        padding: 5px;
    }
    .btn-qty {
        background: transparent;
        border: none;
        color: #fff;
        width: 30px;
        height: 30px;
        border-radius: 50%;
        display: flex;
        align-items: center;
        justify-content: center;
        cursor: pointer;
        transition: 0.2s;
    }
    .btn-qty:hover { background: var(--gold); color: #000; }
    .qty-input {
        background: transparent !important;
        border: none;
        color: #fff !important;
        width: 40px !important;
        text-align: center;
        font-weight: 600;
        outline: none;
    }

    /* Remove Action */
    .btn-remove {
        position: absolute;
        top: 15px;
        right: 15px;
        color: var(--text-muted);
        background: none;
        border: none;
        font-size: 1.2rem;
        transition: 0.3s;
        padding: 5px;
    }
    .btn-remove:hover { color: #ff4444; transform: scale(1.1); }

    /* Summary Card */
    .summary-card {
        background: var(--dark-grey);
        border: 1px solid var(--border-color);
        padding: 25px;
        border-radius: 8px;
    }
    .summary-title {
        font-size: 1.2rem;
        font-weight: 600;
        color: var(--gold);
        border-bottom: 1px solid var(--border-color);
        padding-bottom: 15px;
        margin-bottom: 20px;
        text-transform: uppercase;
        letter-spacing: 1px;
    }
    .summary-row {
        display: flex;
        justify-content: space-between;
        margin-bottom: 15px;
        font-size: 1rem;
        color: var(--text-muted);
    }
    .summary-total {
        display: flex;
        justify-content: space-between;
        margin-top: 20px;
        padding-top: 20px;
        border-top: 1px solid var(--border-color);
        font-size: 1.4rem;
        font-weight: bold;
        color: #fff;
    }
    .summary-total span.gold-text { color: var(--gold); }

    /* Buttons */
    .btn-gold {
        background: linear-gradient(135deg, var(--gold), var(--gold-light));
        color: #000;
        border: none;
        font-weight: bold;
        padding: 15px;
        width: 100%;
        margin-top: 25px;
        letter-spacing: 2px;
        text-transform: uppercase;
        border-radius: 4px;
        transition: 0.3s;
        box-shadow: 0 4px 15px rgba(197, 162, 93, 0.2);
    }
    .btn-gold:hover { transform: translateY(-3px); box-shadow: 0 6px 20px rgba(197, 162, 93, 0.4); color: #000; }
    
    .btn-outline-gold {
        display: inline-block;
        background-color: transparent;
        color: var(--gold);
        border: 1px solid var(--gold);
        font-weight: 600;
        padding: 10px 25px;
        border-radius: 4px;
        text-decoration: none;
        transition: 0.3s;
        margin-bottom: 20px;
    }
    .btn-outline-gold:hover { background-color: var(--gold); color: #000; }

    /* Empty Cart */
    .empty-cart {
        padding: 80px 20px;
        text-align: center;
        background: var(--dark-grey);
        border: 1px dashed rgba(201,168,76,0.3);
        border-radius: 8px;
    }
    .empty-cart i { font-size: 4rem; color: var(--border-color); margin-bottom: 20px; }
    .empty-cart h4 { color: #fff; margin-bottom: 20px; font-weight: 300; }
  </style>
</head>
<body>
<div class="cursor" id="cursor"></div>
<div class="cursor-follower" id="cursor-follower"></div>

<header class="header-logo">
  <div class="container" style="display:flex; justify-content:center;">
    <a href="/" style="text-decoration:none; display:flex; align-items:center; gap: 10px;">
        <span style="font-family:'Inter', sans-serif; font-size:2rem; font-weight:400; letter-spacing:0.35em; color:var(--gold);">LUXURY</span>
        <div style="width:1px; height:28px; background:var(--gold); opacity:0.6;"></div>
        <span style="font-family:'Inter', sans-serif; font-size:0.7rem; font-weight:500; letter-spacing:0.5em; color:#888; text-transform:uppercase;">PC</span>
    </a>
  </div>
</header>

<div class="container mb-5">
  <h2 class="page-title">Giỏ Hàng Của Bạn</h2>
  <a th:href="@{/}" class="btn-outline-gold"><i class="fa-solid fa-arrow-left me-2"></i> Tiếp tục mua hàng</a>

  <!-- Alert panel for stock warning -->
  <div id="stock-alert-panel" class="alert alert-warning alert-dismissible fade show" role="alert" style="display: none; background: rgba(230, 92, 0, 0.15); border: 1px solid var(--gold); border-radius: 8px; padding: 1rem; margin-top: 1.5rem; margin-bottom: 1.5rem; align-items: center; justify-content: space-between; color: var(--white); font-size: 0.9rem;">
      <div style="display: flex; align-items: center; gap: 0.75rem;">
          <i class="fa-solid fa-triangle-exclamation" style="color: var(--gold); font-size: 1.2rem;"></i>
          <span id="stock-alert-msg">Thông báo giới hạn số lượng sản phẩm.</span>
      </div>
      <button type="button" class="btn-close" onclick="closeStockAlert()" style="background: none; border: none; color: var(--gold); cursor: pointer; font-size: 1.2rem; font-weight: bold; padding: 0; outline: none;">&times;</button>
  </div>

  <div class="cart-container" th:if="${!#lists.isEmpty(cartItems)}" id="cart-content">
    
    <!-- Cột trái: Danh sách item -->
    <div class="cart-items-wrap" id="cart-item-list">
      <div class="cart-item" th:each="item : ${cartItems}" th:id="'row-' + ${item.id}" th:data-stock="${item.stock}" th:data-name="${item.name}">
        <!-- Dùng hình ảnh Product nếu có, fallback là icon -->
        <div class="item-img">
            <img th:if="${item.image != null and item.image != ''}" th:src="@{${item.image.startsWith('http') ? item.image : '/images/products/' + item.image}}" alt="Hình sản phẩm" style="width:100%; height:100%; object-fit:cover; border-radius:5px;">
            <i th:unless="${item.image != null and item.image != ''}" class="fa-solid fa-computer"></i>
        </div>
        
        <div class="item-details">
          <div class="item-name" th:text="${item.name}">Tên sản phẩm</div>
          <div class="item-price" 
               th:data-price="${item.price}" 
               th:text="'Đơn giá: ' + ${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'">
          </div>
          <div class="qty-controls">
            <button type="button" class="btn-qty" th:onclick="'updateQty(' + ${item.id} + ', -1)'"><i class="fa-solid fa-minus"></i></button>
            <input type="text" class="qty-input" th:id="'qty-' + ${item.id}" th:value="${item.quantity}" readonly>
            <button type="button" class="btn-qty" th:onclick="'updateQty(' + ${item.id} + ', 1)'"><i class="fa-solid fa-plus"></i></button>
          </div>
        </div>
        
        <div class="item-total-price">
            <span class="item-total" th:id="'total-' + ${item.id}"></span>
        </div>
        
        <button class="btn-remove" th:onclick="'removeItem(' + ${item.id} + ')'" title="Xóa sản phẩm">
            <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <!-- Cột phải: Tổng thanh toán -->
    <div class="cart-summary-wrap" id="cart-footer">
      <div class="summary-card">
          <div class="summary-title">Tóm Tắt Đơn Hàng</div>
          <div class="summary-row">
              <span>Tạm tính (<span id="total-qty">0</span> món)</span>
              <span id="sub-total">0 ₫</span>
          </div>
          <div class="summary-row">
              <span>Phí vận chuyển</span>
              <span>Miễn phí</span>
          </div>
          <div class="summary-total">
              <span>Tổng Cộng</span>
              <span class="gold-text" id="grand-total">0 ₫</span>
          </div>
          <a th:href="@{/checkout}" style="text-decoration: none;">
            <button type="button" class="btn btn-gold">Thanh Toán Ngay <i class="fa-solid fa-arrow-right ms-2"></i></button>
          </a>
      </div>
    </div>

  </div>

  <!-- Khi giỏ rỗng (Được hiển thị động bởi JS hoặc Thymeleaf) -->
  <div id="ajax-empty-row" class="empty-cart mt-4" th:style="${#lists.isEmpty(cartItems)} ? 'display: block;' : 'display: none;'">
      <i class="fa-solid fa-cart-shopping"></i>
      <h4>Giỏ hàng của bạn đang trống.</h4>
      <a href="/" class="btn-outline-gold mt-2">Đến Cửa Hàng</a>
  </div>

</div>

<script>
  function formatMoney(amount) {
      return new Intl.NumberFormat('vi-VN').format(amount) + ' ₫';
  }

  function updateGrandTotal() {
      let grandTotal = 0;
      let totalQty = 0;
      const rows = document.querySelectorAll('.cart-item');

      if (rows.length === 0) {
          showEmptyCart();
          return;
      }

      rows.forEach(row => {
          const priceEl = row.querySelector('.item-price');
          const qtyInput = row.querySelector('.qty-input');
          if(priceEl && qtyInput) {
              const price = parseFloat(priceEl.getAttribute('data-price'));
              const qty = parseInt(qtyInput.value);
              const itemTotal = price * qty;
              row.querySelector('.item-total').innerText = formatMoney(itemTotal);
              grandTotal += itemTotal;
              totalQty += qty;
          }
      });

      const grandTotalEl = document.getElementById('grand-total');
      const subTotalEl = document.getElementById('sub-total');
      const totalQtyEl = document.getElementById('total-qty');
      
      if(grandTotalEl) grandTotalEl.innerText = formatMoney(grandTotal);
      if(subTotalEl) subTotalEl.innerText = formatMoney(grandTotal);
      if(totalQtyEl) totalQtyEl.innerText = totalQty;
  }

  function showEmptyCart() {
      const content = document.getElementById('cart-content');
      const ajaxEmpty = document.getElementById('ajax-empty-row');
      if(content) content.style.display = 'none';
      if(ajaxEmpty) ajaxEmpty.style.display = 'block';
  }

  let stockAlertTimeout;
  function showStockAlert(msg) {
      const alertPanel = document.getElementById('stock-alert-panel');
      const alertMsg = document.getElementById('stock-alert-msg');
      if (alertPanel && alertMsg) {
          alertMsg.innerText = msg;
          alertPanel.style.display = 'flex';
          alertPanel.scrollIntoView({ behavior: 'smooth', block: 'center' });
          if(stockAlertTimeout) clearTimeout(stockAlertTimeout);
          stockAlertTimeout = setTimeout(() => {
              alertPanel.style.display = 'none';
          }, 3000);
      }
  }

  function closeStockAlert() {
      const alertPanel = document.getElementById('stock-alert-panel');
      if (alertPanel) {
          alertPanel.style.display = 'none';
      }
  }

  function syncWithServer(id, quantity, qtyInput, originalQty, row, prodName) {
      fetch(`/cart/update?id=${id}&quantity=${quantity}`, { method: 'POST' })
      .then(res => res.json())
      .then(data => {
          if (!data.success) {
              showStockAlert(data.message);
              if (data.maxStock !== undefined) {
                  qtyInput.value = data.maxStock;
                  row.setAttribute('data-stock', data.maxStock);
                  updateGrandTotal();
              } else {
                  qtyInput.value = originalQty;
                  updateGrandTotal();
              }
          } else {
              closeStockAlert();
          }
      })
      .catch(err => {
          console.error("Lỗi đồng bộ server:", err);
          qtyInput.value = originalQty;
          updateGrandTotal();
      });
  }

  function updateQty(id, delta) {
      const row = document.getElementById('row-' + id);
      const maxStock = parseInt(row.getAttribute('data-stock') || '999');
      const prodName = row.getAttribute('data-name') || 'Sản phẩm';
      const qtyInput = document.getElementById('qty-' + id);
      let currentQty = parseInt(qtyInput.value);
      let newQty = currentQty + delta;

      if (newQty > maxStock && delta > 0) {
          showStockAlert(`Số lượng yêu cầu vượt quá tồn kho thực tế của "${prodName}" (chỉ còn ${maxStock} sản phẩm)!`);
          return;
      }

      if (newQty > 0) {
          qtyInput.value = newQty;
          updateGrandTotal();
          syncWithServer(id, newQty, qtyInput, currentQty, row, prodName);
      }
  }

  function removeItem(id) {
      if (confirm("Bạn muốn xóa sản phẩm này khỏi giỏ hàng?")) {
          fetch(`/cart/remove?id=${id}`, { method: 'POST' })
          .then(response => {
              if (response.ok) {
                  const row = document.getElementById('row-' + id);
                  row.style.transform = 'translateX(-20px)';
                  row.style.opacity = '0';
                  setTimeout(() => {
                      row.remove();
                      updateGrandTotal();
                  }, 300);
              }
          });
      }
  }

  document.addEventListener('DOMContentLoaded', () => {
      const urlParams = new URLSearchParams(window.location.search);
      const errorMsg = urlParams.get('error');
      if (errorMsg) {
          showStockAlert(errorMsg);
      }
      updateGrandTotal();
  });

  // Custom Cursor
  (function() {
    const cur = document.getElementById('cursor');
    const fol = document.getElementById('cursor-follower');
    if (!cur || !fol) return;
    let mx = 0, my = 0, fx = 0, fy = 0;
    document.addEventListener('mousemove', e => {
      mx = e.clientX; my = e.clientY;
      cur.style.left = mx + 'px'; cur.style.top = my + 'px';
    });
    (function loop() {
      fx += (mx - fx) * 0.12; fy += (my - fy) * 0.12;
      fol.style.left = fx + 'px'; fol.style.top = fy + 'px';
      requestAnimationFrame(loop);
    })();
    document.querySelectorAll('a, button, .cart-item').forEach(el => {
      el.addEventListener('mouseenter', () => {
        cur.style.transform = 'translate(-50%,-50%) scale(2)';
        fol.style.width = '56px'; fol.style.height = '56px'; fol.style.opacity = '0.2';
      });
      el.addEventListener('mouseleave', () => {
        cur.style.transform = 'translate(-50%,-50%) scale(1)';
        fol.style.width = '36px'; fol.style.height = '36px'; fol.style.opacity = '0.45';
      });
    });
  })();
</script>

</body>
</html>
