<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <link rel="icon" type="image/png" th:href="@{/logo.png}" />
  <meta charset="UTF-8">
  <title data-translate="cart-title">Giỏ Hàng - LuxuryPC</title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
  <link rel="stylesheet" th:href="@{/css/cart.css}" />
</head>
<body>



<header class="header-logo">
  <div class="container" style="display:flex; justify-content:center;">
    <a href="/" style="text-decoration:none; display:flex; align-items:center; gap: 10px;">
        <span class="logo-Luxury">LUXURY</span> <span class="logo-pc">PC</span>
    </a>
  </div>
</header>

<div class="container mb-5">
  <h2 class="page-title" data-translate="cart-page-title">Giỏ Hàng Của Bạn</h2>
  <a th:href="@{/}" class="btn-outline-gold"><i class="fa-solid fa-arrow-left me-2"></i> <span data-translate="cart-btn-continue">Tiếp tục mua hàng</span></a>

  <!-- Alert panel for stock warning -->
  <div id="stock-alert-panel" class="alert alert-warning alert-dismissible fade show" role="alert" style="display: none; position: fixed; top: 80px; right: 20px; z-index: 9999; background: rgba(20, 20, 25, 0.95); border: 1px solid var(--gold); border-left: 4px solid var(--gold); border-radius: 8px; padding: 1rem 1.5rem; align-items: center; justify-content: space-between; color: var(--white); font-size: 1rem; box-shadow: 0 10px 30px rgba(0,0,0,0.5); min-width: 300px; max-width: 400px; animation: slideInRight 0.3s ease;">
      <div style="display: flex; align-items: flex-start; gap: 1rem;">
          <i class="fa-solid fa-triangle-exclamation" style="color: var(--gold); font-size: 1.5rem; margin-top: 2px;"></i>
          <span id="stock-alert-msg" style="line-height: 1.4;" data-translate="cart-stock-alert-msg">Thông báo giới hạn số lượng sản phẩm.</span>
      </div>
      <button type="button" class="btn-close" onclick="closeStockAlert()" style="background: none; border: none; color: #fff; cursor: pointer; font-size: 1.5rem; padding: 0; margin-left: 1rem; outline: none; opacity: 0.7;">&times;</button>
  </div>

  <div class="cart-container" th:if="${!#lists.isEmpty(cartItems)}" id="cart-content">
    
    <!-- Cột trái: Danh sách item -->
    <div class="cart-items-wrap" id="cart-item-list">
      <div class="cart-item" th:each="item : ${cartItems}" th:id="'row-' + ${item.id}" th:data-stock="${item.stock}" th:data-name="${item.name}">
        <!-- Dùng hình ảnh Product nếu có, fallback là icon -->
        <div class="item-img">
            <img th:if="${item.image != null and item.image != ''}" th:src="@{${item.image.startsWith('http') ? item.image : '/images/products/' + item.image}}" alt="Hình sản phẩm" style="width:100%; height:100%; object-fit:cover; border-radius:5px;">
            <i th:unless="${item.image != null and item.image != ''}" class="fa-solid fa-computer"></i>
        </div>
        
        <div class="item-details">
          <div class="item-name" th:text="${item.name}">Tên sản phẩm</div>
          <div class="item-price" th:data-price="${item.price}">
               <span data-translate="cart-item-price-label">Đơn giá</span>: <span th:text="${#numbers.formatDecimal(item.price, 0, 'COMMA', 0, 'POINT')} + ' ₫'"></span>
          </div>
          <div class="qty-controls">
            <button type="button" class="btn-qty" th:onclick="'updateQty(' + ${item.id} + ', -1)'"><i class="fa-solid fa-minus"></i></button>
            <input type="number" class="qty-input" th:id="'qty-' + ${item.id}" th:value="${item.quantity}" min="1" th:onchange="'manualQtyChange(' + ${item.id} + ', this, ' + ${item.quantity} + ')'">
            <button type="button" class="btn-qty" th:onclick="'updateQty(' + ${item.id} + ', 1)'"><i class="fa-solid fa-plus"></i></button>
          </div>
        </div>
        
        <div class="item-total-price">
            <span class="item-total" th:id="'total-' + ${item.id}"></span>
        </div>
        
        <button class="btn-remove" th:onclick="'removeItem(' + ${item.id} + ')'" title="Xóa sản phẩm">
            <i class="fa-solid fa-xmark"></i>
        </button>
      </div>
    </div>

    <!-- Cột phải: Tổng thanh toán -->
    <div class="cart-summary-wrap" id="cart-footer">
      <div class="summary-card">
          <div class="summary-title" data-translate="cart-summary-title">Tóm Tắt Đơn Hàng</div>
          <div class="summary-row">
              <span><span data-translate="cart-subtotal-label">Tạm tính</span> (<span id="total-qty">0</span> <span data-translate="cart-item-unit">món</span>)</span>
              <span id="sub-total">0 ₫</span>
          </div>
          <div class="summary-row">
              <span data-translate="cart-shipping-label">Phí vận chuyển</span>
              <span data-translate="cart-shipping-value">Miễn phí</span>
          </div>
          <div class="summary-total">
              <span data-translate="cart-grandtotal-label">Tổng Cộng</span>
              <span class="gold-text" id="grand-total">0 ₫</span>
          </div>
          <a th:href="@{/checkout}" style="text-decoration: none;">
            <button type="button" class="btn btn-gold"><span data-translate="cart-btn-checkout">Thanh Toán Ngay</span> <i class="fa-solid fa-arrow-right ms-2"></i></button>
          </a>
      </div>
    </div>

  </div>

  <!-- Khi giỏ rỗng (Được hiển thị động bởi JS hoặc Thymeleaf) -->
  <div id="ajax-empty-row" class="empty-cart mt-4" th:style="${#lists.isEmpty(cartItems)} ? 'display: block;' : 'display: none;'">
      <i class="fa-solid fa-cart-shopping"></i>
      <h4 data-translate="cart-empty-message">Giỏ hàng của bạn đang trống.</h4>
      <a href="/" class="btn-outline-gold mt-2" data-translate="cart-btn-goto-shop">Đến Cửa Hàng</a>
  </div>

</div>

<script th:src="@{/js/cart.js}"></script>

<!-- GLOBAL CONFIRM MODAL FOR CART -->
<div class="confirm-modal-overlay" id="global-confirm-overlay" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.8); z-index:9000; justify-content:center; align-items:center; opacity:0; transition:opacity 0.3s;">
    <div class="confirm-modal" style="background:var(--deep); border:1px solid var(--gold); border-radius:8px; padding:2rem; width:90%; max-width:400px; text-align:center; transform:translateY(-20px); transition:transform 0.3s; box-shadow:0 10px 30px rgba(0,0,0,0.5);">
        <div style="font-size:3rem; color:var(--gold); margin-bottom:1rem;"><i class="fa-solid fa-circle-exclamation" id="confirm-icon"></i></div>
        <h3 style="font-family:var(--sans); font-weight:400; color:#fff; margin-bottom:0.5rem;" id="confirm-title" data-translate="confirm-modal-title">Xác nhận</h3>
        <p style="color:#ccc; font-size:0.9rem; margin-bottom:2rem;" id="confirm-msg" data-translate="confirm-modal-body">Bạn có chắc chắn muốn thực hiện hành động này?</p>
        <div style="display:flex; gap:1rem; justify-content:center;">
            <button id="confirm-cancel-btn" style="flex:1; padding:0.8rem; background:transparent; border:1px solid rgba(255,255,255,0.2); color:#ccc; cursor:pointer; font-weight:bold; border-radius:4px; transition:all 0.2s;" data-translate="confirm-modal-cancel">Hủy</button>
            <button id="confirm-ok-btn" style="flex:1; padding:0.8rem; background:var(--gold); border:none; color:var(--black); cursor:pointer; font-weight:bold; border-radius:4px; transition:all 0.2s;" data-translate="confirm-modal-ok">Đồng ý</button>
        </div>
    </div>
</div>




<!-- THEME TOGGLE -->
<button class="theme-toggle-btn floating-theme-btn" id="theme-toggle" aria-label="Chuyển đổi giao diện Sáng/Tối">
    <i class="fa-regular fa-moon"></i>
</button>
<script th:src="@{/js/theme.js}"></script>

</body>
</html>
