<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán QR</title>
    <link rel="stylesheet" th:href="@{/css/payment.css}" />
    <link rel="icon" type="image/png" th:href="@{/images/logo.svg}" />
</head>

<body>

    <div class="payment-box">
        <h2>Thanh toán đơn hàng</h2>

        <p class="amount">
            <span th:text="${#numbers.formatDecimal(amount, 0, 'COMMA', 0, 'POINT')}"></span> <span>VNĐ</span>
        </p>

        <img th:src="${qrUrl}" alt="QR thanh toán">

        <div class="info">
            <p><b>Mã đơn</b>: <span th:text="${orderCode}"></span></p>
            <p><b>Ngân hàng</b>: <span th:text="${bankDisplayName}">MB Bank</span></p>
            <p><b>Số tài khoản</b>: <span th:text="${accountNo}">9999999999</span>
            </p>
            <p><b>Chủ tài khoản</b>: <span th:text="${accountName}">LUXURYPC</span></p>
            <p><b>Nội dung chuyển khoản</b>: <span th:text="${transferContent}"></span></p>
        </div>

        <p class="note">
            Quét mã QR bằng app ngân hàng và chuyển đúng nội dung để hệ thống tự động đối soát đơn hàng.
        </p>

        <a href="/" class="btn">Về trang chủ</a>
    </div>

    <script th:src="@{/js/payment.js}"></script>


    <!-- THEME TOGGLE -->
    <button class="theme-toggle-btn floating-theme-btn" id="theme-toggle" aria-label="Chuyển đổi giao diện Sáng/Tối">
        <i class="fa-regular fa-moon"></i>
    </button>
    <script th:src="@{/js/theme.js}"></script>

</body>

</html>
