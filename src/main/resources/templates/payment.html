<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Thanh toán QR</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background: #f3f4f6;
            padding: 40px;
        }

        .payment-box {
            width: 430px;
            margin: auto;
            background: white;
            border-radius: 14px;
            padding: 24px;
            box-shadow: 0 4px 16px rgba(0,0,0,0.12);
            text-align: center;
        }

        .payment-box img {
            width: 280px;
            height: 280px;
            margin: 16px 0;
            border: 1px solid #ddd;
            border-radius: 10px;
        }

        .amount {
            color: #d60000;
            font-size: 24px;
            font-weight: bold;
        }

        .info {
            text-align: left;
            margin-top: 16px;
            line-height: 1.8;
        }

        .note {
            margin-top: 16px;
            font-size: 14px;
            color: #666;
        }

        .btn {
            display: inline-block;
            margin-top: 18px;
            padding: 10px 18px;
            background: #111827;
            color: white;
            text-decoration: none;
            border-radius: 8px;
        }
    </style>
</head>
<body>

<div class="payment-box">
    <h2 data-translate="pay-header">Thanh toán đơn hàng</h2>

    <p class="amount">
        <span th:text="${#numbers.formatDecimal(amount, 0, 'COMMA', 0, 'POINT')}"></span> VNĐ
    </p>

    <img th:src="${qrUrl}" alt="QR thanh toán">

    <div class="info">
        <p><b data-translate="pay-label-order-code">Mã đơn</b>: <span th:text="${orderCode}"></span></p>
        <p><b data-translate="pay-label-bank">Ngân hàng</b>: <span th:text="${bankDisplayName}">MB Bank</span></p>
        <p><b data-translate="pay-label-account-no">Số tài khoản</b>: <span th:text="${accountNo}">9999999999</span></p>
        <p><b data-translate="pay-label-account-name">Chủ tài khoản</b>: <span th:text="${accountName}">LUXURYPC</span></p>
        <p><b data-translate="pay-label-transfer-content">Nội dung chuyển khoản</b>: <span th:text="${transferContent}"></span></p>
    </div>

    <p class="note" data-translate="pay-note">
        Quét mã QR bằng app ngân hàng và chuyển đúng nội dung để hệ thống tự động đối soát đơn hàng.
    </p>

    <a href="/" class="btn" data-translate="pay-btn-home">Về trang chủ</a>
</div>

<script>
    let translations = {};
    
    function setLanguage(lang) {
        localStorage.setItem('lang', lang);
        document.querySelectorAll('[data-translate]').forEach(el => {
            const key = el.getAttribute('data-translate');
            if (translations[lang] && translations[lang][key]) {
                const val = translations[lang][key];
                if (el.children.length === 0) {
                    el.textContent = val;
                } else {
                    let textNode = Array.from(el.childNodes).find(node => node.nodeType === Node.TEXT_NODE);
                    if (textNode) {
                        textNode.nodeValue = val;
                    }
                }
            }
        });
    }

    async function loadTranslations() {
        const savedLang = localStorage.getItem('lang') || 'vi';
        const cachedData = localStorage.getItem('translations_cache');
        if (cachedData) {
            try {
                translations = JSON.parse(cachedData);
                setLanguage(savedLang);
            } catch (e) {
                console.error(e);
            }
        }

        try {
            const response = await fetch('/api/translations');
            translations = await response.json();
            localStorage.setItem('translations_cache', JSON.stringify(translations));
            setLanguage(savedLang);
        } catch (error) {
            console.error(error);
        }
    }

    document.addEventListener('DOMContentLoaded', loadTranslations);
</script>

</body>
</html>
