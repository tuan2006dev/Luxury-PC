<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - LUXURY | PC</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" th:href="@{/logo.png}" />

    <link rel="stylesheet" th:href="@{/css/style.css(v=2.0)}">
    <link rel="stylesheet" th:href="@{/css/auth.css(v=2.0)}">
</head>

<body>
    <!-- HEADER CONTAINER -->
    <div th:replace="~{layout/header :: header}"></div>

    <div class="container" style="padding-top: 20px;">
        <!-- BREADCRUMB -->
        <div class="breadcrumb" style="margin-bottom: 20px;">
            <a th:href="@{/}">Trang chủ</a> > <span>Đăng ký</span>
        </div>

        <h1 class="page-title">ĐĂNG KÝ</h1>
        <p class="page-subtitle">Tạo tài khoản mới để bắt đầu mua sắm cùng chúng tôi.</p>

        <!-- Notification section -->
        <script th:inline="javascript">
            document.addEventListener('DOMContentLoaded', function () {
                /*<![CDATA[*/
                const hasExist = /*[[${param.exist != null}]]*/ false;
                const hasMismatch = /*[[${param.mismatch != null}]]*/ false;
                const hasInvalidOtp = /*[[${param.invalidOtp != null}]]*/ false;
                const hasInvalidEmail = /*[[${param.invalidEmail != null}]]*/ false;
                const hasPhoneExist = /*[[${param.phoneExist != null}]]*/ false;
                /*]]>*/

                if (typeof window.showAlert === 'function') {
                    if (hasExist) window.showAlert('Email đã tồn tại trong hệ thống. Vui lòng đăng nhập!', false);
                    else if (hasMismatch) window.showAlert('Mật khẩu xác nhận không khớp. Vui lòng thử lại.', false);
                    else if (hasInvalidOtp) window.showAlert('Mã OTP không chính xác hoặc đã hết hạn!', false);
                    else if (hasInvalidEmail) window.showAlert('Định dạng email không hợp lệ!', false);
                    else if (hasPhoneExist) window.showAlert('Số điện thoại đã được sử dụng!', false);
                }
            });
        </script>

        <!-- AUTH FORM LAYOUT -->
        <div class="auth-layout" style="grid-template-columns: 1fr; max-width: 600px; margin: 0 auto 60px auto;">

            <!-- CỘT ĐĂNG KÝ -->
            <div class="auth-box reset-form">
                <h2 class="auth-box-title">ĐĂNG KÝ</h2>
                <p class="auth-box-subtitle">Tạo tài khoản mới để bắt đầu mua sắm cùng chúng tôi</p>
                <form id="form-register" action="/api/register" method="POST" onsubmit="submitRegister(event)"
                    novalidate>
                    <div class="form-row">
                        <div
                            th:replace="~{custominput/components :: textInput(label='Họ *', name='firstName', type='text', placeholder='Nguyễn', required=true, id=null, value=null)}">
                        </div>
                        <div
                            th:replace="~{custominput/components :: textInput(label='Tên *', name='lastName', type='text', placeholder='Văn A', required=true, id=null, value=null)}">
                        </div>
                    </div>
                    <div
                        th:replace="~{custominput/components :: textInput(label='Email *', name='email', type='email', placeholder='you@email.com', required=true, id=null, value=null)}">
                    </div>
                    <div
                        th:replace="~{custominput/components :: textInput(label='Số điện thoại *', name='phone', type='text', placeholder='0901xxxxxx', required=true, id=null, value=null)}">
                    </div>
                    <div
                        th:replace="~{custominput/components :: textInput(label='Mật khẩu *', name='password', type='password', placeholder='••••••••', required=true, id='reg-pw', value=null)}">
                    </div>
                    <div
                        th:replace="~{custominput/components :: textInput(label='Nhập lại mật khẩu *', name='confirmPassword', type='password', placeholder='••••••••', required=true, id='reg-pw-confirm', value=null)}">
                    </div>
                    <span id="pw-error"
                        style="color: #ef4444; font-size: 13px; display: none; margin-top: -15px; margin-bottom: 20px;">Mật
                        khẩu nhập lại không khớp!</span>
                    <div
                        th:replace="~{custominput/components :: otpInput(label='Mã xác nhận (otp) *', name='otp', placeholder='Nhập mã OTP', required=true, onClickSend='sendOTP()')}">
                    </div>
                    <label class="checkbox-label terms">
                        <input type="checkbox" required> Tôi đồng ý với <a href="/products"
                            style="color: #666; text-decoration: underline;">Điều khoản dịch vụ</a> và <a
                            href="/products" style="color: #666; text-decoration: underline;">Chính sách bảo mật</a>
                    </label>
                    <button type="submit" class="btn btn-primary" id="btn-register">ĐĂNG KÝ</button>

                    <div style="text-align: center; margin-top: 20px; font-size: 14px;">
                        Đã có tài khoản? <a th:href="@{/auth/login}"
                            style="color: var(--accent-blue); font-weight: 600; text-decoration: underline;">Đăng nhập
                            ngay</a>
                    </div>

                    <div class="or-divider"><span>HOẶC</span></div>

                    <div class="social-login">
                        <a href="/oauth2/authorization/google" class="btn btn-outline">
                            <i class="fa-brands fa-google" style="color: #DB4437; font-size: 18px;"></i> Google
                        </a>
                        <a href="/oauth2/authorization/facebook" class="btn btn-outline">
                            <i class="fa-brands fa-facebook" style="color: #1877F2; font-size: 18px;"></i> Facebook
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- FOOTER CONTAINER -->
    <div th:replace="~{layout/footer :: footer}"></div>

    <script>
        function sendOTP() {
            const emailInput = document.querySelector('input[name="email"]');
            const email = emailInput.value.trim();
            if (!email) {
                window.showAlert('Vui lòng nhập email trước khi gửi mã OTP!', false);
                emailInput.focus();
                return;
            }

            const btn = document.querySelector('.btn-otp');
            btn.innerText = 'ĐANG GỬI...';
            btn.disabled = true;

            const formData = new URLSearchParams();
            formData.append('email', email);

            fetch('/api/send-otp', {
                method: 'POST',
                headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
                body: formData
            })
                .then(res => res.text())
                .then(data => {
                    if (data === 'success') {
                        window.showAlert(null, true);

                        // Countdown
                        let timeLeft = 60;
                        btn.innerText = `CHỜ ${timeLeft}S`;
                        const timer = setInterval(() => {
                            timeLeft--;
                            if (timeLeft <= 0) {
                                clearInterval(timer);
                                btn.innerText = 'GỬI LẠI MÃ';
                                btn.disabled = false;
                            } else {
                                btn.innerText = `CHỜ ${timeLeft}S`;
                            }
                        }, 1000);
                    } else if (data === 'error_exist') {
                        window.showAlert('Email này đã được đăng ký tài khoản!', false);
                        btn.innerText = 'GỬI MÃ';
                        btn.disabled = false;
                    } else {
                        window.showAlert('Không thể gửi OTP. Vui lòng thử lại sau.', false);
                        btn.innerText = 'GỬI MÃ';
                        btn.disabled = false;
                    }
                })
                .catch(err => {
                    console.error(err);
                    window.showAlert('Đã xảy ra lỗi mạng. Vui lòng thử lại.', false);
                    btn.innerText = 'GỬI MÃ';
                    btn.disabled = false;
                });
        }

        function submitRegister(e) {
            e.preventDefault();

            // Reset previous invalid states and error text
            document.querySelectorAll('.error-message').forEach(el => {
                el.style.display = 'none';
                el.innerText = '';
            });
            document.querySelectorAll('.reset-form input').forEach(el => {
                el.classList.remove('is-invalid');
            });
            const pwError = document.getElementById('pw-error');
            if (pwError) {
                pwError.style.display = 'none';
            }

            const firstNameInput = document.querySelector('input[name="firstName"]');
            const lastNameInput = document.querySelector('input[name="lastName"]');
            const emailInput = document.querySelector('input[name="email"]');
            const phoneInput = document.querySelector('input[name="phone"]');
            const pwInput = document.getElementById('reg-pw');
            const pwConfirmInput = document.getElementById('reg-pw-confirm');
            const otpInput = document.querySelector('input[name="otp"]');
            const termsChecked = document.querySelector('.terms input[type="checkbox"]').checked;

            let isValid = true;

            const showFieldError = (input, msg) => {
                input.classList.add('is-invalid');
                const errSpan = input.closest('.form-group').querySelector('.error-message');
                if (errSpan) {
                    errSpan.innerText = msg;
                    errSpan.style.display = 'block';
                }
                isValid = false;
            };

            if (!firstNameInput.value.trim()) { showFieldError(firstNameInput, 'Vui lòng nhập Họ!'); }
            if (!lastNameInput.value.trim()) { showFieldError(lastNameInput, 'Vui lòng nhập Tên!'); }
            if (!emailInput.value.trim()) { showFieldError(emailInput, 'Vui lòng nhập Email!'); }
            if (!phoneInput.value.trim()) { showFieldError(phoneInput, 'Vui lòng nhập Số điện thoại!'); }
            if (!pwInput.value) { showFieldError(pwInput, 'Vui lòng nhập Mật khẩu!'); }
            if (!pwConfirmInput.value) { showFieldError(pwConfirmInput, 'Vui lòng nhập lại Mật khẩu!'); }

            if (pwInput.value && pwConfirmInput.value && pwInput.value !== pwConfirmInput.value) {
                pwConfirmInput.classList.add('is-invalid');
                if (pwError) {
                    pwError.style.display = 'block';
                }
                isValid = false;
            }

            if (!otpInput.value.trim()) { showFieldError(otpInput, 'Vui lòng nhập mã xác nhận (OTP)!'); }

            if (isValid && !termsChecked) {
                window.showAlert('Bạn cần đồng ý với Điều khoản dịch vụ và Chính sách bảo mật!', false);
                isValid = false;
            }

            if (!isValid) {
                return false;
            }

            document.getElementById('form-register').submit();
        }
    </script>

    <script th:src="@{/js/script.js}"></script>
</body>

</html>
