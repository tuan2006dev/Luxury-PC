<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Đăng ký - LUXURY | PC</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" type="image/png" th:href="@{/images/logo.svg}" />

    <link rel="stylesheet" th:href="@{/css/style.css}">
    <link rel="stylesheet" th:href="@{/css/auth.css}">
</head>

<body>
    <!-- HEADER CONTAINER -->
    <div th:replace="~{layout/header :: header}"></div>

    <div class="container" style="padding-top: 20px;">
        <!-- BREADCRUMB -->
        <div class="breadcrumb" style="margin-bottom: 25px;">
            <a th:href="@{/}">Trang chủ</a> &gt; <span>Đăng ký</span>
        </div>

        <!-- AUTH FORM LAYOUT -->
        <div class="auth-layout" style="grid-template-columns: 1fr; max-width: 540px; margin: 0 auto 60px auto;">

            <!-- CỘT ĐĂNG KÝ -->
            <div class="auth-box reset-form">
                <h1 class="auth-box-title" style="font-size: 24px; margin-bottom: 6px;">ĐĂNG KÝ TÀI KHOẢN</h1>
                <p class="auth-box-subtitle" style="margin-bottom: 24px;">Tạo tài khoản mới để bắt đầu mua sắm cùng
                    chúng tôi</p>

                <form id="form-register" action="/api/register" method="POST" onsubmit="submitRegister(event)"
                    novalidate>
                    <div class="form-row">
                        <div
                            th:replace="~{custominput/components :: textInput(label='Họ *', name='firstName', type='text', placeholder='Nguyễn', required=true, id=null, value=${firstName})}">
                        </div>
                        <div
                            th:replace="~{custominput/components :: textInput(label='Tên *', name='lastName', type='text', placeholder='Văn A', required=true, id=null, value=${lastName})}">
                        </div>
                    </div>
                    <div
                        th:replace="~{custominput/components :: textInput(label='Email *', name='email', type='email', placeholder='you@email.com', required=true, id=null, value=${email})}">
                    </div>
                    <div
                        th:replace="~{custominput/components :: textInput(label='Số điện thoại *', name='phone', type='text', placeholder='0901xxxxxx', required=true, id=null, value=${phone})}">
                    </div>
                    <div
                        th:replace="~{custominput/components :: textInput(label='Mật khẩu *', name='password', type='password', placeholder='••••••••', required=true, id='reg-pw', value=null)}">
                    </div>
                    <div
                        th:replace="~{custominput/components :: textInput(label='Nhập lại mật khẩu *', name='confirmPassword', type='password', placeholder='••••••••', required=true, id='reg-pw-confirm', value=null)}">
                    </div>
                    <div
                        th:replace="~{custominput/components :: otpInput(label='Mã xác nhận (OTP) *', name='otp', placeholder='Nhập mã OTP', required=true, onClickSend='sendOTP()')}">
                    </div>

                    <label class="checkbox-label terms" style="margin-top: 15px; margin-bottom: 20px;">
                        <input type="checkbox" required> Tôi đồng ý với <a href="#"
                            style="color: #666; text-decoration: underline;">Điều khoản dịch vụ</a> và <a href="#"
                            style="color: #666; text-decoration: underline;">Chính sách bảo mật</a>
                    </label>

                    <button type="submit" class="btn btn-primary" id="btn-register" style="width: 100%;">ĐĂNG
                        KÝ</button>

                    <div style="text-align: center; margin-top: 20px; font-size: 14px;">
                        Đã có tài khoản? <a th:href="@{/auth/login}"
                            style="color: var(--accent-blue); font-weight: 600; text-decoration: underline;">Đăng nhập
                            ngay</a>
                    </div>

                    <div class="or-divider"><span>HOẶC</span></div>

                    <div class="social-login">
                        <a href="/oauth2/authorization/google" class="btn btn-outline">
                            <i class="fa-brands fa-google" style="color: #DB4437; font-size: 18px;"></i> Google
                        </a>
                        <a href="/oauth2/authorization/facebook" class="btn btn-outline">
                            <i class="fa-brands fa-facebook" style="color: #1877F2; font-size: 18px;"></i> Facebook
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- FOOTER CONTAINER -->
    <div th:replace="~{layout/footer :: footer}"></div>

    <!-- URL Notification Script -->
    <script th:src="@{/js/script.js}"></script>
    <script th:src="@{/js/login.js}"></script>
</body>

</html>
