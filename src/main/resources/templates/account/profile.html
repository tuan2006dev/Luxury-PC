<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="_csrf" th:content="${_csrf?.token}" />
  <meta name="_csrf_header" th:content="${_csrf?.headerName}" />
  <title>Luxury PC — Hồ Sơ Cá Nhân</title>
  <link rel="icon" type="image/png" th:href="@{/images/logo.svg}" />
  <meta name="description" content="Quản lý tài khoản và hồ sơ cá nhân Luxury PC của bạn." />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700&family=Inter:wght@300;400;500;600&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css" />
  <link rel="stylesheet" th:href="@{/css/style.css}" />
  <link rel="stylesheet" th:href="@{/css/profile.css}" />
  <link rel="stylesheet" th:href="@{/css/cursor.css}" />
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
</head>

<body>

  <div th:replace="~{layout/header :: header}"></div>

  <div class="container" style="padding-top: 20px; padding-bottom: 60px;">
    <!-- BREADCRUMB -->
    <div class="breadcrumb" style="margin-bottom: 20px;">
      <a th:href="@{/}">Trang chủ</a> &gt; <span>Hồ sơ cá nhân</span>
    </div>

    <div class="profile-page">
      <!-- SIDEBAR -->
      <div th:replace="~{account/tabprofiile/sidebar :: sidebar}"></div>

      <!-- MAIN CONTENT TABS -->
      <main class="profile-main">
        <div th:replace="~{account/tabprofiile/info :: info}"></div>
        <div th:replace="~{account/tabprofiile/orders :: orders}"></div>
        <div th:replace="~{account/tabprofiile/vouchers :: vouchers}"></div>
        <div th:replace="~{account/tabprofiile/wishlist :: wishlist}"></div>
        <div th:replace="~{account/tabprofiile/security :: security}"></div>
        <div th:replace="~{account/tabprofiile/notifications :: notifications}"></div>
        <div th:replace="~{account/tabprofiile/address :: address}"></div>
      </main>
    </div>
  </div>

  <!-- POPUP MODALS -->
  <div th:replace="~{account/tabprofiile/modals :: modals}"></div>

  <div th:replace="~{layout/footer :: footer}"></div>

  <!-- SCRIPTS -->
  <script th:src="@{/js/confirm-popup.js}"></script>
  <script th:src="@{/js/account/profile.js}"></script>
  <script th:src="@{/js/script.js}"></script>
  <script th:src="@{/js/cursor.js}"></script>
</body>

</html>
