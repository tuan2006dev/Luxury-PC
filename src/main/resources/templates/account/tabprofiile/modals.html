<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
  <!-- ===== MODALS FRAGMENT ===== -->
  <div th:fragment="modals">
    <!-- Modal Đánh Giá Sản Phẩm -->
    <div class="order-modal-backdrop" id="review-modal-backdrop">
      <div class="order-modal">
        <button class="modal-close" onclick="closeOrderModal()">&times;</button>
        <div style="font-size:1.1rem; font-weight:700; margin-bottom:1rem;">Đánh Giá Sản Phẩm</div>
        <input type="hidden" id="review-product-id" />
        <input type="hidden" id="review-product-name" />
        <div id="review-pname-display" style="font-size:0.9rem; color:#3b82f6; margin-bottom:1rem; font-weight:600;">Tên
          sản phẩm</div>
        <div style="display:flex; gap:10px; font-size:24px; color:#ddd; cursor:pointer; margin-bottom:10px;">
          <span class="star-btn" onclick="setStar(1)">★</span>
          <span class="star-btn" onclick="setStar(2)">★</span>
          <span class="star-btn" onclick="setStar(3)">★</span>
          <span class="star-btn" onclick="setStar(4)">★</span>
          <span class="star-btn" onclick="setStar(5)">★</span>
        </div>
        <div id="star-desc" style="font-size:0.8rem; color:#64748b; margin-bottom:1rem;">Chọn số sao đánh giá</div>
        <textarea id="review-comment" class="form-input" rows="4" placeholder="Chia sẻ cảm nhận của bạn về sản phẩm..."
          style="margin-bottom:1rem;"></textarea>
        <button type="button" class="btn-save" onclick="submitReview()">Gửi Đánh Giá</button>
      </div>
    </div>

    <!-- Modal 2FA -->
    <div class="order-modal-backdrop" id="2fa-modal-backdrop">
      <div class="order-modal">
        <button class="modal-close" onclick="close2FAModal()">&times;</button>
        <div style="font-size:1.1rem; font-weight:700; margin-bottom:1rem;">Xác Thực 2 Lớp (2FA)</div>
        <p style="font-size:0.85rem; color:#64748b; margin-bottom:1rem;">Vui lòng nhập mã OTP 6 chữ số vừa được gửi đến
          email của bạn để hoàn tất bật 2FA.</p>
        <input type="text" id="2fa-otp-input" class="form-input" placeholder="Nhập mã OTP 6 số" maxlength="6"
          style="margin-bottom:1rem; text-align:center; letter-spacing:4px; font-size:1.2rem; font-weight:700;" />
        <button type="button" class="btn-save" style="width:100%;" onclick="verifyAndEnable2FA()">Xác Nhận &amp; Bật
          2FA</button>
      </div>
    </div>

    <!-- Modal Quản Lý Phiên Đăng Nhập -->
    <div class="order-modal-backdrop" id="sessions-modal-backdrop">
      <div class="order-modal" style="width: min(700px, 95%);">
        <button class="modal-close" onclick="closeSessionsModal()">&times;</button>
        <div style="font-size:1.1rem; font-weight:700; margin-bottom:0.5rem;">Thiết Bị Đang Đăng Nhập</div>
        <p style="font-size:0.85rem; color:#64748b; margin-bottom:1.5rem;">Danh sách các thiết bị hiện đang duy trì
          phiên đăng nhập tài khoản của bạn.</p>
        <div id="active-sessions-list"
          style="display:flex; flex-direction:column; gap:10px; max-height:400px; overflow-y:auto;">
          <div style="text-align:center; padding: 1.5rem; color: #64748b;">Đang tải...</div>
        </div>
      </div>
    </div>
  </div>
</body>

</html>
