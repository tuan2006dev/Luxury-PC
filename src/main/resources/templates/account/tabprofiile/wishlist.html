<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
  <!-- ============ TAB 4: YÊU THÍCH ============ -->
  <div th:fragment="wishlist" class="profile-section" id="sec-wishlist">
    <div class="section-head">
      <div>
        <div class="section-h">Sản Phẩm Yêu Thích</div>
      </div>
      <button class="btn-edit" onclick="removeAllWishlist()"
        th:if="${wishlistItems != null and !wishlistItems.isEmpty()}">Xóa Tất Cả</button>
    </div>

    <div class="wishlist-grid" th:if="${wishlistItems != null and !wishlistItems.isEmpty()}">
      <div class="wl-card" th:each="wi : ${wishlistItems}">
        <button class="wl-remove" title="Xóa khỏi yêu thích" th:data-wishlist-item-id="${wi.id}"
          onclick="removeFromWishlist(this)">
          <i class="fa-solid fa-xmark"></i>
        </button>
        <div class="wl-img">
          <img
            th:src="@{${wi.product.image != null ? (wi.product.image.startsWith('http') || wi.product.image.startsWith('/') ? wi.product.image : '/images/products/' + wi.product.image) : '/images/placeholder.png'}}"
            th:alt="${wi.product.name}" style="max-height:140px; object-fit:contain;" />
        </div>
        <div class="wl-info">
          <div class="wl-name" th:text="${wi.product.name}"></div>
          <div class="wl-price" th:text="${#numbers.formatDecimal(wi.product.price, 0, 'COMMA', 0, 'POINT')} + '₫'">
          </div>
          <a th:href="@{/product/{id}(id=${wi.product.id})}" class="btn-save"
            style="margin-top:10px; width:100%; text-decoration:none; text-align:center;">Xem Chi Tiết</a>
        </div>
      </div>
    </div>

    <div th:if="${wishlistItems == null or wishlistItems.isEmpty()}"
      style="text-align:center; padding:3rem 0; color:#64748b;">
      Danh sách yêu thích của bạn đang trống.
    </div>
  </div>
</body>

</html>
