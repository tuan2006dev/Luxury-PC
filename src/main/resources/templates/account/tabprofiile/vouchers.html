<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
  <!-- ============ TAB 3: VÍ VOUCHER ============ -->
  <div th:fragment="vouchers" class="profile-section" id="sec-vouchers">
    <div class="section-head">
      <div>
        <div class="section-h">Ví Voucher Của Tôi</div>
      </div>
      <button class="btn-edit" onclick="document.getElementById('input-voucher-code').focus()">+ <span>Lưu
          Mã</span></button>
    </div>

    <div
      style="background:#f8fafc; border:1px solid #e2e8f0; padding:1.5rem; margin-bottom:2rem; display:flex; gap:10px; border-radius:8px;">
      <input type="text" id="input-voucher-code" class="form-input" style="flex:1"
        placeholder="Nhập mã voucher để lưu..." />
      <button class="btn-save" onclick="saveVoucherCode()">Lưu Mã</button>
    </div>

    <div class="wishlist-grid">
      <div class="wl-card" th:each="uv : ${vouchers}"
        style="display:flex; flex-direction:column; justify-content:space-between;">
        <div class="wl-info">
          <div class="wl-cat">Voucher · <span th:if="${uv.voucher.discountType.name() == 'PERCENTAGE'}">Giảm
              %</span><span th:if="${uv.voucher.discountType.name() != 'PERCENTAGE'}">Giảm Tiền</span></div>
          <div class="wl-name" th:text="${uv.voucher.code}"></div>
          <div class="wl-price" th:if="${uv.voucher.discountType.name() == 'PERCENTAGE'}"
            th:text="${'Giảm ' + uv.voucher.discountValue + '%'}"></div>
          <div class="wl-price" th:if="${uv.voucher.discountType.name() != 'PERCENTAGE'}"
            th:text="${'Giảm ' + #numbers.formatDecimal(uv.voucher.discountValue, 0, 'COMMA', 0, 'POINT') + '₫'}"></div>
          <div style="font-size:12px; color:#64748b; margin-top:8px;" th:text="${uv.voucher.description}"></div>
        </div>
        <div style="padding:15px; border-top:1px solid #eee; background:#fafafa; font-size:11px; color:#64748b;">
          Hạn dùng: <span th:text="${#dates.format(uv.voucher.endDate, 'dd/MM/yyyy')}"></span>
        </div>
      </div>
      <div th:if="${vouchers == null or vouchers.isEmpty()}"
        style="grid-column: 1 / -1; text-align:center; padding:3rem 0; color:#64748b;">
        Bạn chưa có voucher nào trong ví.
      </div>
    </div>
  </div>
</body>

</html>
