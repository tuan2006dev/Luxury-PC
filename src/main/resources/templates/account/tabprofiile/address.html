<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">

<body>
  <!-- ============ TAB 7: ĐỊA CHỈ GIAO HÀNG ============ -->
  <div th:fragment="address" class="profile-section" id="sec-address">
    <div class="section-head">
      <div>
        <div class="section-h">Địa Chỉ Giao Hàng</div>
      </div>
      <button class="btn-edit" onclick="openAddressForm()">+ <span>Thêm Địa Chỉ Mới</span></button>
    </div>

    <!-- Form thêm / sửa địa chỉ -->
    <div id="address-form-container" class="edit-profile-panel" style="display:none; margin-bottom: 2rem;">
      <div id="address-form-title" style="font-size:1rem; font-weight:600; margin-bottom:1.5rem;">Thêm Địa Chỉ Mới</div>
      <input type="hidden" id="address-id-edit" />
      <div class="form-2col">
        <div class="form-group">
          <label class="form-label">Tên người nhận *</label>
          <input type="text" id="address-name" class="form-input" placeholder="Nguyễn Văn A" required />
        </div>
        <div class="form-group">
          <label class="form-label">Số điện thoại *</label>
          <input type="tel" id="address-phone" class="form-input" placeholder="0901234567" required />
        </div>
        <div class="form-group full">
          <label class="form-label">Địa chỉ chi tiết *</label>
          <input type="text" id="address-detail" class="form-input" placeholder="Số nhà, tên đường..." required />
        </div>
        <div class="form-group">
          <label class="form-label">Quận / Huyện *</label>
          <input type="text" id="address-district" class="form-input" placeholder="Quận 1" required />
        </div>
        <div class="form-group">
          <label class="form-label">Tỉnh / Thành phố *</label>
          <input type="text" id="address-city" class="form-input" placeholder="TP. Hồ Chí Minh" required />
        </div>
        <div class="form-group" style="display:none;">
          <input type="hidden" id="address-postal" value="700000" />
        </div>
      </div>
      <button type="button" class="btn-save" onclick="saveAddress()">Lưu Địa Chỉ</button>
      <button type="button" class="btn-edit" style="margin-left:.75rem;" onclick="closeAddressForm()">Hủy</button>
    </div>

    <div id="address-list-container" class="wishlist-grid">
      <p style="grid-column:span 2; text-align:center; color:#64748b; padding:2rem;">Đang tải danh sách địa chỉ...</p>
    </div>
  </div>
</body>

</html>
