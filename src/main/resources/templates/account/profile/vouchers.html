        <div th:fragment="vouchersTab" class="profile-section" id="sec-vouchers">
          <div class="section-head">
            <div>
              <div class="section-tag">Khuyến mãi</div>
              <div class="section-h">Ví Voucher Của Tôi</div>
            </div>
            <button class="btn-edit" onclick="document.getElementById('input-voucher-code').focus()">+ <span>Lưu Mã</span></button>
          </div>

          <div
            style="background:#f8fafc;border:1px solid #e2e8f0;padding:1.5rem;margin-bottom:2rem; display:flex; gap:10px;">
            <input type="text" id="input-voucher-code" class="form-input" style="flex:1" placeholder="Nhập mã voucher để lưu..." />
            <button class="btn-save" onclick="saveVoucherCode()">Lưu
              Mã</button>
          </div>

          <div class="wishlist-grid">
            <div class="wl-card" th:each="uv : ${vouchers}"
              style="display:flex; flex-direction:column; justify-content:space-between;"
              th:styleappend="${uv.status == 'CONSUMED' or (uv.voucher.endDate != null and uv.voucher.endDate.before(#dates.createNow())) or !uv.voucher.active} ? 'opacity: 0.5; filter: grayscale(1);' : ''">
              <div class="wl-info">
                <div class="wl-cat">Voucher · <span th:if="${uv.voucher.discountType.name() == 'PERCENTAGE'}">Giảm %</span><span
                    th:if="${uv.voucher.discountType.name() != 'PERCENTAGE'}">Giảm Tiền</span>
                </div>
                <div class="wl-name" style="font-size:1.3rem; letter-spacing:2px; font-weight:700;"
                  th:text="${uv.voucher.code}">CODE</div>
                <div class="wl-price" style="font-size:0.85rem; color:#333; font-weight:600; margin-top:5px;"
                  th:text="${uv.voucher.description}">Mô tả voucher</div>
                <div style="font-size:0.75rem; color:#64748b; margin-top:10px;">
                  <span>ĐH Tối thiểu:</span> <span style="color:#3b82f6;"
                    th:text="${#numbers.formatDecimal(uv.voucher.minOrderAmount, 1, 'COMMA', 0, 'POINT')} + '₫'">0₫</span><br />
                  <span>HSD:</span> <span th:if="${uv.voucher.endDate != null}"
                    th:text="${#calendars.format(uv.voucher.endDate, 'dd/MM/yyyy')}">12/12/2026</span>
                  <span th:if="${uv.voucher.endDate == null}">Vô thời
                    hạn</span>
                </div>
              </div>
              <div style="padding:1rem; border-top:1px dashed #cbd5e1; text-align:center;">
                <!-- Đã sử dụng -->
                <span th:if="${uv.status == 'CONSUMED'}" class="order-status"
                  style="background: rgba(255, 255, 255, 0.05); color: #64748b; border: 1px solid rgba(255, 255, 255, 0.1);">Đã sử dụng</span>

                <!-- Đã hết hạn hoặc ngừng hoạt động -->
                <span
                  th:if="${uv.status != 'CONSUMED' and ((uv.voucher.endDate != null and uv.voucher.endDate.before(#dates.createNow())) or !uv.voucher.active)}"
                  class="order-status status-canceled">Đã hết hạn</span>

                <!-- Sẵn sàng sử dụng -->
                <span
                  th:if="${uv.status != 'CONSUMED' and (uv.voucher.endDate == null or !uv.voucher.endDate.before(#dates.createNow())) and uv.voucher.active}"
                  class="order-status status-delivered">Sẵn sàng sử
                  dụng</span>
              </div>
            </div>
            <div th:if="${vouchers == null or vouchers.size() == 0}"
              style="grid-column: span 3; text-align: center; color: #64748b; padding: 2rem;">
              Bạn chưa có mã voucher nào. Hãy tìm thêm ở trang chủ!
            </div>
          </div>

          <script>
            function saveVoucherCode() {
              const code = document.getElementById('input-voucher-code').value.trim();
              if (!code) { toast('Vui lòng nhập mã!'); return; }
              fetch('/api/user-voucher/save?code=' + encodeURIComponent(code), {
                method: 'POST',
                headers: { [getCsrfHeader()]: getCsrfToken() }
              })
                .then(res => res.json())
                .then(data => {
                  toast(data.message || '✓ Mã voucher đã được lưu.');
                  if (data.success) {
                    document.getElementById('input-voucher-code').value = '';
                    setTimeout(() => location.reload(), 500);
                  }
                })
                .catch(err => {
                  console.error('Voucher error:', err);
                  toast('⚠️ Không thể lưu mã voucher.');
                });
            }
          </script>
        </div>
