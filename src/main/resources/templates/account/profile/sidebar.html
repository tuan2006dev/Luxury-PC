<aside th:fragment="sidebar" class="sidebar"
  style="width: 280px; flex-shrink: 0; background: #fff; border: 1px solid #eee; border-radius: 8px; overflow: hidden; height: fit-content;">
  <div class="sb-avatar-wrap" style="padding: 30px 20px; text-align: center; border-bottom: 1px solid #eee;">
    <div class="avatar-ring" style="width: 80px; height: 80px; margin: 0 auto 15px; position: relative;">
      <div class="avatar-inner"
        style="width: 100%; height: 100%; border-radius: 50%; overflow: hidden; background: #f5f5f5; border: 2px solid #fff; box-shadow: 0 0 10px rgba(0,0,0,0.1); display: flex; align-items: center; justify-content: center; font-size: 24px; color: #000; font-weight: 700;">
        <img th:if="${user != null && user.avatar != null && !user.avatar.isEmpty()}" th:src="@{${user.avatar}}"
          referrerpolicy="no-referrer" alt="Avatar" style="width:100%; height:100%; object-fit:cover;"
          id="avatar-img-view" />
        <span th:if="${user == null || user.avatar == null || user.avatar.isEmpty()}"
          th:text="${(user != null && user.fullName != null && !user.fullName.isEmpty()) ? user.fullName.substring(0,1).toUpperCase() : (user != null ? user.username.substring(0,1).toUpperCase() : 'U')}"
          id="avatar-initial-view">U</span>
      </div>
      <button class="avatar-edit" title="Đổi ảnh" onclick="document.getElementById('avatar-file-input').click()"
        style="position: absolute; bottom: 0; right: 0; background: #000; color: #fff; border: none; width: 26px; height: 26px; border-radius: 50%; cursor: pointer; font-size: 12px; display: flex; align-items: center; justify-content: center;"><i
          class="fa-solid fa-camera"></i></button>
      <input type="file" id="avatar-file-input" accept="image/*" style="display:none;" />
    </div>
    <div class="sb-name" th:text="${name}"
      style="font-size: 16px; font-weight: 700; margin-bottom: 5px; color: #000000;">Thanh Minh</div>
    <div class="sb-email" th:text="${email}" style="font-size: 13px; color: #666; margin-bottom: 10px;">
      thanh.minh@email.com</div>
    <div class="sb-badge" th:text="${userRank != 'None' ? 'Thành viên ' + userRank : 'Thành viên mới'}"
      style="display: inline-block; background: #f1f5f9; color: #475569; border: 1px solid #cbd5e1; padding: 3px 10px; border-radius: 20px; font-size: 12px; font-weight: 600;">
      Thành viên</div>
  </div>

  <nav class="sb-menu" style="padding: 15px 0;">
    <a class="sb-item active" onclick="setTab('info', event)" href="#"
      style="display: flex; align-items: center; padding: 12px 20px; color: #444; text-decoration: none; font-size: 14px; font-weight: 500; transition: all 0.2s;"><i
        class="fa-regular fa-user" style="width: 20px; text-align: center; margin-right: 10px;"></i> Thông Tin Cá
      Nhân</a>
    <a class="sb-item" onclick="setTab('orders', event)" href="#"
      style="display: flex; align-items: center; padding: 12px 20px; color: #444; text-decoration: none; font-size: 14px; font-weight: 500; transition: all 0.2s;"><i
        class="fa-solid fa-box" style="width: 20px; text-align: center; margin-right: 10px;"></i> Đơn Hàng Của
      Tôi</a>
    <a class="sb-item" onclick="setTab('vouchers', event)" href="#"
      style="display: flex; align-items: center; padding: 12px 20px; color: #444; text-decoration: none; font-size: 14px; font-weight: 500; transition: all 0.2s;"><i
        class="fa-solid fa-ticket" style="width: 20px; text-align: center; margin-right: 10px;"></i> Ví
      Voucher</a>
    <a class="sb-item" onclick="setTab('wishlist', event)" href="#"
      style="display: flex; align-items: center; padding: 12px 20px; color: #444; text-decoration: none; font-size: 14px; font-weight: 500; transition: all 0.2s;"><i
        class="fa-regular fa-heart" style="width: 20px; text-align: center; margin-right: 10px;"></i> Yêu
      Thích</a>

    <div style="height: 1px; background: #eee; margin: 10px 20px;"></div>

    <a class="sb-item" onclick="setTab('security', event)" href="#"
      style="display: flex; align-items: center; padding: 12px 20px; color: #444; text-decoration: none; font-size: 14px; font-weight: 500; transition: all 0.2s;"><i
        class="fa-solid fa-shield-halved" style="width: 20px; text-align: center; margin-right: 10px;"></i> Bảo
      Mật</a>
    <a class="sb-item" onclick="setTab('notifications', event)" href="#"
      style="display: flex; align-items: center; padding: 12px 20px; color: #444; text-decoration: none; font-size: 14px; font-weight: 500; transition: all 0.2s;"><i
        class="fa-regular fa-bell" style="width: 20px; text-align: center; margin-right: 10px;"></i> Thông Báo</a>
    <a class="sb-item" onclick="setTab('address', event)" href="#"
      style="display: flex; align-items: center; padding: 12px 20px; color: #444; text-decoration: none; font-size: 14px; font-weight: 500; transition: all 0.2s;"><i
        class="fa-solid fa-location-dot" style="width: 20px; text-align: center; margin-right: 10px;"></i> Địa Chỉ
      Giao Hàng</a>

    <div style="height: 1px; background: #eee; margin: 10px 20px;"></div>

    <form th:action="@{/logout}" method="POST">
      <button type="submit"
        style="width: 100%; display: flex; align-items: center; padding: 12px 20px; color: #ef4444; background: none; border: none; text-decoration: none; font-size: 14px; font-weight: 600; cursor: pointer; text-align: left; transition: all 0.2s;"><i
          class="fa-solid fa-arrow-right-from-bracket" style="width: 20px; text-align: center; margin-right: 10px;"></i>
        Đăng Xuất</button>
    </form>
  </nav>
</aside>
