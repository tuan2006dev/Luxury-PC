<!DOCTYPE html>
<html lang="vi" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Quản Lý Đơn Hàng — Luxury PC</title>
    <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" th:href="@{/css/admin/orders.css}" />
</head>
<body>
    <div class="sidebar">
        <a href="/" class="logo">LUXURY<span style="font-weight:300;">PC</span></a>
        <nav>
            <a href="/admin/dashboard" class="nav-link"><i class="fa-solid fa-chart-line"></i> Dashboard</a>
            <a href="/admin/orders" class="nav-link active"><i class="fa-solid fa-box"></i> Đơn Hàng</a>
            <a href="/admin/inventory" class="nav-link"><i class="fa-solid fa-warehouse"></i> Kho Hàng</a>
            <a href="/admin/categories" class="nav-link"><i class="fa-solid fa-layer-group"></i> Danh Mục</a>
            <a href="/admin/products" class="nav-link"><i class="fa-solid fa-microchip"></i> Sản Phẩm</a>
            <a href="/admin/vouchers" class="nav-link"><i class="fa-solid fa-ticket"></i> Voucher</a>
            <a href="/admin/flash-sales" class="nav-link"><i class="fa-solid fa-bolt"></i> Flash Sale</a>
            <a href="/admin/account" class="nav-link"><i class="fa-solid fa-users"></i> Người Dùng</a>
        </nav>
    </div>
    <div class="main-content">
        <div class="table-card">
            <div class="table-h">
                <h2>Quản Lý Đơn Hàng</h2>
                <span th:text="${orders.size()} + ' đơn hàng'">0 đơn hàng</span>
            </div>
            <table>
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Khách Hàng</th>
                        <th>Ngày Đặt</th>
                        <th>Tổng Tiền</th>
                        <th>Trạng Thái</th>
                        <th>Hành Động</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="o : ${orders}">
                        <td th:text="'#' + ${o.id}">#101</td>
                        <td>
                            <div th:text="${o.fullName}">Guest</div>
                            <div style="font-size:0.75rem; color:var(--muted)" th:text="${o.email}">guest@mail.com</div>
                        </td>
                        <td th:text="${#dates.format(o.createdAt, 'dd/MM/yyyy HH:mm')}">27/03/2026</td>
                        <td th:text="${#numbers.formatDecimal(o.totalPrice, 0, 'COMMA', 0, 'POINT')} + '₫'" style="color:var(--gold)">45.000.000₫</td>
                        <td>
                            <span th:class="'badge badge-' + ${o.status.toLowerCase()}" th:text="${o.status}">PENDING</span>
                        </td>
                        <td>
                            <form action="/admin/orders/update-status" method="post" style="display:flex; align-items:center;">
                                <input type="hidden" name="orderId" th:value="${o.id}">
                                <select name="status">
                                    <option value="PENDING" th:selected="${o.status == 'PENDING'}">Chờ xử lý</option>
                                    <option value="PAID" th:selected="${o.status == 'PAID'}">Đã thanh toán</option>
                                    <option value="SHIPPING" th:selected="${o.status == 'SHIPPING'}">Đang giao</option>
                                    <option value="COMPLETED" th:selected="${o.status == 'COMPLETED'}">Hoàn thành</option>
                                    <option value="CANCELLED" th:selected="${o.status == 'CANCELLED'}">Đã hủy</option>
                                </select>
                                <button type="submit" class="update-btn">Cập Nhật</button>
                            </form>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</body>
</html>
